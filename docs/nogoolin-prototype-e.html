<!--
  Nogoolin — Prototype E (single-file, sample data). Design plan, condensed:
  · Palettes: v4 (locked, AA-corrected roles) · jade-gold · jade-gold + lama maroon · jade-gold + khadag blue — :root[data-palette].
  · Type: Literata (display) + Golos Text (body 17px). One container (1280 + gutter 16px mobile), one 4px-based spacing scale.
  · Imagery: real photos on one shared "plinth" backdrop (multiply), 4:5 per D-09; specs as structured fields (D-09).
  · Motion: Motion Principles v2 — the deity never moves; only atmosphere loops; camera moves only on user steps / Эхлэх.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without blocking scripts, so the intro and «Алгасах» appear within 1 s even on a slow font request -->

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=swap"></noscript>

<style>
/* ===== tokens.css ===== */
/* Nogoolin Prototype E — tokens.css (owner: lead)
   Four palettes as CSS custom properties.
   Page: :root[data-palette="…"]  ·  Scoped preview/probe: [data-palette-scope="…"] (switcher swatches, contrast probes). */
:root{
  --f-display:'Literata','PT Serif',Georgia,serif;
  --f-body:'Golos Text','Segoe UI',system-ui,sans-serif;
  --fs-display:clamp(44px,6.2vw,88px);
  --fs-h1:clamp(34px,4.4vw,60px);
  --fs-h2:clamp(28px,3vw,42px);
  --fs-h3:clamp(21px,1.75vw,25px);
  --fs-lead:clamp(18px,1.35vw,20px);
  --fs-body:17px; --lh-body:1.6;
  --fs-ui:15.5px; --fs-meta:14.5px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;
  --container:1280px; --gutter:16px; --gap:16px; --nav-h:64px;
  /* v1.1 (owner 2026-11-08): softer corners. Previous: --radius:2px */
  --radius-sm:6px; --radius:10px; --radius-lg:16px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  --t-fast:.18s; --t:.32s; --t-slow:.6s;
  --z-hero-ui:20; --z-nav:50; --z-mega:55; --z-sheet:70; --z-search:75; --z-proto:90; --z-toast:95;
}
@media (min-width:600px){:root{--gutter:clamp(24px,4vw,56px); --gap:24px; --nav-h:72px}}

/* ---------- jade-gold: the agreed direction (default) — also the base of maroon / khadag ---------- */
:root,
:root[data-palette="jade-gold"],:root[data-palette="jade-gold-maroon"],:root[data-palette="jade-gold-khadag"],
[data-palette-scope="jade-gold"],[data-palette-scope="jade-gold-maroon"],[data-palette-scope="jade-gold-khadag"]{
  --bg:#F7F4EE; --bg-2:#EEE9DF; --surface:#FFFDF9;
  --plinth-0:#F5F0E8; --plinth-1:#E4DCCC; --plinth-floor:rgba(74,58,30,.07);
  --ink:#14261F; --ink-2:#4A5A52;
  --rule:rgba(20,38,31,.13); --rule-strong:#7D877F;
  --brand:#0E3A2D; --brand-2:#185443; --on-brand:#F4EFE3; --on-brand-2:#BCCFC2;
  --btn-bg:#0E3A2D; --btn-fg:#F4EFE3; --btn-bg-hover:#185443;
  --gold:#A8894F; --gold-hi:#D9C28C; --gold-line:rgba(168,137,79,.5);
  --accent:#0E3A2D; --accent-soft:#E1E9E2; --on-accent:#F4EFE3; --accent-text:#0E3A2D;
  --focus:#0E3A2D;
  --error:#9E2A1E; --error-soft:#F7E6E2; --ok:#1D5A40;
  --dark-0:#1E5644; --dark-1:#12392D; --dark-text:#F4EFE3; --dark-muted:#B9CDBF; --dark-line:rgba(217,194,140,.34); --dark-gold:#D9C28C;
  --scene-clear:#12392D; --scene-ground:#0F3227; --scene-pedestal:#1A4335; --scene-gold:#D9C28C; --scene-key:#FFEBC4; --scene-rim:#4DB78A; --scene-ambient:#2A5544;
  --sel-bg:#0E3A2D; --sel-fg:#F4EFE3;
  --shadow:0 28px 56px -32px rgba(20,38,31,.34);
}
/* + lama maroon accent */
:root[data-palette="jade-gold-maroon"],[data-palette-scope="jade-gold-maroon"]{
  --accent:#7B2430; --accent-soft:#F4E6E3; --on-accent:#FBF4EE; --accent-text:#7B2430;
  --focus:#7B2430; --sel-bg:#7B2430; --sel-fg:#FBF4EE;
}
/* + khadag blue accent */
:root[data-palette="jade-gold-khadag"],[data-palette-scope="jade-gold-khadag"]{
  --accent:#245B87; --accent-soft:#DFEBF5; --on-accent:#F6FAFD; --accent-text:#245B87;
  --focus:#245B87; --sel-bg:#245B87; --sel-fg:#F6FAFD; --scene-rim:#7DB3DB;
}
/* ---------- v4: locked tokens from agent-context/design.md (baseline) ----------
   Role mapping keeps every locked hex. Two roles are AA-corrected because the locked value fails:
   --muted #6B7D72 = 4.37:1 on #FFF → secondary text uses #5E7066 (5.27:1).
   --act #0BB555 = 2.71:1 on #FFF → used only as button fill / selected fill, never as text or the sole state cue.
   --saff-deep #A9861B = 3.43:1 → lines and ornament only. */
:root[data-palette="v4"],[data-palette-scope="v4"]{
  --bg:#FFFFFF; --bg-2:#F6F8F5; --surface:#FFFFFF;
  --plinth-0:#F6F8F5; --plinth-1:#E5ECE7; --plinth-floor:rgba(20,56,42,.06);
  --ink:#17352A; --ink-2:#5E7066;
  --rule:rgba(20,56,42,.12); --rule-strong:#7E8F85;
  --brand:#1B4634; --brand-2:#245842; --on-brand:#F5F2E6; --on-brand-2:#A9C7B4;
  /* Prototype E (D-12): owner replaced the neon #0BB555 button with the dark jade of the C header.
     Previous (D): --btn-bg:#0BB555; --btn-fg:#042F1C; --btn-bg-hover:#12C963; --accent:#0BB555; --on-accent:#042F1C */
  --btn-bg:#1B4634; --btn-fg:#F5F2E6; --btn-bg-hover:#245842;
  --gold:#A9861B; --gold-hi:#F2C94C; --gold-line:rgba(169,134,27,.45);
  --accent:#1B4634; --accent-soft:#E2F0E7; --on-accent:#F5F2E6; --accent-text:#17352A;
  --focus:#17352A;
  --error:#A3382B; --error-soft:#FBEAE6; --ok:#0B7A3E;
  --dark-0:#245842; --dark-1:#1B4634; --dark-text:#F5F2E6; --dark-muted:#A9C7B4; --dark-line:rgba(242,201,76,.32); --dark-gold:#F2C94C;
  --scene-clear:#1B4634; --scene-ground:#143528; --scene-pedestal:#173F30; --scene-gold:#F2C94C; --scene-key:#FFE9B0; --scene-rim:#3FC98A; --scene-ambient:#2A5643;
  --sel-bg:#17352A; --sel-fg:#F5F2E6;
  --shadow:0 28px 56px -32px rgba(20,56,42,.30);
}

/* dark zones (hero, story bands, footer): radial gradient, never a flat dark fill (WF-DS-03 §4) */
.dark-zone{
  --ink:var(--dark-text); --ink-2:var(--dark-muted); --rule:var(--dark-line); --rule-strong:var(--dark-muted);
  --focus:var(--dark-gold); --orn-bg:var(--dark-1); --gold:var(--dark-gold); --gold-line:var(--dark-line);
  --accent-text:var(--dark-gold);
  background:radial-gradient(ellipse at 50% 30%,var(--dark-0) 0%,var(--dark-1) 78%);
  color:var(--ink);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + 16px);
  scrollbar-color:var(--rule-strong) var(--bg);caret-color:var(--focus)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);
  line-height:var(--lh-body);font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;font-variant-numeric:lining-nums;
  transition:background-color var(--t) var(--ease-out),color var(--t) var(--ease-out)}
body.lock{height:100vh;height:100svh;overflow:hidden}
img,svg,canvas,video{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.12;letter-spacing:-.012em;margin:0;text-wrap:balance}
p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0}
p{text-wrap:pretty}
/* v1.1 (owner 2026-11-08): long-form text is justified. Only running prose, never headings, buttons, labels,
   prices, card names, tables or form hints. hyphens:auto where the browser has a Mongolian dictionary. */
.prose p,.t-lead,.pd-lead,.feat-desc,.how-text,.notice span,.steps p,.about-text,.footer-about p,.intro-home-lead,.qv-desc,.od-note{
  text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
::selection{background:var(--sel-bg);color:var(--sel-fg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border:3px solid var(--bg);border-radius:8px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.container{width:100%;max-width:calc(var(--container) + 2*var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:var(--gutter);top:-80px;z-index:100;padding:12px 18px;background:var(--btn-bg);color:var(--btn-fg);
  font:500 var(--fs-ui)/1.2 var(--f-body);text-decoration:none;border-radius:var(--radius)}
.skip-link:focus{top:12px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- type ---------- */
.t-display{font-family:var(--f-display);font-size:var(--fs-display);line-height:1.02;letter-spacing:-.02em;font-weight:500}
.t-h1{font-family:var(--f-display);font-size:var(--fs-h1);line-height:1.06;letter-spacing:-.018em;font-weight:500}
.t-h2{font-family:var(--f-display);font-size:var(--fs-h2);line-height:1.1;font-weight:500}
.t-h3{font-family:var(--f-display);font-size:var(--fs-h3);line-height:1.2;font-weight:500}
.t-lead{font-size:var(--fs-lead);line-height:1.55;color:var(--ink-2)}
.t-meta{font-size:var(--fs-meta);line-height:1.45;color:var(--ink-2)}
.t-ui{font-size:var(--fs-ui);line-height:1.3;font-weight:500}
.prose{max-width:66ch}
.prose p+p{margin-top:1em}
.price{font-family:var(--f-display);font-weight:500;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.005em;color:var(--ink);white-space:nowrap}

/* ---------- buttons & links ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:var(--radius);
  border:1px solid transparent;background:transparent;font:500 var(--fs-ui)/1.2 var(--f-body);letter-spacing:.01em;text-decoration:none;
  white-space:nowrap;transition:background-color var(--t-fast) var(--ease-out),color var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn-primary:hover{background:var(--btn-bg-hover)}
.btn-quiet{color:var(--ink);border-color:var(--rule-strong)}
.btn-quiet:hover{border-color:var(--ink)}
.btn-on-dark{color:var(--dark-text);border-color:var(--dark-line)}
.btn-on-dark:hover{border-color:var(--dark-gold)}
.btn-solid-light{background:var(--dark-text);color:var(--brand)}
.btn-solid-light:hover{background:var(--surface)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.62;cursor:not-allowed}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:inherit}
.icon-btn:hover{border-color:var(--rule-strong)}
.icon-btn .ic{width:22px;height:22px}
.link-arrow{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:500 var(--fs-ui)/1.3 var(--f-body);text-decoration:none;color:var(--ink)}
.link-arrow>span{text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:.32em;transition:text-decoration-color var(--t-fast)}
.link-arrow:hover>span{text-decoration-color:currentColor}
.link-arrow .ic{width:16px;height:16px;transition:transform var(--t-fast) var(--ease-out)}
.link-arrow:hover .ic{transform:translateX(3px)}
.link{color:var(--ink);text-decoration-color:var(--gold-line)}
.link:hover{text-decoration-color:currentColor}

/* ---------- chips (single row, never wraps: WF-HOME-01 / WF-LIST-02) ---------- */
.chip-row{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0;
  overscroll-behavior-x:contain}
.chip-row::-webkit-scrollbar{display:none}
.chip-row.has-overflow{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--rule-strong);border-radius:var(--radius);
  background:transparent;color:var(--ink);font:500 var(--fs-ui)/1.2 var(--f-body);white-space:nowrap;text-decoration:none;
  transition:border-color var(--t-fast),background-color var(--t-fast)}
.chip:hover{border-color:var(--ink)}
.chip .ic{width:16px;height:16px}
.chip .chip-check{display:none;color:var(--ink);stroke-width:2}
.chip[aria-pressed="true"],.chip[aria-current="page"],.chip[aria-current="true"],.chip.is-on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip[aria-pressed="true"] .chip-check,.chip[aria-current="page"] .chip-check,.chip[aria-current="true"] .chip-check,.chip.is-on .chip-check{display:block}
.chip .chip-count{color:var(--ink-2);font-weight:400}
.chip[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- the plinth: one backdrop for every product photo ----------
   White-backdrop studio photos are multiplied onto a warm paper plinth so all products share one light and one floor. */
.plinth{position:relative;display:block;overflow:hidden;isolation:isolate;
  /* Prototype E (D-12): photos are alpha cut-outs that sit directly on the page; no box behind them.
     Previous (D): background:radial-gradient(130% 95% at 50% 36%,var(--plinth-0) 0%,var(--plinth-0) 42%,var(--plinth-1) 100%) */
  background:transparent}
.plinth::after{content:"";position:absolute;left:16%;right:16%;top:92%;height:4.5%;z-index:0;pointer-events:none;border-radius:50%;
  /* soft contact shadow on the shared floor line (cut-outs end at 90% of the 4:5 canvas) */
  background:radial-gradient(closest-side,rgba(40,30,15,.20),rgba(40,30,15,.08) 55%,transparent);filter:blur(2px)}
.plinth>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.r-4x5{aspect-ratio:4/5}
.r-1x1{aspect-ratio:1/1}
.r-3x2{aspect-ratio:3/2}

/* ---------- status ---------- */
.status{display:inline-flex;align-items:center;gap:8px;font:500 var(--fs-meta)/1.3 var(--f-body);color:var(--ink-2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status[data-stock="pre_order"]::before{background:var(--gold)}
.status[data-stock="out_of_stock"]::before{background:var(--rule-strong)}

/* ---------- forms ---------- */
.field{display:grid;gap:8px;align-content:start}
.field-label{font:500 15.5px/1.3 var(--f-body);color:var(--ink)}
.field-label .opt{color:var(--ink-2);font-weight:400}
.input,.textarea,.select{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--rule-strong);border-radius:var(--radius-sm);font-size:max(16px,1em);
  background:var(--surface);color:var(--ink);font:400 17px/1.45 var(--f-body);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.textarea{min-height:148px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:var(--ink-2);opacity:1}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.field.is-invalid .input,.field.is-invalid .textarea{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
.field-msg{display:flex;gap:8px;align-items:flex-start;font:500 15px/1.4 var(--f-body);color:var(--error)}
.field-msg .ic{width:18px;height:18px;margin-top:1px}
.field-hint{font:400 var(--fs-meta)/1.45 var(--f-body);color:var(--ink-2)}

/* ---------- breadcrumbs ---------- */
.crumbs ol{display:flex;flex-wrap:wrap;gap:4px 10px;list-style:none;margin:0;padding:0;font:400 var(--fs-meta)/1.5 var(--f-body);color:var(--ink-2)}
.crumbs li{display:inline-flex;align-items:center;gap:10px;min-width:0}
.crumbs li+li::before{content:"/";color:var(--rule-strong)}
.crumbs a{color:var(--ink-2);text-decoration:none;padding:6px 0}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink)}

/* ---------- ornament: thin-line ulzii (sparingly) ---------- */
.orn{display:block;color:var(--gold);--orn-w:1.25px}
.orn-rule{display:flex;align-items:center;gap:18px;color:var(--gold)}
.orn-rule::before,.orn-rule::after{content:"";flex:1;height:1px;background:var(--gold-line)}
.orn-rule .orn{width:30px;height:30px}

/* ---------- skeleton (static: WF-MO-02 — nothing loops) ---------- */
.skel{background:var(--bg-2);border-radius:var(--radius);animation:skelIn .3s var(--ease-out) both}
.skel-line{height:14px;margin-top:10px}
@keyframes skelIn{from{opacity:0}to{opacity:1}}

/* ---------- toast ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));z-index:var(--z-toast);display:flex;justify-content:center;pointer-events:none;padding-inline:var(--gutter)}
.toast{display:flex;align-items:center;gap:18px;max-width:560px;padding:14px 18px;border-radius:var(--radius-lg);background:var(--brand);color:var(--on-brand);
  font:500 var(--fs-ui)/1.4 var(--f-body);box-shadow:var(--shadow);pointer-events:auto;opacity:0;transform:translateY(8px);
  transition:opacity var(--t) var(--ease-out),transform var(--t) var(--ease-out)}
.toast.is-in{opacity:1;transform:none}
.toast a{color:var(--on-brand);text-decoration-color:var(--gold-hi);white-space:nowrap}

/* ---------- view transitions (shared product media, list ↔ detail) ---------- */
#nav{view-transition-name:ng-nav}
#proto-root{view-transition-name:ng-proto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:var(--ease-out)}
::view-transition-group(ng-media){animation-duration:.5s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
::view-transition-old(ng-media),::view-transition-new(ng-media){height:100%;object-fit:contain}
::view-transition-old(ng-media){animation:none;opacity:0}
::view-transition-new(ng-media){animation:none}
.view-enter{animation:viewIn .28s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}
/* ===== chrome.css ===== */
/* Nogoolin Prototype E — chrome.css (owner: chrome agent)
   Header (Prototype C style on a dark jade bar), mobile menu, footer + «Бидний тухай», prototype panel, PWA hint. Tokens only. */

/* ---------------------------------------------------------------- header */
.nav{position:sticky;top:0;left:0;right:0;z-index:var(--z-nav);background:var(--dark-1);color:var(--dark-text);
  --page-focus:var(--focus); /* the page's focus colour, restored inside light popovers (search suggestions) */
  transition:background-color .3s var(--ease-out),box-shadow .3s var(--ease-out),transform .26s var(--ease-out);box-shadow:0 1px 0 var(--dark-line)}
/* v1.1 mobile: slides away on scroll down (chrome.js toggles .is-hidden; never while menu/search/panel is open) */

@media (min-width:961px){.nav.is-hidden{transform:none}}
.nav-row,.nav-panel{--focus:var(--dark-gold);--orn-bg:var(--dark-1)}
body[data-route="home"] .nav{margin-bottom:calc(-1 * var(--nav-h))}

/* over the (already dark) home hero the bar dissolves into a soft scrim so the hero art reads through */

.nav-row{display:flex;align-items:center;gap:var(--s6);height:var(--nav-h)}
.nav-logo{display:inline-flex;align-items:center;gap:12px;min-height:44px;text-decoration:none;color:var(--dark-text);flex:none}
.nav-knot{width:30px;height:30px;color:var(--dark-gold);--orn-w:1.5px}
.nav-word{font:500 17px/1 var(--f-display);letter-spacing:.2em;white-space:nowrap}
.nav-primary{flex:none}
.nav-links{display:flex;align-items:center;gap:var(--s6);list-style:none;margin:0;padding:0}
.nav-link,.nav-cart-text{position:relative}
.nav-link{display:inline-flex;align-items:center;min-height:44px;color:var(--dark-muted);text-decoration:none;
  font:400 var(--fs-ui)/1.2 var(--f-body);transition:color var(--t) var(--ease-out)}
.nav-link::after,.nav-cart-text::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left;transition:transform var(--t) var(--ease-out)}
.nav-cart-text::after{bottom:-6px}
.nav-link:hover,.nav-link[aria-current="page"],.nav-cart:hover,.nav-cart[aria-current="page"]{color:var(--dark-text)}
.nav-link:hover::after,.nav-cart:hover .nav-cart-text::after{transform:scaleX(1)}
.nav-link[aria-current="page"]::after,.nav-cart[aria-current="page"] .nav-cart-text::after{transform:scaleX(1);height:2px;background:var(--dark-gold)}
.nav-search{margin-left:auto;flex:0 1 auto;min-width:0}
.nav-actions{display:flex;align-items:center;gap:var(--s4);flex:none}
.nav-cart{display:inline-flex;align-items:center;gap:18px;min-height:44px;min-width:44px;padding:0 2px;color:var(--dark-text);text-decoration:none;
  font:400 var(--fs-ui)/1.2 var(--f-body)}
.nav-cart-icwrap{position:relative;display:inline-grid;place-items:center}
.nav-cart-ic{width:22px;height:22px}
.nav-badge{position:absolute;top:-8px;right:-11px;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:var(--radius);background:var(--dark-gold);color:var(--dark-1);font:600 14px/1 var(--f-body);font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2px var(--dark-1)}
.nav-badge[hidden]{display:none}
.nav-icon-btn{display:none;width:44px;height:44px;place-items:center;padding:0;background:transparent;border:0;color:var(--dark-text);border-radius:var(--radius);cursor:pointer}
.nav-icon-btn .ic{width:22px;height:22px}
.nav-icon-btn:hover{color:var(--dark-gold)}
@media (max-width:960px){
  .nav-primary,.nav-search{display:none}
  .nav-icon-btn{display:inline-grid}
  .nav-row{gap:var(--s3)}
  .nav-actions{margin-left:auto;gap:2px}
  .nav-cart{justify-content:center}
  .nav-cart-text{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav-burger{margin-right:-6px}
}
@media (max-width:380px){.nav-word{letter-spacing:.14em;font-size:16px}}

/* mobile menu panel (continues the bar) */
.nav-panel{position:absolute;top:100%;left:0;right:0;background:var(--dark-1);color:var(--dark-text);border-top:1px solid var(--dark-line);
  box-shadow:0 18px 30px -18px rgba(0,0,0,.45)}
.nav-panel ul{list-style:none;margin:0;padding:var(--s1) var(--gutter) var(--s4)}
.nav-panel li+li{border-top:1px solid var(--dark-line)}
.nav-panel-link{display:flex;align-items:center;justify-content:space-between;min-height:56px;font:400 17px/1.3 var(--f-body);text-decoration:none;color:var(--dark-text)}

@media (min-width:961px){.nav-panel{display:none!important}}
@media (prefers-reduced-motion:reduce){.nav,.nav-link,.nav-link::after,.nav-cart-text::after{transition:none}}
.nav-panel{border-radius:0 0 var(--radius) var(--radius)}

/* ---------------------------------------------------------------- footer */

.footer-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:var(--s7);align-items:start}

.footer-tag{max-width:36ch}
.footer-about{display:flex;flex-direction:column;gap:var(--s3);max-width:56ch}
.footer-h{font:500 24px/1.2 var(--f-display);margin:0;scroll-margin-top:calc(var(--nav-h) + 32px)}
.footer-h:focus{outline:none}

.footer-about p{margin:0}
.footer-links{display:flex;flex-direction:column}
.footer-links>*{display:flex;align-items:center;min-height:44px;background:transparent;border:0;color:var(--ink);text-decoration:none;text-align:left;

.footer-links>a:hover,.footer-links>button:hover{text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:.3em}
.footer-bottom{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s6);margin-top:var(--s7);padding-top:var(--s4);border-top:1px solid var(--rule)}

  text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:.3em;border-radius:var(--radius-sm)}

/* ---------------------------------------------------------------- prototype panel (footer «Prototype тохиргоо») */
html.is-proto-open,html.is-proto-open body{overflow:hidden}
.proto-backdrop{position:fixed;inset:0;z-index:var(--z-proto);background:color-mix(in srgb,var(--dark-1) 45%,transparent)}
.proto-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:calc(var(--z-proto) + 1);width:min(460px,calc(100vw - 32px));
  max-height:min(84vh,760px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border:1px solid var(--rule);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:var(--s5)}
@media (max-width:640px){.proto-panel{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:86vh;border-radius:var(--radius-lg) var(--radius-lg) 0 0;border-bottom:0;
  padding:var(--s4) var(--gutter) calc(var(--s5) + env(safe-area-inset-bottom, 0px))}}
.proto-panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2)}
.proto-title{font:500 var(--fs-h3)/1.2 var(--f-display)}
.proto-lead{margin-bottom:var(--s2)}
.proto-sim{margin-top:var(--s3);border-top:1px solid var(--rule);padding-top:var(--s4)}
.proto-sim h3{margin-bottom:var(--s2)}
.proto-switch{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0;
  background:transparent;border:0;color:var(--ink);font:400 var(--fs-ui)/1.2 var(--f-body);text-align:left;border-radius:var(--radius-sm)}
.proto-switch::after{content:"";flex:none;width:36px;height:20px;border-radius:var(--radius-sm);border:1px solid var(--rule-strong);background:var(--bg-2);
  transition:background-color var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
.proto-switch::before{content:"";position:absolute;right:19px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:calc(var(--radius-sm) - 2px);background:var(--ink-2);
  transition:right var(--t-fast) var(--ease-out),background-color var(--t-fast) var(--ease-out)}
.proto-switch[aria-checked="true"]::after{background:var(--accent);border-color:var(--accent)}
.proto-switch[aria-checked="true"]::before{right:4px;background:var(--on-accent)}
@media (prefers-reduced-motion:reduce){.proto-switch::before,.proto-switch::after{transition:none}}
.proto-submit{border:0;margin:var(--s3) 0 0;padding:0;display:flex;flex-direction:column}
.proto-submit legend{padding:0 0 var(--s1);color:var(--ink-2);font-size:var(--fs-meta)}
.proto-radio{display:flex;align-items:center;gap:10px;min-height:44px;font:400 var(--fs-ui)/1.3 var(--f-body);cursor:pointer}
.proto-radio input{width:20px;height:20px;margin:0;accent-color:var(--btn-bg)}
.proto-sim-actions{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
@media (max-width:640px){.proto-sim-actions .btn{flex:1 1 100%}}

/* ---------------------------------------------------------------- PWA hint */
.pwa-band{display:flex;align-items:center;gap:var(--s4) var(--s5);flex-wrap:wrap;padding-block:var(--s5);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pwa-icon{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:var(--radius)}

.pwa-actions{display:flex;gap:var(--s3);flex-wrap:wrap}
.pwa-dialog{position:fixed;inset:0;z-index:var(--z-toast);display:grid;place-items:center;background:color-mix(in srgb,var(--dark-1) 55%,transparent);padding:var(--gutter)}
.pwa-dialog-inner{background:var(--surface);color:var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:var(--s6);max-width:440px;display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3)}
.pwa-note{color:var(--ink-2)}

/* lead v1.1: 320 px phones — logo + three 44 px icons must fit inside the gutters (was 2 px too wide) */
@media (max-width:359px){

/* step2: ordering toggle */
html[data-ordering="off"] [data-ord-only="on"]{display:none!important}
html:not([data-ordering="off"]) [data-ord-only="off"]{display:none!important}
.footer-admin{text-decoration:none}
/* ===== search.css ===== */
/* Nogoolin Prototype E — search.css (owner: chrome agent). Tokens only, no hex literals.
   D-12: the field has NO border/box. Rest = magnifier + «Хайх»; hover = 1px underline fades in; focus = 2px underline in --focus. */

#site-search { display: flex; align-items: center; }

.search { position: relative; width: clamp(190px, 19vw, 280px); }
.search-field {
  position: relative; display: flex; align-items: center; gap: 10px;
  height: 44px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink);
}
.search-field::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 4px; height: 1px;
  background: var(--rule-strong); opacity: 0; pointer-events: none;
  transition: opacity var(--t) var(--ease-out), height var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out);
}
.search-field:hover::after { opacity: 1; }
.search-field:focus-within::after { opacity: 1; height: 2px; background: var(--focus); }
.search-field .search-ic { width: 20px; height: 20px; flex: none; color: var(--ink-2); }
.search-input {
  flex: 1 1 auto; min-width: 0; height: 100%; padding: 0;
  border: 0; background: transparent; color: inherit;
  font: inherit; font-size: max(16px, var(--fs-ui)); line-height: 1;
}
.search-input::placeholder { color: var(--ink-2); opacity: 1; }
.search-input:focus { outline: none; }
.search-input::-webkit-search-cancel-button { display: none; }
.search-clear-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; margin: 0 -12px 0 calc(-1 * var(--s2)); flex: none;
  border: 0; background: transparent; color: var(--ink-2);
  cursor: pointer; border-radius: var(--radius);
}
.search-clear-btn[hidden] { display: none; }
.search-clear-btn .ic { width: 16px; height: 16px; }
.search-clear-btn:hover { color: var(--ink); }
.search-clear-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* in the dark jade header bar (--focus there is the bar's gold, see chrome.css) */
#nav .search-field { color: var(--dark-text); }
#nav .search-field::after { background: var(--dark-muted); }
#nav .search-field:focus-within::after { background: var(--focus); }
#nav .search-field .search-ic,
#nav .search-input::placeholder,
#nav .search-clear-btn { color: var(--dark-muted); }
#nav .search-clear-btn:hover { color: var(--dark-text); }
#nav .search-panel { --focus: var(--page-focus); }
@media (prefers-reduced-motion: reduce) { .search-field::after { transition: none; } }

/* panel (shared: desktop dropdown + mobile overlay) */
.search-panel {
  position: absolute; top: calc(100% + var(--s2)); right: 0; z-index: var(--z-search);
  width: min(560px, 100vw - 2 * var(--gutter));
  max-height: min(70vh, 600px); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: var(--s3) 0 var(--s2);
}
.search-pre:empty { display: none; }
.search-group { padding: 0 var(--s3) var(--s3); }
.search-group:last-child { padding-bottom: var(--s1); }
.search-group-title {
  margin: 0; padding: var(--s1) var(--s2) var(--s1);
  font-size: var(--fs-meta); line-height: 1.4; color: var(--ink-2);
}
.search-recent-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: 0 var(--s3); }
.search-recent-head .search-group-title { padding-bottom: 0; }
.search-clear-recent {
  min-height: 44px; padding: 0 var(--s2); border: 0; background: transparent; color: var(--ink-2); font-size: var(--fs-meta);
  cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: .25em;
}
.search-clear-recent:hover { color: var(--ink); }

.search-opt-list { list-style: none; margin: 0; padding: 0; }
.search-opt-all { padding: var(--s1) var(--s3) 0; border-top: 1px solid var(--rule); margin-top: var(--s1); }
.search-option {
  display: flex; align-items: center; gap: var(--s3);
  min-height: 44px; padding: var(--s1) var(--s2);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: var(--fs-ui); line-height: 1.35; color: var(--ink);
}
.search-option mark.hl { font-weight: 600; background: var(--accent-soft); color: inherit; border-radius: calc(var(--radius-sm) / 3); }
.search-option.is-active, .search-option:hover { background: var(--bg-2); }
.search-option.is-active { box-shadow: inset 0 0 0 1px var(--rule-strong); }

.search-cat-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px var(--s2); }
.search-option-cat { gap: var(--s3); }
.search-cat-plinth { display: block; width: 40px; height: 50px; flex: none; border-radius: var(--radius-sm); overflow: hidden; }
.search-cat-plinth img { width: 100%; height: 100%; object-fit: contain; }
.search-cat-thumb-empty { background: var(--bg-2); }
.search-cat-text { display: flex; flex-direction: column; min-width: 0; }
.search-cat-name { font-size: var(--fs-ui); }
.search-cat-soon { font-size: var(--fs-meta); color: var(--ink-2); }

.search-opt-products .search-option-product { align-items: center; }
.search-thumb, .search-thumb-empty {
  display: block; width: 48px; height: 60px; flex: none; border-radius: 0; overflow: hidden; /* product cut-outs: no radius */
}
.search-thumb-empty { background: var(--bg-2); border-radius: var(--radius-sm); }
.search-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.search-prod-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.search-prod-name { font-size: var(--fs-ui); }
.search-prod-meta { font-size: var(--fs-meta); color: var(--ink-2); }
.search-prod-meta .price { font-size: var(--fs-meta); }

.search-option-all { color: var(--accent-text); font-weight: 600; }

.search-empty-title { margin: 0 var(--s4) var(--s1); font: 500 var(--fs-body)/1.4 var(--f-body); }
.search-empty-hint { margin: 0 var(--s4) var(--s3); font-size: var(--fs-meta); color: var(--ink-2); }

/* mobile overlay */
.search-overlay {
  position: fixed; inset: 0; z-index: var(--z-search);
  background: var(--bg); color: var(--ink); display: none; flex-direction: column;
}
html.is-search-locked, body.is-search-open { overflow: hidden; }
body.is-search-open .search-overlay { display: flex; }
@media (prefers-reduced-motion: no-preference) {
  body.is-search-open .search-overlay { animation: searchIn .24s var(--ease-out) both; }
}
@keyframes searchIn { from { opacity: 0; } to { opacity: 1; } }
.search-overlay-bar { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; gap: var(--s2); padding: var(--s3) var(--gutter) 0; }
.search-overlay-host { flex: 1 1 auto; min-width: 0; height: 100%; overflow: auto; overscroll-behavior: contain; padding-bottom: var(--s6); }
.search-overlay-close {
  display: flex; align-items: center; justify-content: center; flex: none;
  width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  border-radius: var(--radius);
}
.search-overlay-close .ic { width: 22px; height: 22px; }
.search-overlay-close:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.search-overlay-host .search { width: 100%; }
.search-overlay-host .search-field { position: sticky; top: 0; z-index: 1; background: var(--bg); }
.search-overlay-host .search-input { font-size: max(16px, var(--fs-body)); }
.search-overlay-host .search-panel {
  position: static; width: 100%; max-height: none; overflow: visible; box-shadow: none; border: 0; padding-top: var(--s4);
  background: transparent;
}
.search-overlay-host .search-group { padding-inline: 0; }
.search-overlay-host .search-recent-head, .search-overlay-host .search-opt-all { padding-inline: 0; }
.search-overlay-host .search-empty-title, .search-overlay-host .search-empty-hint { margin-inline: 0; }

@media (max-width: 960px) {
  #site-search { display: none; }
}
@media (min-width: 961px) {
  .search-overlay { display: none !important; }
}
/* ===== intro.css ===== */
/* ===== Prototype E — Intro + home-state hero (adapted from Prototype C) =====
   Scoped under #hero. Colours come only from tokens.css custom properties.
   The WebGL canvas is transparent: this radial jade gradient IS the sky (no black, no stars). */
@property --sky-x{syntax:'<percentage>';inherits:false;initial-value:50%}
@property --sky-y{syntax:'<percentage>';inherits:false;initial-value:34%}
#hero{
  --intro-scrim:color-mix(in srgb, var(--dark-1) 92%, transparent);
  --intro-scrim-2:color-mix(in srgb, var(--dark-1) 55%, transparent);
  --intro-scrim-0:color-mix(in srgb, var(--dark-1) 0%, transparent);
  --sky-x:50%;--sky-y:34%;
  position:relative;overflow:hidden;isolation:isolate;color:var(--dark-text);
  background:radial-gradient(ellipse 62% 78% at var(--sky-x) var(--sky-y), var(--dark-0) 0%, var(--dark-1) 100%), var(--dark-1);
  transition:--sky-x 1.2s var(--ease-in-out),--sky-y 1.2s var(--ease-in-out);
  height:100vh;height:100svh;min-height:480px;
}
#hero[data-phase="home"],#hero[data-phase="morph"],#hero[data-phase="fallback"]{--sky-x:70%;--sky-y:46%}
#hero.is-home{height:clamp(520px, 74vh, 780px)}
@media (max-width:700px){#hero.is-home{height:88vh;height:88svh;min-height:600px}}

#hero .intro-canvas{position:absolute;inset:0;z-index:0}
#hero .intro-canvas canvas{display:block}
/* the Tara cut-out, mapped onto the world-fixed plane by a CSS homography from intro.js */
#hero .intro-deity{position:absolute;left:0;top:0;z-index:1;width:933px;height:1373px;transform-origin:0 0;
  opacity:0;visibility:hidden;pointer-events:none;will-change:transform,opacity}
#hero .intro-deity img{display:block;width:100%;height:100%}
#hero.is-fallback .intro-deity{display:none}

/* loading: a fade in from the fog, not a camera move; never blank white/black */
#hero .intro-veil{position:absolute;inset:0;z-index:1;background:var(--dark-1);opacity:1;pointer-events:none;
  transition:opacity .6s var(--ease-out)}
#hero.is-ready .intro-veil{opacity:0}

/* scrims keep type legible over the 3D field */
#hero .intro-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .7s var(--ease-out);
  background:linear-gradient(to top, var(--intro-scrim) 0%, var(--intro-scrim-2) 20%, var(--intro-scrim-0) 40%)}
#hero[data-phase="final"] .intro-scrim{opacity:1}
#hero[data-phase="home"] .intro-scrim,#hero[data-phase="fallback"] .intro-scrim{opacity:1;
  background:linear-gradient(90deg, var(--intro-scrim) 0%, var(--intro-scrim-2) 30%, var(--intro-scrim-0) 52%)}

/* the whole field is the "continue" control during the intro */
#hero .intro-stage{position:absolute;inset:0;z-index:3;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
#hero .intro-stage:focus-visible{box-shadow:none}
#hero.is-kbd .intro-stage:focus-visible{box-shadow:inset 0 0 0 2px var(--dark-gold)}
#hero[data-phase="home"] .intro-stage,#hero[data-phase="fallback"] .intro-stage,#hero[data-phase="morph"] .intro-stage{display:none}

/* small mark + skip (intro only) */
#hero .intro-mark{position:absolute;z-index:4;top:24px;left:var(--gutter);display:flex;align-items:center;gap:12px;
  font-size:15px;letter-spacing:.28em;font-weight:500;color:var(--dark-text);pointer-events:none}
#hero .intro-mark svg{width:22px;height:22px;color:var(--dark-gold)}
#hero .intro-skip{position:absolute;z-index:5;top:18px;right:var(--gutter);display:inline-flex;align-items:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:var(--radius);background:color-mix(in srgb, var(--dark-1) 45%, transparent);border:1px solid var(--dark-line);
  color:var(--dark-muted);font-size:var(--fs-ui);letter-spacing:.02em;transition:color var(--t) var(--ease-out),border-color var(--t) var(--ease-out)}
#hero .intro-skip:hover{color:var(--dark-text);border-color:var(--dark-gold)}
#hero .intro-skip svg{width:14px;height:14px}
#hero .intro-mark,#hero .intro-skip{transition:opacity .4s var(--ease-out),visibility 0s}
#hero[data-phase="home"] .intro-mark,#hero[data-phase="home"] .intro-skip,
#hero[data-phase="fallback"] .intro-mark,#hero[data-phase="fallback"] .intro-skip,
#hero[data-phase="morph"] .intro-mark,#hero[data-phase="morph"] .intro-skip{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#hero .intro-skip:focus-visible{outline:2px solid var(--dark-gold);outline-offset:3px}

/* ---- key sentences: blur out fast, reveal word by word ---- */
#hero .intro-lines{position:absolute;inset:0;z-index:4;pointer-events:none}
#hero[data-phase="home"] .intro-lines,#hero[data-phase="fallback"] .intro-lines{display:none}
#hero .intro-line{position:absolute;top:50%;margin:0;max-width:min(14.5em, 34vw);
  font-family:var(--f-display);font-weight:400;font-size:clamp(28px, 2.7vw, 42px);line-height:1.22;letter-spacing:-.01em;
  color:var(--dark-text);text-shadow:0 2px 28px var(--dark-1),0 1px 2px var(--dark-1);
  transform:translateY(-50%);opacity:0;visibility:hidden;filter:blur(8px);
  transition:opacity .24s ease-in,filter .24s ease-in,visibility 0s linear .24s}
#hero .intro-line[data-side="left"]{left:max(var(--gutter), 7vw)}
#hero .intro-line[data-side="right"]{right:max(var(--gutter), 7vw);text-align:right}
#hero .intro-line::before{content:"";display:block;width:48px;height:1px;margin-bottom:22px;background:var(--dark-gold);
  transform:scaleX(0);transform-origin:left}
#hero .intro-line[data-side="right"]::before{margin-left:auto;transform-origin:right}
#hero .intro-line .w{display:inline-block}
#hero .intro-line.is-in{opacity:1;visibility:visible;filter:none;transition:none}
#hero .intro-line.is-in::before{animation:introRule .9s var(--ease-out) .05s both}
#hero .intro-line.is-in .w{animation:introWord .82s var(--ease-out) backwards;animation-delay:calc(var(--i) * 65ms + 60ms)}

@keyframes introWord{
  from{opacity:0;filter:blur(10px);transform:translateY(.34em)}
  to{opacity:1;filter:blur(0);transform:none}
}
@keyframes introRise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
@keyframes introRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---- final: wordmark + tagline + start, in the clear lower field under the framed statue ---- */
#hero .intro-final{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(68px, 9.5vh, 100px);z-index:4;
  display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .3s ease-in,visibility 0s linear .3s}
#hero .intro-final.is-in{opacity:1;visibility:visible;transition:none}
#hero .intro-wordmark{font-family:var(--f-display);font-weight:500;font-size:clamp(44px, 5.5vw, 78px);line-height:1;
  letter-spacing:.12em;margin-right:-.12em;color:var(--dark-text)}
#hero .intro-wordmark span{color:var(--dark-gold)}
#hero .intro-tagline{margin:20px 0 0;font-size:clamp(17px, 1.4vw, 20px);color:var(--dark-muted);letter-spacing:.01em}
#hero .intro-start{margin-top:26px;min-width:180px;min-height:52px;font-size:16px;letter-spacing:.06em;pointer-events:auto}
#hero .intro-final.is-in .intro-wordmark{animation:introMark 1.15s var(--ease-out) backwards}
#hero .intro-final.is-in .intro-tagline{animation:introRise .8s var(--ease-out) .28s backwards}
#hero .intro-final.is-in .intro-start{animation:introRise .8s var(--ease-out) .46s backwards}
#hero .intro-start.is-nudge{animation:introNudge .7s var(--ease-out)!important}
@keyframes introMark{
  from{opacity:0;filter:blur(14px);letter-spacing:.32em;margin-right:-.32em}
  to{opacity:1;filter:blur(0);letter-spacing:.12em;margin-right:-.12em}
}
@keyframes introNudge{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--dark-gold) 50%, transparent)}
  100%{box-shadow:0 0 0 16px color-mix(in srgb, var(--dark-gold) 0%, transparent)}
}

/* ---- hint (fades in once, then static — WF-MO-02) + progress, bottom centre ---- */
#hero .intro-foot{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;transition:opacity .4s var(--ease-out)}
#hero[data-phase="home"] .intro-foot,#hero[data-phase="fallback"] .intro-foot,#hero[data-phase="morph"] .intro-foot{opacity:0;visibility:hidden}
#hero .intro-hint{margin:0;font-size:15px;letter-spacing:.04em;color:var(--dark-muted);opacity:0;
  transition:opacity .6s var(--ease-out)}
#hero .intro-hint.is-in{opacity:1}
#hero:not([data-step="0"]) .intro-hint{opacity:0}
#hero .intro-progress{display:flex;align-items:center;gap:8px}
#hero .intro-progress .tick{position:relative;width:28px;height:1px;overflow:hidden;background:color-mix(in srgb, var(--dark-text) 26%, transparent)}
#hero .intro-progress .tick::after{content:"";position:absolute;inset:0;background:var(--dark-gold);transform:scaleX(0);transform-origin:left;
  transition:transform .9s var(--ease-out)}
#hero .intro-progress .tick.is-on::after{transform:scaleX(1)}
#hero .intro-count{margin-left:10px;min-width:3.2em;font-size:var(--fs-meta);letter-spacing:.08em;color:var(--dark-muted);transition:opacity .3s}
#hero[data-step="0"] .intro-count{opacity:0}

/* ---- home state: copy left in the page container, deity right (setViewOffset) ---- */
#hero .intro-home{position:absolute;inset:0;z-index:4;display:flex;align-items:center;padding-top:var(--nav-h);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s linear .2s}
#hero[data-phase="home"] .intro-home,#hero[data-phase="fallback"] .intro-home{opacity:1;visibility:visible;pointer-events:auto;transition:none}
#hero .intro-home .container{width:100%}
#hero .intro-home-title{max-width:11.5em;font-size:clamp(36px, 4.2vw, 60px);line-height:1.06;letter-spacing:-.02em;color:var(--dark-text);font-weight:500}
#hero .intro-home-title:focus{outline:none}
#hero .intro-home-lead{margin-top:22px;max-width:31em;font-size:var(--fs-body);line-height:1.6;color:var(--dark-muted)}
#hero .intro-home-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
/* entrance: opacity + rise only (no blur), fill "backwards" so nothing lingers after it ends */
#hero[data-phase="home"] .intro-home-title,#hero[data-phase="fallback"] .intro-home-title{animation:introRise .7s var(--ease-out) backwards}
#hero[data-phase="home"] .intro-home-lead,#hero[data-phase="fallback"] .intro-home-lead{animation:introRise .7s var(--ease-out) .1s backwards}
#hero[data-phase="home"] .intro-home-actions,#hero[data-phase="fallback"] .intro-home-actions{animation:introRise .7s var(--ease-out) .18s backwards}
#hero[data-phase="home"] .intro-caption,#hero[data-phase="fallback"] .intro-caption{animation:introRise .7s var(--ease-out) .3s backwards}
#hero.is-instant .intro-home *{animation:none!important}

/* quiet product caption: bottom of the right column, above the note, in the clear field under the knot */
#hero .intro-caption{position:absolute;right:max(var(--gutter), calc((100% - var(--container)) / 2));
  bottom:calc(20px + 2 * 1.45 * var(--fs-meta) + 12px);margin:0;white-space:nowrap;text-align:right;
  font-size:var(--fs-ui);line-height:1.45;letter-spacing:.01em}
#hero .intro-caption a{color:var(--dark-text);text-decoration:none;border-bottom:1px solid var(--dark-line);padding-bottom:3px;
  transition:border-color var(--t) var(--ease-out)}
#hero .intro-caption a:hover{border-color:var(--dark-gold)}
#hero .intro-caption-price{color:var(--dark-gold);white-space:nowrap}
#hero .intro-caption a:focus-visible{outline:2px solid var(--dark-gold);outline-offset:4px}

#hero .btn:focus-visible{outline:2px solid var(--dark-gold);outline-offset:3px}
#hero .intro-start:focus-visible{outline:none}
#hero.is-kbd .intro-start:focus-visible{outline:2px solid var(--dark-gold);outline-offset:3px}

/* honest placeholder note: bottom-right, wrapped to a narrow column so it never meets the centred progress.
   Two copies: one for the intro frames, one inside the home copy (bottom-right on desktop, in flow on mobile). */
#hero .intro-note{position:absolute;z-index:4;right:max(var(--gutter), calc((100% - var(--container)) / 2));bottom:20px;margin:0;
  max-width:26em;text-align:right;font-size:var(--fs-meta);line-height:1.45;letter-spacing:.01em;
  color:var(--dark-muted);pointer-events:none}
#hero .intro-note-intro{right:var(--gutter);bottom:calc(22px + env(safe-area-inset-bottom, 0px));max-width:22em}
#hero[data-phase="home"] .intro-note-intro,#hero[data-phase="fallback"] .intro-note-intro,#hero[data-phase="morph"] .intro-note-intro{display:none}

/* ---- no WebGL / Three failed / reduced motion: static hero (never blank) ---- */
#hero .intro-fallback{display:none;position:absolute;z-index:1;right:max(var(--gutter), calc((100% - var(--container)) / 2 + 6vw));
  top:calc(var(--nav-h) + 20px);bottom:150px;aspect-ratio:933 / 1373;pointer-events:none}
#hero .intro-fallback img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 34px var(--dark-1))}
#hero .intro-fallback::after{content:"";position:absolute;left:4%;right:4%;bottom:-3%;height:9%;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--dark-1) 85%, transparent), transparent)}
#hero.is-fallback .intro-fallback{display:block}
#hero.is-fallback .intro-veil{opacity:0}

/* ---- mobile: sentences + copy at the bottom, deity raised ---- */
@media (max-width:700px){
  #hero[data-phase="home"],#hero[data-phase="morph"],#hero[data-phase="fallback"]{--sky-x:50%;--sky-y:24%}
  #hero .intro-mark{top:20px}
  #hero .intro-mark span{letter-spacing:.22em}
  #hero .intro-line{top:auto;bottom:calc(112px + env(safe-area-inset-bottom, 0px));left:var(--gutter)!important;right:var(--gutter)!important;
    max-width:none;transform:none;text-align:left!important;font-size:clamp(25px, 6.8vw, 30px)}
  #hero .intro-line::before{margin-left:0!important;transform-origin:left!important;margin-bottom:16px}
  #hero .intro-lines::before{content:"";position:absolute;inset:auto 0 0 0;height:58%;
    background:linear-gradient(to top, var(--intro-scrim) 0%, var(--intro-scrim-2) 40%, var(--intro-scrim-0) 100%)}
  #hero .intro-lines::before{transition:opacity .5s var(--ease-out)}
  #hero[data-step="0"] .intro-lines::before{opacity:.6}
  #hero[data-phase="final"] .intro-lines::before,#hero[data-phase="morph"] .intro-lines::before{opacity:0}
  #hero .intro-final{bottom:calc(76px + env(safe-area-inset-bottom, 0px))}
  #hero .intro-wordmark{font-size:clamp(40px, 11vw, 56px)}
  #hero .intro-start{margin-top:22px;width:100%;max-width:320px}
  #hero[data-phase="home"] .intro-scrim,#hero[data-phase="fallback"] .intro-scrim{
    background:linear-gradient(to top, var(--intro-scrim) 0%, var(--intro-scrim-2) 42%, var(--intro-scrim-0) 62%)}
  #hero .intro-home{align-items:flex-end;padding-bottom:24px}
  #hero .intro-home-title{font-size:clamp(30px, 8.4vw, 38px);max-width:12em}
  #hero .intro-home-lead{margin-top:14px;font-size:16px}
  #hero .intro-home-actions{margin-top:22px}
  #hero .intro-home-actions .btn{flex:1 1 auto}
  #hero .intro-caption{position:static;max-width:none;text-align:left;margin-top:18px;white-space:normal}
  /* note: last line of the home copy; under the mark/skip row on the final frame; hidden on steps 0–3 */
  /* the note explains the final 3D frame; on the mobile home the copy needs the room → shown on the final frame only */
  #hero .intro-note-home{display:none}
  #hero[data-phase="intro"] .intro-note-intro{display:none}
  #hero[data-phase="final"] .intro-note-intro{top:74px;bottom:auto;left:var(--gutter);right:var(--gutter);max-width:none;text-align:left}
  #hero .intro-fallback{right:auto;left:50%;top:calc(var(--nav-h) + 52px);bottom:auto;height:clamp(140px, calc(100% - var(--nav-h) - 52px - 430px), 300px);transform:translateX(-50%)}
}

@media (prefers-reduced-motion:reduce){
  #hero{transition:none}
  #hero .intro-hint{transition:none;opacity:1}
}
/* ===== views.css ===== */
/* Nogoolin Prototype E — views.css (owner: lead): page compositions. Tokens only. */
#app{display:block;min-height:60vh;padding-bottom:var(--s9)}
#app:focus{outline:none}
.v-sec{margin-top:var(--s9)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--s2) var(--s5);margin-bottom:var(--s6)}
.sec-head .link-arrow{flex:none}
.page-top{padding-top:var(--s5)}
.page-head{padding-top:var(--s5);padding-bottom:var(--s7)}
.page-head .crumbs{margin-bottom:var(--s6)}
.page-head h1{max-width:18ch}
.page-head .t-lead{margin-top:var(--s4);max-width:52ch}
@media (max-width:759px){
  .v-sec{margin-top:var(--s8)}
  #app{padding-bottom:var(--s8)}
  .page-head{padding-bottom:var(--s6)}
  .page-head .crumbs{margin-bottom:var(--s5)}
}

/* ---------- category niches: one row, never wraps (WF-HOME-01) ---------- */
.doors{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(156px,1fr);gap:var(--gap);margin:0;padding:0 0 4px;list-style:none;
  overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.doors::-webkit-scrollbar{display:none}
.doors.has-overflow{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.doors>li{scroll-snap-align:start;min-width:0}
.door{display:grid;gap:var(--s3);color:var(--ink);text-decoration:none;align-content:start}
.niche{border-radius:50% 50% var(--radius) var(--radius)/34% 34% var(--radius) var(--radius);outline:1px solid var(--gold-line);outline-offset:-7px}
.niche>img{transform:scale(.88);transform-origin:50% 62%;transition:transform .9s var(--ease-out)}
.door:hover .niche>img{transform:scale(.92)}
.door-name{font:500 21px/1.2 var(--f-display);letter-spacing:-.005em}
.door:hover .door-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:var(--gold-line)}
.door-meta{margin-top:-6px;font-size:var(--fs-meta);color:var(--ink-2)}
.niche-empty{display:grid;place-items:center}
.niche-empty .orn{width:40%;height:auto;aspect-ratio:1;--orn-bg:var(--plinth-0)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s7) var(--gap);margin:0;padding:0;list-style:none}
.door-lg .door-name{font-size:clamp(24px,2vw,28px)}
.cat-desc{font-size:var(--fs-ui);line-height:1.5;color:var(--ink-2);max-width:40ch}
@media (max-width:599px){.door-name{font-size:19px}}

/* ---------- home: featured, editorial (one lead + an index, not a uniform grid) ---------- */
.feat{display:grid;gap:var(--s6)}
@media (min-width:960px){.feat{grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:var(--s8);align-items:start}}
.feat-main{display:block}
.feat-views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s3);max-width:380px}
.feat-view{display:grid;gap:6px;padding:0;border:0;background:none;color:var(--ink-2);font:500 14.5px/1.3 var(--f-body);text-align:left}
.feat-view .plinth{outline:1px solid var(--rule);transition:outline-color var(--t-fast)}
.feat-view:hover .plinth{outline-color:var(--rule-strong)}
.feat-view[aria-pressed="true"]{color:var(--ink)}
.feat-view[aria-pressed="true"] .plinth{outline:2px solid var(--ink);outline-offset:2px}
.feat-text{display:grid;gap:var(--s4);align-content:start}
@media (min-width:960px){.feat-text{position:sticky;top:calc(var(--nav-h) + var(--s6))}}
.feat-name{font:500 clamp(28px,2.6vw,36px)/1.1 var(--f-display);letter-spacing:-.012em}
.feat-name a{text-decoration:none}
.feat-name a:hover{text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--gold-line)}
.feat-desc{color:var(--ink-2);max-width:46ch}
.feat-dims{font-size:var(--fs-meta);color:var(--ink-2)}
.feat-price{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.feat-price .price{font-size:26px}
.idx{margin:var(--s4) 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.idx li{border-bottom:1px solid var(--rule)}
.idx a{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s3) 0;color:var(--ink);text-decoration:none}
.idx .plinth{width:76px}
.idx-name{display:block;font:500 18px/1.3 var(--f-display)}
.idx-meta{display:block;margin-top:2px;font-size:var(--fs-meta);color:var(--ink-2)}
.idx .price{font-size:17px}
.idx a:hover .idx-name{text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--gold-line)}
@media (max-width:420px){.idx a{grid-template-columns:64px minmax(0,1fr)}.idx .plinth{width:64px}.idx a>.price{grid-column:2}}

/* ---------- home: how inquiries work ---------- */
.home-orn{margin-top:var(--s9)}
.how{display:grid;gap:var(--s6);margin:0;padding:0;list-style:none}
@media (min-width:760px){.how{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s7)}}
.how-step{display:grid;gap:var(--s3);align-content:start;padding-top:var(--s5);border-top:1px solid var(--gold-line)}
.how-num{font:400 46px/1 var(--f-display);color:var(--gold);font-variant-numeric:lining-nums}
.how-title{font:500 var(--fs-h3)/1.2 var(--f-display)}
.how-text{color:var(--ink-2);max-width:34ch}
.notice{display:flex;gap:var(--s3);align-items:flex-start;max-width:72ch;padding:var(--s4) var(--s5);border-radius:var(--radius);background:var(--bg-2);
  font-size:var(--fs-ui);line-height:1.5}
.notice .ic{width:20px;height:20px;margin-top:2px;color:var(--ink)}
.home-how .notice{margin-top:var(--s7)}
.home-pwa{margin-top:var(--s9)}

/* ---------- list: landing header, tools, grid ---------- */
.landing{display:grid;gap:var(--s6);align-items:end;padding-top:var(--s5);padding-bottom:var(--s7)}
@media (min-width:760px){.landing{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s8)}}
.landing h1{max-width:14ch}
.landing .t-lead{margin-top:var(--s4);max-width:44ch}
.landing-count{margin-top:var(--s5);font-size:var(--fs-meta);color:var(--ink-2)}
.landing-media{justify-self:end;width:min(100%,400px)}
@media (max-width:759px){
  .landing{padding-bottom:var(--s6)}
  .landing-media{order:-1;justify-self:stretch;width:100%}
  .landing-media .plinth{aspect-ratio:16/11}
}
.tools{display:grid;gap:var(--s3);margin-bottom:var(--s6);padding-block:var(--s4);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tools .chip-row{align-items:center}
@media (min-width:960px){.tools .chip-row[data-row="attr"]{flex-wrap:wrap;row-gap:10px;-webkit-mask-image:none;mask-image:none}}
.chip-group{flex:none;padding:0 2px 0 6px;font:500 var(--fs-meta)/1 var(--f-body);color:var(--ink-2)}
.chip-group:first-child{padding-left:0}
.chip-sep{flex:none;align-self:stretch;width:1px;margin:6px 6px;background:var(--rule)}
.tools-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s5)}
.tools-count{margin-right:auto;font:500 var(--fs-ui)/1.3 var(--f-body)}
.tools-active{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip-x{min-height:40px;padding:0 12px}
.chip-x .ic{width:14px;height:14px;stroke-width:2}
.tools-clear{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);font:500 var(--fs-ui)/1.3 var(--f-body);text-decoration-color:var(--gold-line)}
.tools-sort{display:inline-flex;align-items:center;gap:10px;font:500 var(--fs-ui)/1 var(--f-body);color:var(--ink-2)}
.select-wrap{position:relative;display:inline-flex}
.select-wrap .select{min-height:44px;padding:0 40px 0 14px;-webkit-appearance:none;appearance:none;width:auto;font-size:var(--fs-ui);font-weight:500;cursor:pointer}
.select-wrap .ic{position:absolute;right:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);pointer-events:none}
@media (max-width:599px){.tools-sort{width:100%}.select-wrap{flex:1}.select-wrap .select{width:100%}}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s7) var(--gap);margin:0;padding:0;list-style:none}
@media (min-width:760px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:599px){.pgrid{gap:var(--s6) 12px}}
.pcard{position:relative;min-width:0}
.pcard-link{display:grid;gap:6px;color:var(--ink);text-decoration:none}
.pcard-media{margin-bottom:6px}
.plinth>img.pcard-alt{position:absolute;inset:0;opacity:0;transition:opacity .5s var(--ease-out)}
.pcard-media.has-alt>img:first-child{transition:opacity .5s var(--ease-out)}
@media (hover:hover){
  .pcard-link:hover .pcard-media.has-alt>img:first-child{opacity:0}
  .pcard-link:hover .pcard-alt{opacity:1}
}
.pcard-name{font:500 19px/1.28 var(--f-display);letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-link:hover .pcard-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:var(--gold-line)}
.pcard-meta{font-size:var(--fs-meta);line-height:1.4;color:var(--ink-2)}
.pcard-foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:2px}
.pcard-foot .price{font-size:19px}
.pcard-var{font-size:var(--fs-meta);color:var(--ink-2)}
.pcard-save{position:absolute;top:8px;right:8px;z-index:2;background:color-mix(in srgb,var(--surface) 84%,transparent);color:var(--ink)}
.pcard-save[aria-pressed="true"]{color:var(--accent-text)}
@media (max-width:599px){.pcard-name{font-size:17px}.pcard-foot .price{font-size:17px}.pcard-save{top:4px;right:4px}}
.skel-card .skel.r-4x5{margin-bottom:6px}
.skel-card .skel-line{width:82%}
.skel-card .skel-line.s{width:44%}

.state{display:grid;justify-items:start;gap:var(--s4);max-width:62ch;padding-block:var(--s6) var(--s4)}
.state .orn{width:72px;height:72px;--orn-bg:var(--bg)}
.state h2{font:500 var(--fs-h3)/1.25 var(--f-display)}
.state p{color:var(--ink-2)}
.state-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s2)}
.state-alert>.ic{width:30px;height:30px;color:var(--error)}
.state-sub{margin-top:var(--s4);font:500 var(--fs-ui)/1.3 var(--f-body);color:var(--ink)}
.pager{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:var(--s8)}
.pager a,.pager span{display:inline-grid;place-items:center;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:var(--radius);
  color:var(--ink);font:500 var(--fs-ui)/1 var(--f-body);text-decoration:none}
.pager [aria-current]{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- detail ---------- */
.pd{padding-top:var(--s5)}
.pd>.crumbs{margin-bottom:var(--s5)}
.pd-grid{display:grid;gap:var(--s6)}
@media (min-width:960px){
  .pd-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s8);align-items:start}
  .pd-gallery{position:sticky;top:calc(var(--nav-h) + var(--s5))}
}
.gal{display:grid;gap:var(--s3)}
.gal-stage{position:relative;overflow:hidden}
.gal-frame .gal-img{transform-origin:var(--zx,50%) var(--zy,50%);transition:transform .38s var(--ease-out),opacity .26s var(--ease-out)}
.gal.is-zoomed .gal-img{transform:scale(2.2)}
.gal-img.is-swap{opacity:0}
.gal-zoom{position:absolute;inset:0;z-index:2;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:zoom-in;touch-action:pan-y}
.gal.is-zoomed .gal-zoom{cursor:zoom-out;touch-action:none}
.gal-zoom:focus-visible{outline-offset:-4px}
.gal-nav{position:absolute;top:50%;z-index:3;transform:translateY(-50%);background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--ink);opacity:0;transition:opacity var(--t-fast)}
.gal-prev{left:10px}
.gal-next{right:10px}
.gal-stage:hover .gal-nav,.gal-nav:focus-visible{opacity:1}
@media (hover:none){.gal-nav{opacity:1}}
.gal.is-zoomed .gal-nav{opacity:0;pointer-events:none}
.gal-count{position:absolute;left:12px;bottom:10px;z-index:3;padding:5px 10px;border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 88%,transparent);
  color:var(--ink);font:500 14px/1.3 var(--f-body);pointer-events:none}
.gal-thumbs{display:flex;gap:var(--s3);overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.gal-thumbs::-webkit-scrollbar{display:none}
.gal-thumb{flex:none;display:grid;gap:6px;width:84px;padding:0;border:0;background:none;color:var(--ink-2);font:500 14px/1.25 var(--f-body);text-align:left}
.gal-thumb .plinth{outline:1px solid var(--rule)}
.gal-thumb:hover .plinth{outline-color:var(--rule-strong)}
.gal-thumb[aria-pressed="true"]{color:var(--ink)}
.gal-thumb[aria-pressed="true"] .plinth{outline:2px solid var(--ink);outline-offset:2px}
.gal-tools{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.gal-tool{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:transparent;
  color:var(--ink);font:500 var(--fs-ui)/1 var(--f-body)}
.gal-tool:hover{border-color:var(--ink)}
.gal-tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.gal-hint{font-size:var(--fs-meta);color:var(--ink-2)}
@media (max-width:599px){.gal-hint{display:none}}
.gal-dims{position:absolute;inset:0;z-index:1;pointer-events:none;color:var(--ink)}
.gal.is-zoomed .gal-dims{display:none}
.dim{position:absolute;border:0 solid currentColor}
.dim-v{border-left-width:1px}
.dim-v::before,.dim-v::after{content:"";position:absolute;left:-6px;width:11px;border-top:1px solid currentColor}
.dim-v::before{top:0}
.dim-v::after{bottom:0}
.dim-h{border-top-width:1px}
.dim-h::before,.dim-h::after{content:"";position:absolute;top:-6px;height:11px;border-left:1px solid currentColor}
.dim-h::before{left:0}
.dim-h::after{right:0}
.dim-label{position:absolute;padding:4px 7px;border-radius:var(--radius);background:var(--plinth-0);color:var(--ink);font:500 14px/1 var(--f-body);white-space:nowrap;font-variant-numeric:tabular-nums}

.pd-info{display:grid;gap:var(--s5);align-content:start}
.pd-name{font-size:clamp(32px,3.4vw,48px);line-height:1.08}
.pd-price{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s5)}
.pd-price .price{font-size:clamp(28px,2.4vw,34px)}
.pd-lead{max-width:48ch;font-size:var(--fs-lead);line-height:1.55;color:var(--ink-2)}
.pd-dims{font-size:var(--fs-ui);color:var(--ink)}
.pd-variants{display:grid;gap:var(--s3);margin:0;padding:0;border:0;min-width:0}
.pd-variants legend{padding:0;margin-bottom:var(--s3)}
.var-list{display:grid;gap:8px}
.var{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding:8px 14px 8px 12px;border:1px solid var(--rule-strong);
  border-radius:var(--radius);background:transparent;cursor:pointer;transition:border-color var(--t-fast),background-color var(--t-fast)}
.var:hover{border-color:var(--ink)}
.var:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.var:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.var input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.var .plinth{width:52px}
.var-name{display:block;font:500 16.5px/1.3 var(--f-body)}
.var-note{display:block;font-size:var(--fs-meta);color:var(--ink-2)}
.var .price{font-size:17px}
.pd-cta{display:flex;flex-wrap:wrap;gap:var(--s3)}
.pd-cta .btn-primary{flex:1 1 220px}
.pd-cta .btn-quiet[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.spec{width:100%;border-collapse:collapse;font-size:var(--fs-ui)}
.spec caption{padding-bottom:var(--s3);text-align:left;font:500 var(--fs-h3)/1.2 var(--f-display)}
.spec caption small{font:400 var(--fs-meta)/1 var(--f-body);color:var(--ink-2)}
.spec th,.spec td{padding:12px 0;border-top:1px solid var(--rule);text-align:left;vertical-align:top}
.spec th{width:38%;padding-right:var(--s4);font-weight:500;color:var(--ink-2)}
.spec tr:last-child>*{border-bottom:1px solid var(--rule)}
.pd-read{display:grid;gap:var(--s7);margin-top:var(--s9);padding-top:var(--s7);border-top:1px solid var(--rule)}
@media (min-width:960px){.pd-read{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s8)}}
.pd-section h2{margin-bottom:var(--s4)}
.steps{display:grid;gap:var(--s4);margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--s3);align-items:start}
.step-n{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold-line);border-radius:50%;font:500 17px/1 var(--f-display);color:var(--ink)}
.steps p{padding-top:4px}

/* ---------- inquiry ---------- */
.inq-head{padding-block:var(--s5) var(--s7)}
.inq-head .crumbs{margin-bottom:var(--s6)}
.inq-head .t-lead{margin-top:var(--s3);max-width:52ch}
.inq-grid{display:grid;gap:var(--s7)}
@media (min-width:960px){.inq-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s8);align-items:start}.inq-summary{position:sticky;top:calc(var(--nav-h) + var(--s5))}}
@media (max-width:959px){.inq-summary{order:-1}}
.inq-form{display:grid;gap:var(--s5);max-width:640px}
.form-alert{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border:1px solid var(--error);border-radius:var(--radius);background:var(--error-soft);color:var(--ink)}
.form-alert .ic{width:22px;height:22px;color:var(--error)}
.form-alert p{font-weight:500}
.form-alert .btn{min-height:40px;margin-top:var(--s3)}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.field-count{font-size:var(--fs-meta);color:var(--ink-2)}
.inq-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3)}
.inq-privacy{max-width:56ch}
.btn.is-busy{cursor:progress}
.inq-summary{display:grid;gap:var(--s4);padding:var(--s5);border-radius:var(--radius);background:var(--bg-2)}
.sum-title{font:500 var(--fs-h3)/1.2 var(--f-display)}
.sum-list{display:grid;gap:var(--s3);margin:0;padding:0;list-style:none}
.sum-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s4);align-items:center}
.sum-item .plinth{width:72px}
.sum-name{display:block;font:500 17px/1.3 var(--f-display)}
.sum-meta{display:block;font-size:var(--fs-meta);color:var(--ink-2)}
.sum-note{padding-top:var(--s4);border-top:1px solid var(--rule);font-size:var(--fs-meta);color:var(--ink-2)}

/* ---------- saved ---------- */
.saved-list{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.saved-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:var(--s5);align-items:center;padding-block:var(--s4);border-bottom:1px solid var(--rule)}
.saved-item .plinth{width:96px}
.saved-name{font:500 20px/1.25 var(--f-display);text-decoration:none;color:var(--ink)}
.saved-name:hover{text-decoration:underline;text-decoration-color:var(--gold-line)}
.saved-meta{margin-top:4px;font-size:var(--fs-meta);color:var(--ink-2)}
.saved-side{display:grid;justify-items:end;gap:var(--s2)}
.saved-side .price{font-size:19px}
.saved-cta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4);margin-top:var(--s7)}
.saved-note{margin-top:var(--s3);font-size:var(--fs-meta);color:var(--ink-2)}
.btn-text{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--ink-2);font:500 var(--fs-ui)/1 var(--f-body);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:.3em}
.btn-text:hover{color:var(--ink)}
.btn-text .ic{width:16px;height:16px}
@media (max-width:599px){
  .saved-item{grid-template-columns:72px minmax(0,1fr);gap:var(--s4)}
  .saved-item .plinth{width:72px}
  .saved-side{grid-column:2;grid-auto-flow:column;justify-content:start;align-items:center;gap:var(--s4)}
}

/* ---------- sent (confirmation) ---------- */
.sent{display:grid;justify-items:center;gap:var(--s5);max-width:640px;margin-inline:auto;padding-block:var(--s8) var(--s5);text-align:center}
.sent-orn{width:96px;height:96px;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.6}
.sent-orn .knot{stroke-dasharray:1;stroke-dashoffset:1;animation:knotDraw 1.6s var(--ease-out) .15s forwards}
.sent-orn .over{opacity:0;animation:knotOver .4s var(--ease-out) 1.5s forwards}
@keyframes knotDraw{to{stroke-dashoffset:0}}
@keyframes knotOver{to{opacity:1}}
.sent-no{display:inline-block;padding:10px 18px;border:1px solid var(--gold-line);border-radius:var(--radius);font:500 21px/1 var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sent p{max-width:46ch;color:var(--ink-2)}
.sent-items{margin:0;padding:0;list-style:none;color:var(--ink)}
.sent-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s3);margin-top:var(--s3)}
@media (prefers-reduced-motion:reduce){.sent-orn .knot{stroke-dashoffset:0;animation:none}.sent-orn .over{opacity:1;animation:none}}

/* ---------- round 2 additions (classes used by views.js) ---------- */
.landing .crumbs{margin-bottom:var(--s6)}
.chip-set{display:flex;align-items:center;gap:8px;flex:none}
.results{transition:opacity .2s var(--ease-out)}
.results.is-loading{opacity:.5}
.gal-frame{position:absolute;inset:0}
.gal-frame>img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.feat-main img{transition:opacity .26s var(--ease-out)}
img.is-swap{opacity:0}
.idx-title{margin-top:var(--s5);color:var(--ink-2)}
.gal-proto{margin-top:2px}
.pd-cta .btn-quiet[aria-pressed="true"] .ic{color:var(--accent-text)}
.dim-label-v{transform:translate(-50%,-50%) rotate(-90deg)}
.dim-label-h{transform:translate(-50%,-50%)}
.login-box{display:grid;gap:var(--s5);max-width:640px}
.login-item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s4);align-items:center}
.login-item .plinth{width:72px}
.pcard .saved-remove{margin-top:2px;padding:0}
.saved-note .btn-text{min-height:32px;padding:0 2px;vertical-align:middle;font-size:inherit}

/* ================================================================ v1.1 (owner 2026-11-08) mobile-first fixes */
.crumbs-back{display:none}
@media (max-width:640px){
  .crumbs ol{display:none}
  .crumbs-back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding-right:8px;color:var(--ink);text-decoration:none;font:500 var(--fs-ui)/1.2 var(--f-body)}
  .crumbs-back .ic{width:18px;height:18px}
  /* section heading + link on one line: arrow only */
  .sec-head{flex-wrap:nowrap;align-items:center}
  .sec-head .link-arrow{display:inline-grid;place-items:center;width:44px;height:44px;margin-left:auto;border-radius:var(--radius)}
  .sec-head .link-arrow span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sec-head .link-arrow::after{display:none}
}
.pd-buybar{display:none}
@media (max-width:760px){
  .pd-buybar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sheet,70);display:flex;align-items:center;gap:var(--s4);
    padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule);
    box-shadow:0 -12px 32px -24px rgba(20,56,42,.35);transform:translateY(110%);transition:transform .32s var(--ease-out)}
  .pd-buybar.is-on{transform:none}
  .pd-buybar .btn{flex:1}
  .pd-buybar-price{font:600 var(--fs-h3)/1.1 var(--f-display);font-variant-numeric:tabular-nums}
  #app:has(.pd-buybar){padding-bottom:calc(var(--s9) + 76px)}
}
@media (prefers-reduced-motion:reduce){.pd-buybar{transition:none}}
/* lead v1.1: links inside the spec table get a 44 px touch target without changing the row look */
.spec td a.link{display:inline-flex;align-items:center;min-height:44px;margin-block:-12px}
/* ===== shop.css ===== */
/* Nogoolin Prototype E — shop.css (owner: shop worker). «Бүтээгдэхүүн» page: filter sidebar, category rows,
   cut-out product cards with a CSS contact shadow (no box), quick-view dialog, mobile filter sheet. Tokens only. */
.shop{padding-block:var(--s5) var(--s9);--g:var(--s4)}
.shop-h1{margin:var(--s3) 0 var(--s6)}
.shop-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s7);align-items:start}
html.is-shop-lock,html.is-shop-lock body{overflow:hidden}

/* ---------- sidebar ---------- */
.shop-side{position:sticky;top:calc(var(--nav-h) + var(--s4));max-height:calc(100vh - var(--nav-h) - var(--s6));overflow:auto;
  overscroll-behavior:contain;scrollbar-width:thin;padding-right:4px}
.sf-head{display:flex;align-items:center;gap:var(--s3);padding-bottom:var(--s3)}
.sf-title{font:500 var(--fs-h3)/1.2 var(--f-display);margin:0}
.sf-reset{margin-left:auto;display:inline-flex;align-items:center;min-height:44px;font:500 var(--fs-ui)/1.2 var(--f-body);color:var(--ink);
  text-decoration:underline;text-decoration-color:var(--gold-line);text-underline-offset:.22em}
.sf-reset:hover{text-decoration-color:var(--ink)}
.sf-x,.sf-apply{display:none}
.sf-form{margin:0}
.sf-group{border-top:1px solid var(--rule)}
.sf-group:last-child{border-bottom:1px solid var(--rule)}
.sf-sum{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:52px;cursor:pointer;list-style:none;
  font:500 16px/1.3 var(--f-body);color:var(--ink)}
.sf-sum::-webkit-details-marker{display:none}
.sf-sum .ic{width:18px;height:18px;transition:transform var(--t) var(--ease-out)}
.sf-group[open] .sf-sum .ic{transform:rotate(180deg)}
.sf-on{color:var(--ink-2);font-weight:400}
.sf-opts{list-style:none;margin:0;padding:0 0 var(--s3)}
.sf-opt{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:44px;cursor:pointer;
  font:400 var(--fs-ui)/1.35 var(--f-body);color:var(--ink)}
.sf-opt input{position:absolute;left:0;top:50%;width:20px;height:20px;margin:-10px 0 0;opacity:0;cursor:inherit}
.sf-box{display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--rule-strong);border-radius:var(--radius-sm);background:var(--surface);
  transition:background var(--t-fast),border-color var(--t-fast)}
.sf-box .ic{width:15px;height:15px;stroke-width:2.2;color:var(--btn-fg);opacity:0}
.sf-opt:hover .sf-box{border-color:var(--ink)}
.sf-opt input:checked+.sf-box{background:var(--btn-bg);border-color:var(--btn-bg)}
.sf-opt input:checked+.sf-box .ic{opacity:1}
.sf-opt input:focus-visible+.sf-box{outline:2px solid var(--focus);outline-offset:3px}
.sf-n{font:400 var(--fs-meta)/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---------- v1.1 range sliders (price, size): always visible, two real <input type=range> on one track ---------- */
.sf-rg{padding-bottom:var(--s4)}
.sf-rg-h{cursor:default;flex-wrap:wrap;gap:0 var(--s3)}
.rs{position:relative;height:44px;margin-inline:-4px;--lo:0%;--hi:100%}
.rs-track{position:absolute;left:22px;right:22px;top:50%;height:4px;margin-top:-2px;background:var(--rule);border-radius:var(--radius-sm)}
.rs-fill{position:absolute;top:0;bottom:0;left:var(--lo);right:calc(100% - var(--hi));background:var(--accent);border-radius:inherit}
.rs-in{position:absolute;inset:0;z-index:2;width:100%;height:44px;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;
  pointer-events:none;cursor:pointer;-webkit-tap-highlight-color:transparent}

.rs-in::-webkit-slider-runnable-track{height:44px;background:transparent;border:0}
.rs-in::-moz-range-track{height:44px;background:transparent;border:0}
/* 44px hit area, 28px visible thumb (white disc, accent ring) */
.rs-in::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:44px;height:44px;border:0;border-radius:50%;pointer-events:auto;cursor:grab;
  background:radial-gradient(circle,var(--surface) 0 11px,var(--accent) 11.5px 14px,transparent 14.5px)}

  background:radial-gradient(circle,var(--surface) 0 11px,var(--accent) 11.5px 14px,transparent 14.5px)}
