    function optId(i) { return opts.listId + '-opt-' + i; }
    function setOpen(v) {
      isOpen = v;
      root.setAttribute('data-open', v ? 'true' : 'false');
      input.setAttribute('aria-expanded', v ? 'true' : 'false');
      panel.hidden = !v;
      if (!v) setActive(-1);
    }
    function setActive(i) {
      var prevEl = activeIndex >= 0 && options[activeIndex] ? options[activeIndex].el : null;
      if (prevEl) { prevEl.classList.remove('is-active'); prevEl.setAttribute('aria-selected', 'false'); }
      activeIndex = i;
      var el = i >= 0 && options[i] ? options[i].el : null;
      if (el) {
        el.classList.add('is-active'); el.setAttribute('aria-selected', 'true');
        input.setAttribute('aria-activedescendant', el.id);
        if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else {
        activeIndex = -1;
        input.removeAttribute('aria-activedescendant');
      }
    }
    function go(hash) { setOpen(false); NG.router.go(hash); }
    function runAction(opt) { if (opt && opt.action) opt.action(); }
    function group(title, itemsHtml, listCls, labelId) {
      if (!itemsHtml) return '';
      var gid = labelId || (opts.listId + '-g' + (++gseq));
      return '<div class="search-group" role="group" aria-labelledby="' + gid + '">' +
        (labelId ? '' : '<div class="search-group-title" role="presentation" id="' + gid + '">' + esc(title) + '</div>') +
        '<ul class="' + (listCls || 'search-opt-list') + '" role="none">' + itemsHtml + '</ul></div>';
    }
    function thumbImg(file) {
      if (!file) return '<span class="search-thumb search-thumb-empty" aria-hidden="true"></span>';
      return '<span class="search-thumb plinth"><img src="' + esc(NG.data.img(file, { thumb: true })) + '" alt="" width="48" height="60" loading="lazy" decoding="async"></span>';
    }
    function bindOptions(defs) {
      options = []; activeIndex = -1;
      defs.forEach(function (d, idx) {
        var el = d.el;
        el.id = optId(idx); el.setAttribute('role', 'option'); el.setAttribute('aria-selected', 'false');
        el.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        el.addEventListener('click', function () { runAction(d); });
        options.push({ el: el, action: d.action });
      });
      input.removeAttribute('aria-activedescendant');
    }
    function catsSorted() { return (NG.data.categories || []).slice().sort(function (a, b) { return a.order - b.order; }); }
    function queryAction(t) { return function () { input.value = t; clearBtn.hidden = !t; saveRecent(t); go(NG.router.href('products', {}, { q: t })); }; }
    function catAction(c, rememberQ) { return function () { if (rememberQ) saveRecent(rememberQ); go(NG.router.href('products', {}, { category: c.slug })); }; }

    function renderIdle() {
      gseq = 0; renderedQ = '';
      var recent = readRecent();
      var recentId = opts.listId + '-recent';
      pre.innerHTML = recent.length ? '<div class="search-recent-head"><span class="search-group-title" id="' + recentId + '">Сүүлд хайсан</span>' +
        '<button type="button" class="search-clear-recent">Цэвэрлэх</button></div>' : '';
      var pop = NG.data.popular || [];
      var cats = catsSorted();
      list.innerHTML =
        (recent.length ? group('', recent.map(function (r, i) { return '<li class="search-option search-option-recent" data-ridx="' + i + '">' + esc(r) + '</li>'; }).join(''), null, recentId) : '') +
        group('Түгээмэл хайлт', pop.map(function (p, i) { return '<li class="search-option search-option-pop" data-pidx="' + i + '">' + esc(p) + '</li>'; }).join('')) +
        group('Ангиллаар', cats.map(function (c, i) {
          var count = NG.data.byCategory ? NG.data.byCategory(c.slug).length : (c.count || 0);
          var thumb = c.hero && count ? '<span class="search-cat-plinth plinth"><img class="search-cat-thumb" src="' + esc(NG.data.img(c.hero, { thumb: true })) + '" alt="" width="48" height="60" loading="lazy" decoding="async"></span>' :
            '<span class="search-cat-plinth search-cat-thumb-empty" aria-hidden="true"></span>';
          return '<li class="search-option search-option-cat" data-cidx="' + i + '">' + thumb +
            '<span class="search-cat-text"><span class="search-cat-name">' + esc(c.name) + '</span>' + (count ? '' : '<span class="search-cat-soon">Тун удахгүй</span>') + '</span></li>';
        }).join(''), 'search-cat-list');
      var defs = [];
      NG.util.$$('.search-option-recent', list).forEach(function (el) { defs.push({ el: el, action: queryAction(recent[+el.getAttribute('data-ridx')]) }); });
      NG.util.$$('.search-option-pop', list).forEach(function (el) { defs.push({ el: el, action: queryAction(pop[+el.getAttribute('data-pidx')]) }); });
      NG.util.$$('.search-option-cat', list).forEach(function (el) { defs.push({ el: el, action: catAction(cats[+el.getAttribute('data-cidx')]) }); });
      bindOptions(defs);
      var clearRecentBtn = pre.querySelector('.search-clear-recent');
      if (clearRecentBtn) {
        clearRecentBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        clearRecentBtn.addEventListener('click', function (ev) { ev.preventDefault(); clearRecent(); renderIdle(); input.focus(); NG.util.announce('Сүүлд хайсан жагсаалт цэвэрлэгдлээ'); });
      }
    }

    function renderTyping(q, res) {
      gseq = 0;
      pre.innerHTML = '';
      var kwHtml = res.keywords.map(function (k, i) { return '<li class="search-option search-option-kw" data-kidx="' + i + '"><span class="search-kw">' + k.html + '</span></li>'; }).join('');
      var prodHtml = res.products.map(function (p, i) {
        var file = p.images && p.images[0] ? p.images[0].file : null;
        return '<li class="search-option search-option-product" data-xidx="' + i + '">' +
          thumbImg(file) + '<span class="search-prod-info"><span class="search-prod-name">' + highlight(p.name, q) + '</span>' +
          '<span class="search-prod-meta"><span class="price">' + esc(NG.data.money(p.price)) + '</span> · ' +
          esc((NG.data.category(p.category) || {}).name || '') + '</span></span></li>';
      }).join('');
      list.innerHTML = group('Санал', kwHtml) + group('Бүтээгдэхүүн', prodHtml, 'search-opt-list search-opt-products') +
        '<ul class="search-opt-list search-opt-all" role="none"><li class="search-option search-option-all">' + esc('“' + q + '” гэж бүгдийг хайх') + '</li></ul>';
      var defs = [];
      NG.util.$$('.search-option-kw', list).forEach(function (el) {
        var k = res.keywords[+el.getAttribute('data-kidx')];
        defs.push({ el: el, action: function () { input.value = k.text; clearBtn.hidden = false; saveRecent(k.text); go(k.href); } });
      });
      NG.util.$$('.search-option-product', list).forEach(function (el) {
        var p = res.products[+el.getAttribute('data-xidx')];
        defs.push({ el: el, action: function () { saveRecent(q); go(NG.router.href('product', { slug: p.slug })); } });
      });
      defs.push({ el: list.querySelector('.search-option-all'), action: function () { commitSearch(q); } });
      bindOptions(defs);
      var n = res.keywords.length + res.products.length;
      NG.util.announce(n + ' санал');
    }

    function renderEmpty(q) {
      gseq = 0;
      pre.innerHTML = '<p class="search-empty-title">“' + esc(q) + '”-д тохирох зүйл олдсонгүй</p>' +
        '<p class="search-empty-hint">Латин үсгээр бичиж болно: huj, dari ekh, tangad</p>';
      var pop = NG.data.popular || [];
      var cats = catsSorted();
      list.innerHTML = group('Түгээмэл хайлт', pop.map(function (p, i) { return '<li class="search-option search-option-pop" data-pidx="' + i + '">' + esc(p) + '</li>'; }).join('')) +
        group('Ангиллаар', cats.map(function (c, i) { return '<li class="search-option search-option-cat search-option-cat-text" data-cidx="' + i + '"><span class="search-cat-name">' + esc(c.name) + '</span></li>'; }).join(''), 'search-cat-list search-cat-list-text');
      var defs = [];
      NG.util.$$('.search-option-pop', list).forEach(function (el) { defs.push({ el: el, action: queryAction(pop[+el.getAttribute('data-pidx')]) }); });
      NG.util.$$('.search-option-cat', list).forEach(function (el) { defs.push({ el: el, action: catAction(cats[+el.getAttribute('data-cidx')], q) }); });
      bindOptions(defs);
      NG.util.announce('“' + q + '”-д тохирох зүйл олдсонгүй');
    }

    function renderFor(q) {
      var t = String(q || '').trim();
      if (!t) renderIdle();
      else {
        var res = suggest(t);
        if (!res.keywords.length && !res.products.length) renderEmpty(t); else renderTyping(t, res);
        renderedQ = t;
      }
      setOpen(true);
    }
    var debouncedRender = NG.util.debounce(function () { if (doc().activeElement === input) renderFor(input.value); }, 120);
    function doc() { return document; }

    function commitSearch(q) {
      q = String(q == null ? input.value : q).trim();
      if (!q) return;
      input.value = q;
      saveRecent(q);
      go(NG.router.href('products', {}, { q: q }));
    }

    function onInput() { clearBtn.hidden = !input.value; debouncedRender(); }
    function onFocus() { renderFor(input.value); }
    function syncNow() { if (String(input.value).trim() !== renderedQ) renderFor(input.value); }
    function onKeydown(ev) {
      if (ev.isComposing) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        if (!isOpen) { renderFor(input.value); return; }
        syncNow();
        if (!options.length) return;
        var d = ev.key === 'ArrowDown' ? 1 : -1;
        var next = activeIndex < 0 ? (d > 0 ? 0 : options.length - 1) : (activeIndex + d + options.length) % options.length;
        setActive(next);
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (isOpen && activeIndex >= 0 && options[activeIndex]) runAction(options[activeIndex]);
        else commitSearch(input.value);
      } else if (ev.key === 'Escape') {
        ev.preventDefault();
        if (opts.mobile) { if (opts.onCloseOverlay) opts.onCloseOverlay(true); return; }
        if (isOpen) setOpen(false);
        else if (input.value) { input.value = ''; clearBtn.hidden = true; renderedQ = null; }
      } else if (ev.key === 'Home' || ev.key === 'End') {
        if (activeIndex >= 0) setActive(-1); /* return to text editing */
      }
    }
    input.addEventListener('input', onInput);
    input.addEventListener('focus', onFocus);
    input.addEventListener('keydown', onKeydown);
    clearBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    clearBtn.addEventListener('click', function () { input.value = ''; clearBtn.hidden = true; renderIdle(); setOpen(true); input.focus(); });
    document.addEventListener('focusin', function (ev) { if (isOpen && !root.contains(ev.target)) setOpen(false); });
    document.addEventListener('mousedown', function (ev) { if (isOpen && !root.contains(ev.target)) setOpen(false); });

    var widget = {
      root: root, input: input,
      focusInput: function () { input.focus(); },
      close: function () { setOpen(false); },
      setQuery: function (q) { input.value = q || ''; clearBtn.hidden = !q; renderedQ = null; }
    };
    widgets.push(widget);
    return widget;
  }

  /* ================================================================ mobile full-screen overlay */
  var uidCounter = 0;
  var overlayWidget = null, overlayEl = null, overlayOpen = false;
  function overlayFocusables() {
    return NG.util.$$('button:not([hidden]),input,a[href]', overlayEl).filter(function (el) { return el.offsetParent !== null; });
  }
  function buildOverlay() {
    overlayEl = document.createElement('div');
    overlayEl.className = 'search-overlay';
    overlayEl.setAttribute('role', 'dialog');
    overlayEl.setAttribute('aria-modal', 'true');
    overlayEl.setAttribute('aria-label', 'Хайх');
    overlayEl.innerHTML = '<div class="search-overlay-bar"><div class="search-overlay-host"></div>' +
      '<button type="button" class="search-overlay-close" aria-label="Хаах">' + NG.util.icon('close') + '</button></div>';
    document.body.appendChild(overlayEl);
    uidCounter++;
    overlayWidget = createWidget(overlayEl.querySelector('.search-overlay-host'), {
      mobile: true, inputId: 'search-overlay-input-' + uidCounter,
      listId: 'search-overlay-listbox-' + uidCounter, panelId: 'search-overlay-panel-' + uidCounter,
      onCloseOverlay: closeOverlay
    });
    overlayEl.querySelector('.search-overlay-close').addEventListener('click', function () { closeOverlay(true); });
    overlayEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); closeOverlay(true); return; }
      if (ev.key !== 'Tab') return;
      var f = overlayFocusables(); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    });
  }
  function wireMobile() {
    var btn = document.getElementById('search-open');
    if (!btn) return;
    btn.setAttribute('aria-haspopup', 'dialog');
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function () { if (!overlayEl) buildOverlay(); openOverlay(); });
    try {
      var mq = window.matchMedia('(min-width: 961px)'); /* header: inline field above 960, icon → overlay at ≤960 */
      var onMq = function () { if (mq.matches && overlayOpen) closeOverlay(false); };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
    } catch (e) { /* ignore */ }
  }
  function openOverlay() {
    overlayOpen = true;
    document.body.classList.add('is-search-open');
    document.documentElement.classList.add('is-search-locked');
    var btn = document.getElementById('search-open'); if (btn) btn.setAttribute('aria-expanded', 'true');
    if (overlayWidget) overlayWidget.focusInput(); /* same task as the click: keeps the mobile keyboard */
  }
  function closeOverlay(returnFocus) {
    if (!overlayOpen) return;
    overlayOpen = false;
    if (overlayWidget) overlayWidget.close();
    document.body.classList.remove('is-search-open');
    document.documentElement.classList.remove('is-search-locked');
    var btn = document.getElementById('search-open');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); if (returnFocus) { try { btn.focus(); } catch (e) { /* ignore */ } } }
  }

  function mount(hostEl) {
    if (hostEl) {
      uidCounter++;
      createWidget(hostEl, { mobile: false, inputId: 'search-input-' + uidCounter, listId: 'search-listbox-' + uidCounter, panelId: 'search-panel-' + uidCounter });
    }
    wireMobile();
    document.addEventListener('ng:route', function (ev) {
      var route = ev.detail;
      var q = (route && route.name === 'products' && route.query && route.query.q) ? route.query.q : '';
      closeOverlay(false); /* the router has already moved focus to the new page */
      widgets.forEach(function (w) { w.close(); w.setQuery(q); });
    });
  }

  NG.search = { mount: mount, normalize: normalize, rank: rank, suggest: suggest, highlight: highlight };
})();
</script>
<script>
/* ===== chrome.js ===== */
/* Nogoolin Prototype E — chrome.js (owner: chrome agent)
   Header (Prototype C style: knot + wordmark, text nav, borderless search, cart), mobile menu, footer with «Бидний тухай»,
   prototype panel «Prototype тохиргоо» (state simulation only; opened from a footer link), PWA hint.
   v1.1: one fixed palette (v4, set in <head>) — the palette switcher, contrast table, «Өнгө» FAB and ng:palette are gone.
   Mobile (≤960): the header slides away on scroll down and returns on scroll up / focus. */
(function () {
  'use strict';
  var NG = window.NG = window.NG || {};
  var U = NG.util;
  var doc = document;
  /* ---------------------------------------------------------------- state */
  var menuOpen = false;
  var panelOpen = false;
  var MOBILE_MQ = '(max-width: 960px)';
  function isMobile() { try { return window.matchMedia(MOBILE_MQ).matches; } catch (e) { return false; } }

  /* ---------------------------------------------------------------- header */
  var NAV = [
    { id: 'home', label: 'Нүүр', href: '#/' },
    { id: 'products', label: 'Бүтээгдэхүүн', href: '#/products' },
    { id: 'about', label: 'Бидний тухай', href: '#about' }
  ];
  var CART_SVG = '<svg class="ic nav-cart-ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M5.5 8h13l-1.1 11.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/></svg>';
  function logoHTML(tag, cls) {
    var inner = U.icon('ulzii', 'nav-knot') + '<span class="nav-word">НОГООЛИН</span>';
    return tag === 'a' ? '<a class="nav-logo' + (cls ? ' ' + cls : '') + '" href="#/" aria-label="Ногоолин — нүүр хуудас">' + inner + '</a>'
      : '<span class="nav-logo' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + inner + '</span>';
  }
  function navLinkHTML(n, cls) {
    return '<a class="' + cls + '" href="' + n.href + '" data-nav="' + n.id + '"' + (n.id === 'about' ? ' data-about' : '') + '>' + U.esc(n.label) + '</a>';
  }
  function headerHTML() {
    return (
      '<div class="nav-row container">' +
      logoHTML('a') +
      '<nav class="nav-primary" aria-label="Үндсэн цэс"><ul class="nav-links" role="list">' +
      NAV.map(function (n) { return '<li>' + navLinkHTML(n, 'nav-link') + '</li>'; }).join('') + '</ul></nav>' +
      '<div id="site-search" class="nav-search"></div>' +
      '<div class="nav-actions">' +
      '<button id="search-open" class="nav-icon-btn nav-search-open" type="button" aria-label="Хайх">' + U.icon('search') + '</button>' +
      '<a href="#/cart" class="nav-cart" data-nav="cart" data-ord-only="on" aria-label="Сагс, хоосон">' + /* step2: ordering toggle */ '' + '<span class="nav-cart-icwrap">' + CART_SVG +
      '<span class="nav-badge" aria-hidden="true" hidden></span></span><span class="nav-cart-text">Сагс</span></a>' +
      '<button type="button" id="nav-burger" class="nav-icon-btn nav-burger" aria-expanded="false" aria-controls="nav-panel" aria-label="Цэс нээх">' + U.icon('menu') + '</button>' +
      '</div>' +
      '</div>' +
      '<div class="nav-panel" id="nav-panel" hidden><nav aria-label="Гар утасны цэс"><ul role="list">' +
      NAV.concat([{ id: 'orderstatus', label: 'Захиалгаа шалгах', href: '#/order-status' }]).map(function (n) {
        return '<li><a class="nav-panel-link" href="' + n.href + '" data-nav="' + n.id + '"' + (n.id === 'about' ? ' data-about' : '') + '><span>' + U.esc(n.label) + '</span>' + U.icon('chev-right') + '</a></li>';
      }).join('') + '</ul></nav></div>'
    );
  }
  function updateCartCount() {
    var n = NG.cart ? NG.cart.count() : 0;
    var nav = doc.getElementById('nav');
    var link = U.$('.nav-cart', nav);
    var badge = U.$('.nav-badge', nav);
    if (badge) { badge.textContent = n > 99 ? '99+' : String(n); badge.hidden = n === 0; }
    if (link) link.setAttribute('aria-label', n ? 'Сагс, ' + n + ' бараа' : 'Сагс, хоосон');
  }
  function activeNavId(r) {
    if (!r) return '';
    if (r.name === 'home') return 'home';
    if (r.name === 'products' || r.name === 'product' || r.name === 'inquiry' || r.name === 'categories') return 'products';
    if (r.name === 'cart' || r.name === 'checkout') return 'cart';
    if (r.name === 'orderstatus') return 'orderstatus';
    return '';
  }
  function updateHeaderState() {
    var id = activeNavId(NG.router.current);
    U.$$('#nav [data-nav]').forEach(function (a) {
      if (a.getAttribute('data-nav') === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    updateCartCount();
  }
  function scrollToAbout() {
    var t = doc.getElementById('about-title');
    if (!t) return;
    closeMenu(false);
    t.setAttribute('tabindex', '-1');
    t.scrollIntoView({ behavior: U.reduced() ? 'auto' : 'smooth', block: 'start' });
    try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
  }

  /* ---------------------------------------------------------------- mobile menu */
  function openMenu() {
    setHeaderHidden(false);
    var panel = doc.getElementById('nav-panel'), b = doc.getElementById('nav-burger');
    panel.hidden = false; menuOpen = true;
    b.setAttribute('aria-expanded', 'true'); b.setAttribute('aria-label', 'Цэс хаах');
    doc.getElementById('nav').classList.add('is-open');
    var first = U.$('a', panel); if (first) first.focus();
  }
  function closeMenu(returnFocus) {
    if (!menuOpen) return;
    var panel = doc.getElementById('nav-panel'), b = doc.getElementById('nav-burger');
    panel.hidden = true; menuOpen = false;
    b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', 'Цэс нээх');
    doc.getElementById('nav').classList.remove('is-open');
    if (returnFocus) b.focus();
  }

  /* ---------------------------------------------------------------- footer */
  function footerHTML() {
    return '<div class="footer-dark dark-zone">' +
      '<div class="container footer-grid">' +
      '<div class="footer-brand">' + logoHTML('span', 'footer-logo') +
      '<p class="t-meta footer-tag">Сүсэг бишрэлийн бүтээгдэхүүний дэлгүүр. Сагсандаа хийгээд утасны дугаараар захиалж, дэлгүүрээс очиж авна.</p></div>' +
      '<section class="footer-about" id="about" aria-labelledby="about-title">' +
      '<h2 class="footer-h" id="about-title">Бидний тухай</h2>' +
      '<p>Ногоолин нь бурхан шүтээн, хүж, эрх, зул, хадаг зэрэг тахилын эдийг нэг дор цуглуулж, гэрийн тахилын ширээнд тохирохыг нь сонгоход тусалдаг.</p>' +
      '<p class="t-meta">Захиалгыг одоогоор зөвхөн дэлгүүрээс очиж авна — хүргэлт удахгүй. Хаяг, цагийн хуваарь: жишээ өгөгдөл.</p>' +
      '</section>' +
      '<nav class="footer-links" aria-label="Хөлийн цэс">' +
      '<a href="#/">Нүүр</a>' +
      '<a href="#/products">Бүтээгдэхүүн</a>' +
      '<a href="#/cart" data-ord-only="on">Сагс</a>' + /* step2: ordering toggle */
      '<a href="#/order-status">Захиалгаа шалгах</a>' +
      '<button type="button" id="footer-replay">Интро дахин үзэх</button>' +
      '</nav>' +
      '</div>' +
      '<div class="container footer-bottom t-meta">' +
      '<span>© 2026 Ногоолин</span><span>Prototype E · жишээ өгөгдөл: нэр, үнэ, хэмжээ бүгд жишээ</span>' +
      '<button type="button" id="footer-proto" class="footer-proto" aria-haspopup="dialog" aria-controls="proto-panel" aria-expanded="false">Prototype тохиргоо</button>' +
      '<a href="#/admin" class="footer-proto footer-admin">Удирдлага (prototype)</a>' + /* step2: footer admin link */
      '<span>Төлбөр, SMS баталгаажуулалт нь prototype-д дуурайлга</span></div></div>';
  }

  /* ---------------------------------------------------------------- hero overlay */
  var heroObserver = null;
  function setupHeroObserver() {
    if (heroObserver) { heroObserver.disconnect(); heroObserver = null; }
    var hero = doc.getElementById('hero'), nav = doc.getElementById('nav');
    if (!hero || !nav || hero.hidden || !('IntersectionObserver' in window)) { if (nav) nav.classList.remove('is-over-hero'); return; }
    var navH = nav.offsetHeight || 64;
    heroObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { nav.classList.toggle('is-over-hero', e.isIntersecting && e.intersectionRect.height > 0); });
    }, { rootMargin: '-' + navH + 'px 0px 0px 0px', threshold: [0, 0.001] });
    heroObserver.observe(hero);
  }

  /* ---------------------------------------------------------------- prototype panel «Төлөв турших» */
  var SIM_GROUPS = [
    { key: 'sms', legend: 'SMS баталгаажуулалт', opts: [['ok', 'Хэвийн (код 123456)'], ['wrong', 'Буруу код'], ['expired', 'Хугацаа дууссан'], ['send_fail', 'SMS илгээж чадсангүй']] },
    { key: 'order', legend: 'Захиалга илгээхэд', opts: [['ok', 'Хэвийн'], ['network', 'Сүлжээний алдаа'], ['rate', 'Хэт олон оролдлого'], ['out_of_stock', 'Дууссан бараа']] },
    { key: 'submit', legend: '«Асуулт асуух» илгээхэд', opts: [['ok', 'Хэвийн'], ['network', 'Сүлжээний алдаа'], ['offline', 'Офлайн'], ['ratelimit', 'Хэт олон хүсэлт']] }
  ];
  function radioGroupHTML(g, s) {
    return '<fieldset class="proto-submit" data-proto-key="' + g.key + '"><legend>' + U.esc(g.legend) + '</legend>' +
      g.opts.map(function (kv) {
        return '<label class="proto-radio"><input type="radio" name="proto-' + g.key + '" value="' + kv[0] + '"' + (s[g.key] === kv[0] ? ' checked' : '') + '> ' + U.esc(kv[1]) + '</label>';
      }).join('') + '</fieldset>';
  }
  function panelHTML() {
    var s = NG.proto.state();
    return (
      '<div class="proto-panel-inner">' +
      '<div class="proto-panel-head"><h2 class="proto-title" id="proto-title">Prototype тохиргоо</h2><button type="button" class="icon-btn proto-close" aria-label="Хаах">' + U.icon('close') + '</button></div>' +
      '<p class="t-meta proto-lead">Prototype E · жишээ өгөгдөл. Өнгө тогтмол: v4 (D-12). Доорх төлвүүд зөвхөн энэ төхөөрөмж дээр.</p>' +
      '<div class="proto-sim"><h3 class="t-ui">Төлөв турших</h3>' +
      '<button type="button" class="proto-switch" id="proto-slow" role="switch" aria-checked="' + !!s.slow + '">Удаан сүлжээ</button>' +
      '<button type="button" class="proto-switch" id="proto-catalog-error" role="switch" aria-checked="' + !!s.catalogError + '">Каталогийн алдаа</button>' +
      SIM_GROUPS.map(function (g) { return radioGroupHTML(g, s); }).join('') +
      '<div class="proto-sim-actions">' +
      '<button type="button" class="btn btn-quiet" id="proto-replay">Интро дахин үзэх</button>' +
      '<button type="button" class="btn btn-quiet" id="proto-clear-cart">Сагсыг хоослох</button>' +
      '<button type="button" class="btn btn-quiet" id="proto-pwa-reset"' + (pwaDismissed() ? '' : ' hidden') + '>Суулгах саналыг дахин харуулах</button>' +
      '</div></div></div>'
    );
  }
  function syncPanel() {
    if (!panelOpen) return;
    var panel = doc.getElementById('proto-panel');
    var s = NG.proto.state();
    function setSw(id, v) { var el = doc.getElementById(id); if (el) el.setAttribute('aria-checked', String(!!v)); }
    setSw('proto-slow', s.slow); setSw('proto-catalog-error', s.catalogError);
    SIM_GROUPS.forEach(function (g) {
      U.$$('input[name="proto-' + g.key + '"]', panel).forEach(function (r) { r.checked = r.value === s[g.key]; });
    });
  }
  function bindPanel() {
    var panel = doc.getElementById('proto-panel');
    U.$('.proto-close', panel).addEventListener('click', function () { closePanel(true); });
    SIM_GROUPS.forEach(function (g) {
      U.$$('input[name="proto-' + g.key + '"]', panel).forEach(function (r) {
        r.addEventListener('change', function () { if (r.checked) NG.proto.set(g.key, r.value); });
      });
    });
    U.$('#proto-slow', panel).addEventListener('click', function () { NG.proto.set('slow', !NG.proto.get('slow')); syncPanel(); });
    U.$('#proto-catalog-error', panel).addEventListener('click', function () { NG.proto.set('catalogError', !NG.proto.get('catalogError')); syncPanel(); });
    U.$('#proto-replay', panel).addEventListener('click', function () { closePanel(false); NG.router.replayIntro(); });
    U.$('#proto-clear-cart', panel).addEventListener('click', function () { if (NG.cart) NG.cart.clear(); U.announce('Сагс хоосорлоо'); });
    var pwaReset = U.$('#proto-pwa-reset', panel);
    pwaReset.addEventListener('click', function () {
      U.store.del('nogoolin-install-dismissed', true);
      renderAllPwaSlots(); pwaReset.hidden = true; U.$('.proto-close', panel).focus();
      U.announce('Суулгах санал дахин харагдана');
    });
  }
  function focusables(root) {
    return U.$$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(function (el) {
      return !el.disabled && !el.hidden && el.getAttribute('aria-hidden') !== 'true' && el.getClientRects().length > 0;
    });
  }
  function buildProtoRoot() {
    var root = doc.getElementById('proto-root');
    root.innerHTML = '<div class="proto-backdrop" data-proto-backdrop hidden></div>' +
      '<div id="proto-panel" class="proto-panel" role="dialog" aria-modal="true" aria-labelledby="proto-title" hidden></div>';
    U.$('[data-proto-backdrop]', root).addEventListener('click', function () { closePanel(true); });
    doc.addEventListener('keydown', function (e) {
      if (!panelOpen || doc.querySelector('.pwa-dialog')) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePanel(true); return; }
      if (e.key !== 'Tab') return;
      var panel = doc.getElementById('proto-panel'), f = focusables(panel);
      if (!f.length) { e.preventDefault(); return; }
      var first = f[0], last = f[f.length - 1], a = doc.activeElement;
      if (!panel.contains(a)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    }, true);
  }
  function openPanel() {
    var panel = doc.getElementById('proto-panel');
    panelOpener = doc.activeElement;
    panel.innerHTML = panelHTML();
    panelOpen = true;
    bindPanel();
    panel.hidden = false;
    U.$('[data-proto-backdrop]').hidden = false;
    doc.documentElement.classList.add('is-proto-open');
    var t = doc.getElementById('footer-proto'); if (t) t.setAttribute('aria-expanded', 'true');
    var first = U.$('.proto-close', panel);
    if (first) first.focus();
  }
  function closePanel(returnFocus) {
    if (!panelOpen) return;
    var panel = doc.getElementById('proto-panel');
    var hadFocus = panel && panel.contains(doc.activeElement);
    if (panel) { panel.hidden = true; panel.innerHTML = ''; }
    var bd = U.$('[data-proto-backdrop]'); if (bd) bd.hidden = true;
    doc.documentElement.classList.remove('is-proto-open');
    panelOpen = false;
    var t = doc.getElementById('footer-proto');
    if (t) t.setAttribute('aria-expanded', 'false');
    var back = (panelOpener && panelOpener.isConnected && panelOpener !== doc.body) ? panelOpener : t;
    panelOpener = null;
    if ((returnFocus || hadFocus) && back) { try { back.focus({ preventScroll: true }); } catch (e) { back.focus(); } }
  }
  var panelOpener = null;

  /* ---------------------------------------------------------------- mobile header: hide on scroll down, show on scroll up */
  var HIDE_AFTER = 64, lastY = 0, headerTicking = false;
  function headerLocked() {
    var nav = doc.getElementById('nav');
    return !isMobile() || menuOpen || panelOpen || doc.body.classList.contains('is-search-open') ||
      doc.body.getAttribute('data-intro') === 'on' || (nav && nav.contains(doc.activeElement));
  }
  function setHeaderHidden(on) {
    var nav = doc.getElementById('nav'); if (!nav) return;
    if (nav.classList.contains('is-hidden') === on) return;
    nav.classList.toggle('is-hidden', on);
    doc.documentElement.classList.toggle('is-nav-hidden', on);
    U.emit('ng:navvis', { hidden: on });
  }
  function onScrollHeader() {
    headerTicking = false;
    var y = Math.max(0, window.scrollY || doc.documentElement.scrollTop || 0), dy = y - lastY;
    if (headerLocked() || y <= HIDE_AFTER) { setHeaderHidden(false); lastY = y; return; }
    if (Math.abs(dy) < 6) return; /* ignore jitter (iOS bounce, sub-pixel scroll) */
    setHeaderHidden(dy > 0);
    lastY = y;
  }
  function setupHeaderHide() {
    lastY = window.scrollY || 0;
    window.addEventListener('scroll', function () {
      if (!headerTicking) { headerTicking = true; window.requestAnimationFrame(onScrollHeader); }
    }, { passive: true });
    var nav = doc.getElementById('nav');
    nav.addEventListener('focusin', function () { setHeaderHidden(false); });
  }

  /* ---------------------------------------------------------------- PWA hint (FR-PWA-130) */
  var deferredInstallPrompt = null;
  try {
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstallPrompt = e; });
    window.addEventListener('appinstalled', function () { deferredInstallPrompt = null; renderAllPwaSlots(); });
  } catch (e) { /* ignore */ }
  function isStandalone() {
    try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; }
  }
  function pwaDismissed() { return U.store.get('nogoolin-install-dismissed', false, true) === true; }
  function pwaBandHTML() {
    return '<div class="pwa-band">' +
      '<span class="pwa-icon dark-zone" aria-hidden="true">' + U.icon('halo', 'nav-halo') + '</span>' +
      '<div class="pwa-copy"><p class="pwa-title">Ногоолиныг апп болгон суулгах</p>' +
      '<p class="t-meta">Утасныхаа нүүр дэлгэцээс нэг товшилтоор нээгдэнэ.</p></div>' +
      '<div class="pwa-actions"><button type="button" class="btn btn-primary pwa-install">Суулгах</button>' +
      '<button type="button" class="btn btn-quiet pwa-dismiss">Дараа</button></div></div>';
  }
  function pwaDialogHTML() {
    return '<div class="pwa-dialog-inner"><h2 class="t-h3" id="pwa-dialog-title">Апп болгон суулгах</h2>' +
      '<p>iPhone Safari: «Хуваалцах → Нүүр дэлгэцэд нэмэх».</p><p>Android Chrome: «⋮ цэс → Апп суулгах».</p>' +
      '<p class="t-meta pwa-note">Prototype: manifest, service worker нь бодит хувилбарт (FR-PWA-110, FR-PWA-210).</p>' +
      '<button type="button" class="btn btn-quiet pwa-dialog-close">Хаах</button></div>';
  }
  function openPwaDialog() {
    var opener = doc.activeElement;
    var dlg = doc.createElement('div');
    dlg.className = 'pwa-dialog'; dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true'); dlg.setAttribute('aria-labelledby', 'pwa-dialog-title');
    dlg.innerHTML = pwaDialogHTML();
    doc.body.appendChild(dlg);
    var closeBtn = U.$('.pwa-dialog-close', dlg);
    function close() {
      doc.removeEventListener('keydown', onKey, true);
      if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
      if (opener && opener.focus && opener.isConnected) opener.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      else if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); } /* the dialog has one control: keep focus on it */
    }
    doc.addEventListener('keydown', onKey, true);
    closeBtn.addEventListener('click', close);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });
    closeBtn.focus();
  }
  function renderPwaSlot(slot) {
    if (!slot) return;
    if (isStandalone() || pwaDismissed()) { slot.innerHTML = ''; slot.hidden = true; return; }
    slot.hidden = false;
    slot.innerHTML = pwaBandHTML();
    U.$('.pwa-install', slot).addEventListener('click', function () {
      if (deferredInstallPrompt && deferredInstallPrompt.prompt) {
        var ev = deferredInstallPrompt; deferredInstallPrompt = null;
        try { ev.prompt(); } catch (e) { openPwaDialog(); }
      } else { openPwaDialog(); }
    });
    U.$('.pwa-dismiss', slot).addEventListener('click', function () {
      U.store.set('nogoolin-install-dismissed', true, true);
      renderAllPwaSlots();
      U.announce('Суулгах санал нуугдлаа');
    });
  }
  function renderAllPwaSlots() { U.$$('[data-pwa-slot]').forEach(renderPwaSlot); }
  NG.pwa = { render: renderPwaSlot };

  /* ---------------------------------------------------------------- mount */
  NG.chrome = {
    scrollToAbout: scrollToAbout,
    openProtoPanel: function () { openPanel(); },
    showHeader: function () { setHeaderHidden(false); },
    mount: function () {
      doc.documentElement.dataset.palette = 'v4'; /* fixed in v1.1; <head> already sets it */
      var nav = doc.getElementById('nav');
      nav.innerHTML = headerHTML();
      doc.getElementById('footer').innerHTML = footerHTML();
      buildProtoRoot();

      /* «Бидний тухай» is a section in the footer (present on every route): scroll + focus, no hash change */
      doc.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[data-about]');
        if (!a) return;
        e.preventDefault();
        scrollToAbout();
      });
      doc.getElementById('nav-burger').addEventListener('click', function () { if (menuOpen) closeMenu(true); else openMenu(); });
      doc.getElementById('nav-panel').addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (a && !a.hasAttribute('data-about')) closeMenu(a.getAttribute('href') === location.hash);
      });
      nav.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menuOpen) { e.preventDefault(); closeMenu(true); } });
      doc.addEventListener('click', function (e) {
        if (!menuOpen || !e.target.isConnected) return;
        if (e.target.closest('#nav-panel') || e.target.closest('#nav-burger')) return;
        closeMenu(false);
      });
      doc.getElementById('footer-replay').addEventListener('click', function () { NG.router.replayIntro(); });
      doc.getElementById('footer-proto').addEventListener('click', function () { if (panelOpen) closePanel(true); else openPanel(); });
      setupHeaderHide();

      doc.addEventListener('ng:cart', updateCartCount);
      doc.addEventListener('ng:proto', syncPanel);
      doc.addEventListener('ng:route', function () {
        closeMenu(false); /* the router moves focus to the new page's h1 */
        closePanel(false);
        setHeaderHidden(false); lastY = window.scrollY || 0;
        updateHeaderState();
        setupHeroObserver();
        renderAllPwaSlots();
      });
      window.addEventListener('storage', function (e) { if (e.key === 'nogoolin-cart') updateCartCount(); });

      updateHeaderState();
      setupHeroObserver();
      window.addEventListener('resize', U.debounce(function () {
        setupHeroObserver();
        if (!isMobile()) { closeMenu(false); setHeaderHidden(false); }
      }, 150));
    }
  };
})();
</script>
<script>
/* ===== views.js ===== */
/* Nogoolin Prototype E — views.js (owner: lead).
   Views on NG.router: home sections, categories, catalog + search results, product detail (gallery, zoom and
   on-image dimensions drawn from structured fields, D-09), inquiry (FR-INQ-140…170), saved list (FR-WISH-100…150),
   prototype login gate (FR-WISH-110), confirmation (FR-INQ-150) and not found. Tokens only; sample data. */
(function () {
  'use strict';
  var NG = window.NG = window.NG || {};
  var D = NG.data, U = NG.util, R = NG.router;
  var esc = U.esc, ic = U.icon, money = D.money;
  var doc = document;
  var SITE = 'Ногоолин · Prototype E';
  var SZ_CARD = '(min-width:1100px) 300px, (min-width:760px) 33vw, 50vw';
  var SZ_MAIN = '(min-width:960px) 56vw, 100vw';
  var DRAFT_KEY = 'nogoolin-inq-draft';
  var LAST_KEY = 'nogoolin-last-inquiry';
  var KNOT_D = 'M19.06 56.19L56.19 19.06A8.75 8.75 0 1 0 43.81 19.06L80.94 56.19A8.75 8.75 0 1 0 80.94 43.81L43.81 80.94A8.75 8.75 0 1 0 56.19 80.94L19.06 43.81A8.75 8.75 0 1 0 19.06 56.19Z';
  var KNOT_GAPS = 'M22.75 52.5L27.75 47.5M47.5 22.75L52.5 27.75M77.25 47.5L72.25 52.5M52.5 77.25L47.5 72.25';

  /* ================================================================ helpers */
  function appEl() { return doc.getElementById('app'); }
  function done(ctx) { if (ctx && typeof ctx.done === 'function') ctx.done(); }
  function alive(ctx) { return !(ctx && typeof ctx.alive === 'function') || ctx.alive(); }
  function byOrder(a, b) { return a.order - b.order; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function attrs(o) {
    var s = '';
    Object.keys(o).forEach(function (k) {
      var v = o[k];
      if (v === false || v == null) return;
      s += ' ' + k + (v === true ? '' : '="' + esc(v) + '"');
    });
    return s;
  }
  function srcsetOf(file) { return D.img(file, { thumb: true }) + ' 384w, ' + D.img(file) + ' 1280w'; }
  function pimg(file, alt, o) {
    o = o || {};
    return '<img' + attrs({
      'class': o.cls || null,
      src: o.full ? D.img(file) : D.img(file, { thumb: true }),
      srcset: srcsetOf(file), sizes: o.sizes || '50vw',
      width: 1280, height: 1600, alt: alt || '',
      loading: o.eager ? null : 'lazy', decoding: 'async', fetchpriority: o.eager ? 'high' : null,
      'aria-hidden': o.hidden ? 'true' : null, draggable: 'false'
    }) + '>';
  }
  /* one backdrop for every product photo (tokens.css .plinth) */
  function plinth(file, alt, o) {
    o = o || {};
    var tag = o.tag || 'div';
    return '<' + tag + attrs({ 'class': 'plinth ' + (o.ratio || 'r-4x5') + (o.cls ? ' ' + o.cls : ''), 'data-vt-media': o.vt || null }) + '>' +
      pimg(file, alt, o) + (o.extra || '') + '</' + tag + '>';
  }
  function ulzii(cls) {
    return '<svg class="orn' + (cls ? ' ' + cls : '') + '" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#i-ulzii"></use></svg>';
  }
  function crumbs(trail) {
    return '<nav class="crumbs" aria-label="Хуудасны байршил"><ol>' + trail.map(function (t, i) {
      var last = i === trail.length - 1;
      return '<li>' + (last || !t.href ? '<span' + (last ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</span>'
        : '<a href="' + esc(t.href) + '">' + esc(t.label) + '</a>') + '</li>';
    }).join('') + '</ol>' + (function () {
      /* v1.1 mobile: one 44px «← <parent>» back link instead of a wrapping trail */
      var up = null; trail.forEach(function (t, i) { if (t.href && i < trail.length - 1) up = t; });
      return up ? '<a class="crumbs-back" href="' + esc(up.href) + '">' + ic('arrow-left') + '<span>' + esc(up.label) + '</span></a>' : '';
    })() + '</nav>';
  }
  function altFor(p, im) { return p.name + ' — ' + String(im.label || '').toLowerCase(); }
  function matText(p) {
    return p.materialKeys.map(function (k, i) { var t = D.materials[k] || k; return i ? t.toLowerCase() : t; }).join(', ');
  }
  function priceText(p) {
    if (p.variants && p.variants.length > 1) {
      var ps = p.variants.map(function (v) { return v.price; });
      var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
      if (lo !== hi) return money(lo).replace('₮', '') + '–' + money(hi);
    }
    return money(p.price);
  }
  function stockTag(p, always) {
    if (!always && p.stock_status === 'in_stock') return '';
    return '<span class="status" data-stock="' + esc(p.stock_status) + '">' + esc(D.stock[p.stock_status] || '') + '</span>';
  }
  function savedAny(slug) { return NG.saved.list().some(function (it) { return it.slug === slug; }); }
  function focusEl(el) { if (!el) return; try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  /* async content replaced the element that had focus → hand focus to the new h1 (navigations only) */
  function focusH1IfLost(main) {
    var a = doc.activeElement;
    if (a && a !== doc.body && a !== doc.documentElement && a !== main && doc.contains(a)) return;
    var h = main.querySelector('h1'); if (!h) return;
    h.setAttribute('tabindex', '-1'); focusEl(h);
  }
  function fitRows(root) {
    U.$$('.chip-row, .doors', root || doc).forEach(function (row) {
      var upd = function () {
        var over = row.scrollWidth > row.clientWidth + 2 && row.scrollLeft + row.clientWidth < row.scrollWidth - 4;
        row.classList.toggle('has-overflow', over);
      };
      upd();
      if (!row.__ngFit) { row.__ngFit = true; row.addEventListener('scroll', upd, { passive: true }); }
    });
  }
  window.addEventListener('resize', U.debounce(function () { fitRows(appEl()); }, 160));
  function swapImg(img, file, alt, cb) {
    var tok = (img.__ngTok = (img.__ngTok || 0) + 1);
    var apply = function () {
      if (tok !== img.__ngTok) return;
      img.srcset = srcsetOf(file); img.src = D.img(file); img.alt = alt;
      var show = function () { if (tok === img.__ngTok) img.classList.remove('is-swap'); };
      if (img.decode) img.decode().then(show, show); else show();
      if (cb) cb();
    };
    if (U.reduced()) { apply(); return; }
    img.classList.add('is-swap');
    setTimeout(apply, 170);
  }

  /* FR-WISH-110: a guest who presses «Хадгалах» is sent to login with next=<current route> */
  function gateSave(slug, variant) {
    if (NG.auth && NG.auth.is()) return false;
    var q = { next: location.hash || '#/', save: slug };
    if (variant) q.variant = variant;
    R.go(R.href('login', null, q));
    return true;
  }
  function toastSaved(on, p, v) {
    var name = p.name + (v ? ' — ' + v.label : '');
    if (on) NG.toast('Хадгаллаа: ' + name, { href: '#/saved', label: 'Хадгалсан' });
    else NG.toast('Хадгалснаас хаслаа: ' + name);
  }

  /* ================================================================ shared blocks */
  function heart(p) { return ''; }

  function bindInquiry(main, I) {

    var MAP = { customer_name: 'inq-name', phone: 'inq-phone', message: 'inq-msg' };

    function body() {
      return { customer_name: name.value.trim(), phone: normPhone(phone.value), message: msg.value.trim(), product_id: I.items.length === 1 && I.from === 'product' ? I.items[0].p.id : undefined };
    }
    function saveDraft() {
      var dr = U.store.get(DRAFT_KEY, {}, true) || {};
      dr.name = name.value; dr.phone = phone.value; dr.msg = dr.msg || {}; dr.msg[I.key] = msg.value;
      U.store.set(DRAFT_KEY, dr, true);
    }
    function setErr(id, text) {
      var f = form.querySelector('[data-field="' + id + '"]'), input = form.querySelector('#' + id);
      var m = form.querySelector('#' + id + '-err'), hint = form.querySelector('#' + id + '-hint');

<script>

/* Nogoolin Prototype E — shop.js (owner: shop worker).

(function () {
  'use strict';

  /* ================================================================ pure logic (no DOM) */
  var Logic = (function () {
    /* v1.1: price + size are dual-thumb ranges ([lo, hi] or null = full range). The top of a range is open-ended

    var STEP = { price: 5000, size: 1 };

      price: { 'to50': [0, 50000], '50-250': [50000, 250000], '250up': [250000, 'max'] },
      size: { 'to15': [0, 15], '15-30': [15, 30], '30up': [30, 'max'], small: [0, 15], medium: [15, 30], large: [30, 'max'] }

    var LISTS = ['cat', 'mat', 'stock'];
    var RANGES = ['price', 'size'];

    var B = { price: [0, 1e9], size: [0, SIZE_MAX] };

    function longest(p) { return Math.max(p.height_cm || 0, p.width_cm || 0, p.depth_cm || 0); }

      bounds: bounds, norm: norm, parseRange: parseRange, inRange: inRange, fmtNum: fmtNum, parseNum: parseNum, rangeLabel: rangeLabel,

  function rangeVal(g, v) {

            '<span class="qv-var-l">' + esc(x.label) + '<small>' + esc(x.note) + '</small></span><span class="price">' + money(x.price) + '</span></label>';
        }).join('') + '</fieldset>' : '') +
        '<div class="qv-buy" data-ord-only="on"><div class="qty" role="group" aria-label="Тоо ширхэг">' + /* step2: ordering toggle */
          '<button type="button" class="icon-btn" data-qty="-1" aria-label="Хасах"' + (qty <= 1 ? ' disabled' : '') + '>' + ic('minus') + '</button>' +
          '<output class="qty-n" data-qty-n aria-live="polite">' + qty + '</output>' +
          '<button type="button" class="icon-btn" data-qty="1" aria-label="Нэмэх"' + (qty >= NG.cart.MAX_QTY ? ' disabled' : '') + '>' + ic('plus') + '</button></div>' +
          '<button type="button" class="btn btn-primary qv-add" data-add' + (out ? ' disabled' : '') + '>' + (out ? 'Түр байхгүй' : 'Сагсанд нэмэх') + '</button></div>' +
        '<div class="qv-inq" data-ord-only="off"><a class="btn btn-primary qv-inq-btn" data-qv-inq-primary href="' + R.href('inquiry', { slug: p.slug }, v ? { variant: v.id } : null) + '">Асуулт асуух</a></div>' + /* step2: ordering toggle */
        '<p class="qv-incart" data-incart data-ord-only="on"' + (inCart ? '' : ' hidden') + '>Сагсанд ' + inCart + ' ширхэг байна · <a href="#/cart">Сагс харах</a></p>' +
        '<p class="qv-links"><a class="link-arrow" href="' + R.href('product', { slug: p.slug }, v ? { variant: v.id } : null) + '"><span>Дэлгэрэнгүй хуудас</span>' + ic('arrow-right') + '</a>' +
        '<a href="' + R.href('inquiry', { slug: p.slug }) + '" data-ord-only="on">Асуулт асуух</a></p>' + /* step2: ordering toggle */
      '</div></div>';
  }
  function openQV(slug, vid, origin) {
    var p = D.product(slug); if (!p) return;
    var v = p.variants ? (D.variantOf(p, vid) || p.variants[0]) : null;
    if (S.qv && S.qv.slug === slug) { if ((S.qv.v && S.qv.v.id) !== (v && v.id)) { S.qv.v = v; paintQV(); } return; }
    closeQV(true);
    var root = doc.createElement('div'); root.className = 'qv'; root.id = 'qv-root';
    doc.body.appendChild(root);
    S.qv = { slug: slug, p: p, v: v, qty: 1, root: root, ret: S.origin ? S.origin.key : (slug + (v ? '::' + v.id : '')) };
    paintQV();
    doc.documentElement.classList.add('is-shop-lock');
    S.qv.untrap = trap(root, function () { requestCloseQV(); });
    var panel = U.$('.qv-panel', root);

  }
  function paintQV() {
    var q = S.qv, root = q.root, panel = U.$('.qv-panel', root);
    var keep = panel && doc.activeElement && panel.contains(doc.activeElement) ? (doc.activeElement.name === 'qv-var' ? 'var' : null) : null;
    if (!panel) root.innerHTML = qvHTML(q.p, q.v, q.qty);
    else { var tmp = doc.createElement('div'); tmp.innerHTML = qvHTML(q.p, q.v, q.qty); panel.innerHTML = U.$('.qv-panel', tmp).innerHTML; }
    bindQV();

  }
  function bindQV() {
    var q = S.qv, root = q.root;
    U.$$('[data-qv-close]', root).forEach(function (b) { b.addEventListener('click', requestCloseQV); });
    U.$$('[data-qv-i]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var imgs = q.v ? q.v.images : q.p.images, m = imgs[+b.getAttribute('data-qv-i')], main = U.$('[data-qv-main]', root);
        main.src = D.img(m.file); main.alt = q.p.name + ' — ' + String(m.label).toLowerCase();
        U.$$('[data-qv-i]', root).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      });
    });
    U.$$('input[name="qv-var"]', root).forEach(function (r) {
      r.addEventListener('change', function () {
        var st = JSON.parse(JSON.stringify(S.state)); st.qv = q.slug; st.v = r.value;
        q.v = D.variantOf(q.p, r.value); paintQV();
        R.go(hrefFor(st, true), { replace: true });
      });
    });
    U.$$('[data-qty]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        q.qty = Math.max(1, Math.min(NG.cart.MAX_QTY, q.qty + +b.getAttribute('data-qty')));
        U.$('[data-qty-n]', root).textContent = q.qty;
        var bs = U.$$('[data-qty]', root); bs[0].disabled = q.qty <= 1; bs[1].disabled = q.qty >= NG.cart.MAX_QTY;
        if (b.disabled) (b === bs[0] ? bs[1] : bs[0]).focus();
      });
    });
    var add = U.$('[data-add]', root);
    if (add) add.addEventListener('click', function () {
      NG.cart.add(q.slug, q.v ? q.v.id : null, q.qty);
      NG.toast('Сагсанд нэмлээ', { href: '#/cart', label: 'Сагс харах' });
      var n = NG.cart.qty(q.slug, q.v ? q.v.id : null), el = U.$('[data-incart]', root);
      el.hidden = false; el.innerHTML = 'Сагсанд ' + n + ' ширхэг байна · <a href="#/cart">Сагс харах</a>';

  }
  function animateIn(root, panel, rect) {
    var red = U.reduced(), bd = U.$('.qv-backdrop', root);
    if (!panel.animate) return;
    bd.animate([{ opacity: 0 }, { opacity: 1 }], { duration: red ? 160 : 300, easing: 'ease-out' });
    if (red) { panel.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' }); return; }
    if (mobile() || !rect) {
      panel.animate([{ transform: 'translateY(48px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 400, easing: 'cubic-bezier(.16,1,.3,1)' });

  }
  /* mobile bottom sheet: drag the handle (or the panel when scrolled to the top) down > 80px, or flick → close.

  function bindDrag(root, panel) {

        else { if (dy < -6 && !d.handle) d = null; return; }

      if (U.reduced()) return;

      panel.style.transition = 'none'; panel.style.transform = 'translateY(' + k + 'px)';
      bd.style.opacity = String(Math.max(0.2, 1 - k / 500));
    }
    function end() {
      if (!d) return;
      var on = d.on, dy = d.y - d.y0, v = Math.max(d.v, dy / Math.max(1, d.t - d.t0)); d = null;
      if (!on) return;
      S.qvDragged = Date.now();
      if (dy > 80 || (v > 0.5 && dy > 24)) {
        if (!U.reduced()) { panel.style.transition = 'transform .2s ease-out'; panel.style.transform = 'translateY(100%)'; }
        requestCloseQV();
      } else {
        panel.style.transition = U.reduced() ? 'none' : 'transform .25s cubic-bezier(.16,1,.3,1)';
        panel.style.transform = ''; bd.style.opacity = '';
      }
    }
    panel.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { d = null; return; }
      start(e.touches[0].clientY, e.timeStamp, !!(e.target.closest && e.target.closest('[data-qv-handle]')));
    }, { passive: true });
    panel.addEventListener('touchmove', function (e) { if (d && e.touches.length === 1) move(e.touches[0].clientY, e.timeStamp, e); }, { passive: false });
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', function () { if (d && d.on) { d.y = d.y0; end(); } d = null; });

    panel.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch' || !(e.target.closest && e.target.closest('[data-qv-handle]'))) return;
      start(e.clientY, e.timeStamp, true); if (d) { try { panel.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } }
    });
    panel.addEventListener('pointermove', function (e) { if (e.pointerType !== 'touch' && d) move(e.clientY, e.timeStamp, e); });
    panel.addEventListener('pointerup', function (e) { if (e.pointerType !== 'touch') end(); });
  }
  /* user closes (×, backdrop, Esc): step back if we pushed the ?q entry, else replace */
  function requestCloseQV() {
    if (!S.qv) return;
    if (S.pushedQV) { S.pushedQV = false; history.back(); return; }
    var st = JSON.parse(JSON.stringify(S.state)); st.qv = null; st.v = null;
    R.go(hrefFor(st), { replace: true });
  }
  function closeQV(instant) {
    var q = S.qv; if (!q) return;
    S.qv = null;
    if (q.untrap) q.untrap();
    doc.documentElement.classList.remove('is-shop-lock');
    var root = q.root, finish = function () { if (root.parentNode) root.parentNode.removeChild(root); };
    if (instant || U.reduced() || !root.animate) finish();
    else { root.style.pointerEvents = 'none'; root.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out' }).onfinish = finish; }
    var main = doc.getElementById('app');
    var card = main && U.$$('.sc', main).filter(function (li) { return li.getAttribute('data-key') === q.ret; })[0];
    var link = card && U.$('.sc-link', card);
    if (link) { link.focus({ preventScroll: true }); var m = U.$('.sc-media', link); if (m && !link.matches(':hover')) showView(m, 0); }
  }

  /* ---------------------------------------------------------------- route */
  function render(route, ctx) {
    var s = Logic.parse(route.query, isSlug);
    S.state = s; S.ready = false; S.pushedQV = false;
    closeQV(true);
    var main = ctx.main;
    main.innerHTML = shellHTML(s);

  }

    var main = ctx.main;

    var s = Logic.parse(route.query, isSlug), prev = S.state;
    S.state = s;
    var h1 = U.$('.shop-h1', main); if (h1) h1.textContent = s.text ? 'Хайлт: ' + s.text : 'Бүтээгдэхүүн';
    if (Logic.filterKey(s) !== Logic.filterKey(prev) || s.sort !== prev.sort) {
      if (main.classList.contains('is-sheet')) closeSheet(main, false);
      paintFilters(main, s, true);
      if (S.ready) paintResults(main, s);
    }
    if (s.qv) { if (S.ready) openQV(s.qv, s.v, null); }
    else { S.pushedQV = false; closeQV(false); }
  }
  R.register('products', {
    title: function (route) { var s = Logic.parse(route.query, isSlug); if (s.qv) { var p = D.product(s.qv); if (p) return p.name; } return s.text ? 'Хайлт: ' + s.text : 'Бүтээгдэхүүн'; },
    render: render,
    update: update
  });
  /* legacy #/categories → the products page (D-12: «Ангилал» is not a menu item) */
  R.register('categories', {
    title: function () { return 'Бүтээгдэхүүн'; },
    render: function (route, ctx) {
      /* rewrite the URL and render the products page in place (a second navigation would cut the running view transition) */
      try { history.replaceState(history.state, '', '#/products'); } catch (e) { /* ignore */ }
      doc.body.setAttribute('data-route', 'products');
      render(R.parse('#/products'), ctx);
    }

    var m = doc.getElementById('app'), r = R.current;

    S.ready = false; load(m, S.state, null);
  });

  doc.addEventListener('ng:route', function (e) { if (e.detail && e.detail.name !== 'products') closeQV(true); });

  NG.shop = { logic: Logic, open: openQV, close: requestCloseQV };
})();

<script>
/* ===== order.js ===== */
/* Nogoolin Prototype E — order.js (owner: order worker). Guest order flow, all faked on this device (D-12):

   No account, no online payment, no delivery yet. Prototype switches: NG.proto 'sms' and 'order' (panel in chrome.js). */
(function () {
  'use strict';
  var NG = window.NG = window.NG || {};

  var money = function (n) { return (typeof NG.money === 'function' ? NG.money : D.money)(n); };

  var ORDERS_KEY = 'nogoolin-orders', DRAFT_KEY = 'nogoolin-order-draft';
  var SMS_CODE = '123456', RESEND_S = 60;
  var STATUSES = ['Хүлээн авсан', 'Бэлтгэж байна', 'Авахад бэлэн', 'Авсан'];
  var STORE = {
    name: 'Ногоолин дэлгүүр',
    address: 'Улаанбаатар, Сүхбаатар дүүрэг, 1-р хороо, Энхтайваны өргөн чөлөө 12 · жишээ',
    hours: ['Даваа–Баасан 10:00–19:00', 'Бямба 11:00–17:00', 'Ням гараг амарна'],
    keepDays: 7
  };

  /* ---------------------------------------------------------------- helpers */
  function focusEl(el) { if (!el) return; if (!el.hasAttribute('tabindex') && !/^(INPUT|BUTTON|A|SELECT|TEXTAREA)$/.test(el.tagName)) el.setAttribute('tabindex', '-1'); try { el.focus({ preventScroll: false }); } catch (e) { el.focus(); } }
  function done(ctx) { if (ctx && typeof ctx.done === 'function') ctx.done(); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function latency() { return NG.proto && NG.proto.get('slow') ? 1700 : 650; }
  function fail(msg, code, status) { var e = new Error(msg); e.code = code; if (status) e.status = status; return e; }
  function normPhone(v) {
    var s = String(v || '').replace(/[\s\-().]/g, '');

  }
  function validPhone(p) { return /^\d{8}$/.test(p); }

    o = o || {};
    var bw = bbox ? Math.max(.35, Math.min(.95, bbox[2] - bbox[0])) : .7;
    return '<span class="od-thumb' + (o.cls ? ' ' + o.cls : '') + '" style="--bw:' + bw.toFixed(2) + '"><span class="od-floor" aria-hidden="true"></span>' +

  }
  function steps(cur) {
    var labels = ['Холбоо барих', 'Баталгаажуулах', 'Дууссан'];

  }
  function setErr(root, id, text) {

  function showAlert(el, html) { el.innerHTML = ic('alert') + '<div>' + html + '</div>'; el.hidden = false; focusEl(el); }

  /* ---------------------------------------------------------------- cart model */

        price: price, qty: qty, line: price * qty, file: im.file, bbox: im.bbox };
    }).filter(Boolean);
  }
  function totals(items) {
    var qty = 0, sum = 0; items.forEach(function (x) { qty += x.qty; sum += x.line; });
    return { qty: qty, subtotal: sum, total: sum };
  }
  function sumLines(t) {
    return '<div><dt>Бүтээгдэхүүн (' + t.qty + ' ширхэг)</dt><dd class="price">' + money(t.subtotal) + '</dd></div><div><dt>Дэлгүүрээс авах</dt><dd>үнэгүй</dd></div>';
  }
  function sumTotal(t) { return '<div class="od-sum-total"><dt>Нийт дүн</dt><dd class="price" data-od-total>' + money(t.total) + '</dd></div>'; }
  function summaryRows(t) { return '<dl class="od-sum-rows">' + sumLines(t) + sumTotal(t) + '</dl>' + SUM_NOTE; }
  var SUM_NOTE = '<p class="od-sum-note">Нэмэлт төлбөр, нуугдмал хураамж байхгүй. Төлбөр: дэлгүүрт авахдаа (бэлэн, карт, QPay).</p>';

  /* ---------------------------------------------------------------- orders storage + fake API */
  function orders() { var v = U.store.get(ORDERS_KEY, []); return Array.isArray(v) ? v : []; }
  function findOrder(no) { no = String(no || '').trim().toUpperCase(); return orders().filter(function (o) { return o.no === no; })[0] || null; }
  function newNumber() {
    var d = new Date(), base = 'NG-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1, 2) + pad(d.getDate(), 2) + '-', no;

  }
  var api = {
    sendCode: function () {
      return wait(latency()).then(function () {

    },
    verifyCode: function (code) {

    }
    function paint(e) { ['co-name', 'co-phone', 'co-consent'].forEach(function (id) { setErr(form, id, e[id] || ''); }); }
    form.addEventListener('input', function () { save(); if (tried) paint(errs()); });
    form.addEventListener('change', function () { save(); if (tried) paint(errs()); });
    phone.addEventListener('blur', function () { var n = normPhone(phone.value); if (validPhone(n)) { phone.value = n; save(); } });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault(); if (isBusy(send)) return;

      if (keys.length) { U.announce(keys.length + ' талбарт алдаа байна. ' + e[keys[0]]); focusEl(form.querySelector('[aria-invalid="true"]')); return; }

      api.sendCode().then(function () {
        busy(send, false); goStep2(main, body);
      }, function () {
        busy(send, false);
        showAlert(alertEl, '<p>SMS код илгээж чадсангүй. Таны мэдээлэл хадгалагдсан — дахин оролдоно уу.</p><button type="button" class="btn btn-quiet" data-od-retry>Дахин оролдох</button>');

  function goStep2(main, body) {
    var flow = main.querySelector('[data-co-flow]'); if (!flow) return;
    var head = main.querySelector('.od-stepper'); if (head) head.outerHTML = steps(2);
    flow.innerHTML = smsStepHTML({ phone: body.phone, title: 'SMS кодоор баталгаажуулах', verifyLabel: 'Захиалга баталгаажуулах' }) +
      '<div class="od-recap"><p><strong>' + esc(body.name) + '</strong> · <span class="num">' + esc(body.phone) + '</span></p>' + storeHTML('h3') + '</div>';
    U.announce('Алхам 2: ' + maskPhone(body.phone) + ' дугаарт код илгээлээ');
    var ctl = bindSms(flow, {
      phone: body.phone,
      onEdit: function () {
        var dr = U.store.get(DRAFT_KEY, {}, true) || {};

      var items = cartItems();
      if (!items.length) { R.go('#/cart'); return Promise.resolve(); }

      busy(c.verifyBtn, true, 'Илгээж байна…'); U.announce('Захиалга илгээж байна…');
      var payload = { name: body.name, phone: body.phone, note: body.note, total: t.total,
        items: items.map(function (x) { return { slug: x.slug, variant: x.variant, name: x.name, vlabel: x.vlabel, price: x.price, qty: x.qty, file: x.file, bbox: x.bbox }; }) };
      return api.createOrder(payload).then(function (res) {
        U.store.del(DRAFT_KEY, true);
        NG.cart.clear();
        U.announce('Захиалга баталгаажлаа: ' + res.data.no);
        R.go(R.href('order', { id: res.data.no }));

    }
    function orderError(err, c) {
      var code = err && err.code;
      if (code === 'RATE_LIMIT_EXCEEDED') {
        c.alert('<p>Хэт олон оролдлого хийлээ. 1 минутын дараа дахин оролдоно уу.</p><p class="field-hint">Таны мэдээлэл болон сагс хадгалагдсан.</p>');
      } else if (code === 'OUT_OF_STOCK') {
        var it = err.item || {};
        c.alert('<p>«' + esc(it.name || 'Нэг бүтээгдэхүүн') + (it.vlabel ? ' — ' + esc(it.vlabel) : '') + '» дууссан байна.</p>' +
          '<p class="field-hint">Сагснаасаа хасах эсвэл тоог өөрчлөөд дахин захиална уу.</p><a class="btn btn-quiet" href="#/cart">Сагс руу буцах</a>');
      } else {
        c.alert('<p>Сүлжээний алдаа гарлаа. Захиалга илгээгдсэнгүй.</p><p class="field-hint">Таны мэдээлэл хадгалагдсан — дахин оролдоно уу.</p>' +
          '<button type="button" class="btn btn-quiet" data-od-retry>Дахин оролдох</button>');
        c.retryWith(function () {
          var b = this; busy(b, true, 'Илгээж байна…');
          place(c).catch(function (e2) { busy(b, false); busy(c.verifyBtn, false); orderError(e2, c); });
        });

  R.register('checkout', { title: function () { return 'Захиалах'; }, render: renderCheckout });

  /* ================================================================ #/order/<no> */

      if (!validPhone(phone)) e['lk-phone'] = 'Утасны дугаар 8 оронтой байна';

<script>
/* ===== admin.js ===== */
/* Nogoolin Prototype E — admin.js (owner: admin shell worker, step 2). Admin prototype shell + built-in sections.
   Routes (core.js): #/admin (dashboard) · #/admin/:section · #/admin/:section/:id. Everything renders inside #app;

   ---------------------------------------------------------------- HELPERS for section modules (e.g. admin-catalog.js)
   NG.admin.section(id, { label, order, render(host, route, ctx), title?(route) })
       Register a section. Built-in orders: dashboard 0 · orders 10 · products 20 · categories 30 · questions 40 ·
       settings 50 · audit 60. route = router route ({name, params:{section,id}, query}); host = content element.
       ctx = { main, host, section, id, route, rerender() }. Put ONE <h1> first in host (router focuses it after
       navigation); NG.admin.head(title, lead, asideHTML) returns a ready header. Call nothing else for focus.
   NG.admin.audit(action, detail, type?) → entry   Append-only log, localStorage 'nogoolin-audit',
       entry { at ISO, who:'Админ (жишээ)', action, detail, type }. type ∈ order|question|settings|product|category|other
       (guessed from the action text when omitted). NG.admin.auditList() → newest first. No edit/delete API on purpose.
   NG.admin.toast(text)                             Short status message (site toast, aria-live).
   NG.admin.confirm({ title, text?, html?, ok?, cancel?, danger?, field? }) → Promise<boolean>
       Modal dialog: focus trap, Esc/backdrop = cancel, focus returns to the opener. danger:true styles OK as
       destructive and focuses Cancel first. field:{ label, hint?, required?, value? } adds a textarea and the
       promise resolves to the trimmed string (or false on cancel) instead of true.
   NG.admin.fmt.money(n) '1,450,000₮' · fmt.date(iso) 'YYYY.MM.DD HH:mm' · fmt.day(iso) 'YYYY.MM.DD' ·
       fmt.phone(p) masked '9911····'
   NG.admin.table(cols, rows, opts?) → HTML string. cols [{ key, label, html?(row) → trusted HTML, cls? }];
       cls 'is-primary' = card title on ≤640 px (no label), 'is-num' = right aligned. opts { caption, empty }.
       ≤640 px rows become stacked cards (td::before shows the column label).
   NG.admin.href(section, id?) → '#/admin/…' · NG.admin.esc(s) · NG.admin.rerender() repaints the current admin view.
   NG.admin.STATUSES — order statuses incl. 'Цуцалсан'. NG.admin.orders.list()/get(no)/save(order).

(function () {
  'use strict';

  var AUDIT_KEY = 'nogoolin-audit', ORDERS_KEY = 'nogoolin-orders', Q_KEY = 'nogoolin-admin-questions', SEED_KEY = 'nogoolin-admin-seeded';

  /* ---------------------------------------------------------------- fmt */

    date: function (iso) { var d = dt(iso); return d ? fmt.day(iso) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; },
    time: function (iso) { var d = dt(iso); return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; },

  /* ---------------------------------------------------------------- confirm dialog */
  function focusables(el) {

  A.confirm = function (o) {
    o = o || {};
    return new Promise(function (resolve) {

<script>

    function addFile(view, file) {

    form.addEventListener('submit', function (e) {

    var cs = loadC();

    U.store.set(KC, cs); apply();

  function heroOptions(c) {
    var files = [];
    if (c.hero) files.push(c.hero);

      (p.images || []).forEach(function (im) { if (!isPlaceholder(im) && files.indexOf(im.file) < 0) files.push(im.file); });
      (p.variants || []).forEach(function (v) { (v.images || []).forEach(function (im) { if (!isPlaceholder(im) && files.indexOf(im.file) < 0) files.push(im.file); }); });
    });
    return files;
  }
  function renderCats(host, focusSel) {
    var cats = catsSorted();
    host.innerHTML = '<div class="ac">' + heading('Ангилал', 'Сайтын «Бүтээгдэхүүн» хуудсанд ангиллууд энэ дарааллаар гарна.') +
      '<table class="ac-table ac-ctable"><caption class="sr-only">Ангиллын жагсаалт, дарааллаар</caption><thead><tr>' +
      '<th scope="col">Дараалал</th><th scope="col">Нэр</th><th scope="col">Тайлбар</th><th scope="col" class="num">Бүтээгдэхүүн</th><th scope="col"><span class="sr-only">Үйлдэл</span></th></tr></thead><tbody>' +
      cats.map(function (c, i) {

            '<button type="button" class="ac-ib" data-up="' + esc(c.slug) + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="«' + esc(c.name) + '»-г дээш"><span aria-hidden="true">↑</span></button>' +
            '<button type="button" class="ac-ib" data-down="' + esc(c.slug) + '"' + (i === cats.length - 1 ? ' disabled' : '') + ' aria-label="«' + esc(c.name) + '»-г доош"><span aria-hidden="true">↓</span></button></td>' +

          '<td class="ac-desc" data-label="Тайлбар">' + esc(c.desc || '') + '</td>' +
          '<td class="num" data-label="Бүтээгдэхүүн">' + c.count + '</td>' +
          '<td class="ac-act"><button type="button" class="btn btn-quiet" data-edit="' + esc(c.slug) + '" aria-expanded="' + editing + '" aria-label="«' + esc(c.name) + '» засах">Засах</button></td></tr>' +

        saveCats((function () { var o = {}; o[slug] = { name: name, desc: f.elements.desc.value.trim(), hero: heroEl ? heroEl.value : D.category(slug).hero }; return o; })());

        CS.edit = null; renderCats(host, '[data-edit="' + slug + '"]');
