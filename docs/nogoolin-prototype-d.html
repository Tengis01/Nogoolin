    var script = document.getElementById('three-js');
    threeTimer = setTimeout(fallbackNoThree, THREE_WAIT);
    function onLoad() { clearTimeout(threeTimer); if (window.THREE) startWithThree(); else fallbackNoThree(); }
    function onErr() { clearTimeout(threeTimer); fallbackNoThree(); }
    if (script) {
      script.addEventListener('load', onLoad, { once: true });
      script.addEventListener('error', onErr, { once: true });
    } else {
      var iv = setInterval(function () {
        if (window.THREE) { clearInterval(iv); clearTimeout(threeTimer); startWithThree(); }
      }, 100);
    }
  }

  /* ---------------------------------------------------------------- wiring */
  function wireDOM() {
    el.stage.addEventListener('click', function () { if (phase === 'final') nudgeStart(); else forward(); });
    el.skip.addEventListener('click', function () { finish(); });
    el.start.addEventListener('click', function () { startMorph(); });

    document.addEventListener('pointerdown', function () { kbd = false; hero.classList.remove('is-kbd'); }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Tab' || e.key === ' ' || e.key === 'Enter' || e.key.indexOf('Arrow') === 0) { kbd = true; hero.classList.add('is-kbd'); }
      if (phase !== 'intro' && phase !== 'final') return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var t = e.target;
      var onControl = t && t !== el.stage && t.closest && t.closest('button, a, input, textarea, select');
      switch (e.key) {
        case 'Escape': e.preventDefault(); finish(); break;
        case 'ArrowRight': case 'PageDown': e.preventDefault(); forward(); break;
        case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(step - 1); break;
        case ' ': case 'Enter': if (onControl) return; e.preventDefault(); forward(); break;
        default: break;
      }
    });

    var resizeQueued = false;
    window.addEventListener('resize', function () {
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(function () {
        resizeQueued = false;
        if (!webgl || phase === 'idle') return;
        if (phase === 'home') { cur = copy(homePose()); prev = copy(cur); }
        else if (phase === 'intro' || phase === 'final') {
          var p = pose(step);
          if (tw.active) tw.to = copy(p); else cur = copy(p);
        }
        resizeRenderer();
        if (REDUCED || !raf) renderOnce();
      });
    });

    document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        if (visible) kick();
      }).observe(hero);
    }
    window.addEventListener('hashchange', function () {
      if (!isHomeHash(location.hash) && (phase === 'idle' || phase === 'intro' || phase === 'final' || phase === 'morph')) finish();
    });
    document.addEventListener('ng:palette', function () { applyPalette(); if (REDUCED || !raf) renderOnce(); });
  }

  function build() {
    if (domBuilt || !hero) return;
    buildDOM();
    wireDOM();
    domBuilt = true;
  }

  function resume() {
    running = true;
    if (!webgl) return;
    resizeRenderer();
    if (REDUCED) renderOnce(); else kick();
  }
  function pause() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function mount() {
    if (!hero) return;
    if (!domBuilt) build();
    if (phase === 'idle') {
      /* item 6: reduced motion shares the flat static hero with the no-WebGL fallback — no canvas at all.
         While three.js loads, the intro already owns the screen (veil + mark + «Алгасах»), so lock now. */
      if (REDUCED) { fallbackNoThree(); } else { if (!skipIntro && !seen()) lockBody(); waitForThree(); }
    }
    resume();
  }

  function finish() {
    if (!domBuilt) { skipIntro = true; unlockBody(); return; }
    if (phase === 'home' || phase === 'fallback') { unlockBody(); return; }
    if (phase === 'idle') {
      /* «Алгасах» while three.js is still loading: static hero now; startWithThree() upgrades it to 3D when it lands */
      skipIntro = true; clearTimeout(threeTimer); fallbackNoThree(); return;
    }
    goHome(true);
    if (webgl) renderOnce();
  }

  function replay() {
    if (!hero) return;
    if (!domBuilt) build();
    try { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); }
    skipIntro = false;
    if (webgl) { startIntro(); resume(); } else { waitForThree(); resume(); }
  }

  window.NG.intro = {
    mount: mount,
    pause: pause,
    finish: finish,
    replay: replay,
    get phase() { return phase; }
  };

  /* standalone: only auto-mount on "/" when no router is present */
  setTimeout(function () {
    if (!window.NG.router && phase === 'idle' && isHomeHash(location.hash)) mount();
  }, 0);
})();

</script>
<script>
/* ===== search.js ===== */
/* Nogoolin Prototype D — search.js (owner: search agent).
   Transliteration-tolerant search: ARIA combobox (APG "editable combobox with list autocomplete"),
   focus panel (recent/popular/categories), live suggestions with highlighted matches, no-results state,
   Enter -> #/products?q=<query> (the lead's list view calls NG.api.products({q}) -> NG.search.rank). */
(function () {
  'use strict';
  var NG = window.NG = window.NG || {};
  var RECENT_KEY = 'nogoolin-recent-searches';
  var RECENT_MAX = 6;

  /* ================================================================ transliteration skeleton */
  var CYR_MAP = {
    'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e', 'ж': 'j', 'з': 'z', 'и': 'i',
    'й': 'i', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o', 'ө': 'o', 'п': 'p', 'р': 'r', 'с': 's',
    'т': 't', 'у': 'u', 'ү': 'u', 'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'sh', 'ъ': '',
    'ы': 'i', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya'
  };
  function stripDiacritics(s) {
    try { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) { return s; }
  }
  function isCyrillicWord(w) { return /[а-яёөү]/i.test(w); }
  function cyrRaw(word) {
    var out = '';
    for (var i = 0; i < word.length; i++) { var c = word[i]; out += CYR_MAP.hasOwnProperty(c) ? CYR_MAP[c] : c; }
    return out;
  }
  function latinRaw(word) {
    var w = stripDiacritics(word);
    w = w.replace(/kh/g, 'h').replace(/zh/g, 'j').replace(/w/g, 'v').replace(/q/g, 'k').replace(/x/g, 'ks');
    w = w.replace(/yu/g, 'u').replace(/ya/g, 'a').replace(/ye/g, 'e').replace(/yo/g, 'o').replace(/y/g, 'i');
    return w;
  }
  /* collapsing + final-i-drop are applied uniformly to BOTH scripts' raw output so a Latin-spelled
     double vowel (e.g. "zaan") lands on the same skeleton as its Cyrillic source ("заан" -> z+a+a+n). */
  function collapseDoubles(w) { return w.replace(/oo/g, 'o').replace(/aa/g, 'a').replace(/ee/g, 'e').replace(/uu/g, 'u').replace(/ii/g, 'i'); }
  function dropFinalI(w) { return w.replace(/([^aeiou])i$/, '$1'); }
  function wordSkeleton(raw) {
    var w = String(raw || '').toLowerCase();
    if (!w) return '';
    var r = isCyrillicWord(w) ? cyrRaw(w) : latinRaw(w);
    return dropFinalI(collapseDoubles(r));
  }
  function tokenizeRaw(s) { return String(s || '').match(/[0-9a-zA-Zа-яёөүА-ЯЁӨҮ]+/g) || []; }
  function tokensSkel(s) { return tokenizeRaw(s).map(wordSkeleton).filter(Boolean); }
  function normalize(str) { return tokensSkel(str).join(' '); }

  function levenshtein(a, b) {
    var al = a.length, bl = b.length;
    if (!al) return bl; if (!bl) return al;
    var prev = []; for (var j = 0; j <= bl; j++) prev[j] = j;
    for (var i = 1; i <= al; i++) {
      var cur = [i];
      for (var j2 = 1; j2 <= bl; j2++) {
        var cost = a.charAt(i - 1) === b.charAt(j2 - 1) ? 0 : 1;
        cur[j2] = Math.min(prev[j2] + 1, cur[j2 - 1] + 1, prev[j2 - 1] + cost);
      }
      prev = cur;
    }
    return prev[bl];
  }
  function fuzzyPrefixMatch(qt, tok) {
    if (!qt || !tok) return false;
    if (tok.indexOf(qt) === 0) return true;
    if (qt.length < 5) return false;
    var cand = tok.length > qt.length + 1 ? tok.slice(0, qt.length + 1) : tok;
    return levenshtein(qt, cand) <= 1;
  }
  function tierIndex(qt, toks) {
    for (var i = 0; i < toks.length; i++) { if (fuzzyPrefixMatch(qt, toks[i])) return i; }
    return -1;
  }

  /* ================================================================ highlight */
  var SEP_RE = /^[\s,.;:!?()«»"'·\-–—]+$/;
  function esc(s) { return NG.util && NG.util.esc ? NG.util.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function highlight(text, q) {
    var str = String(text == null ? '' : text);
    var qTokens = tokensSkel(q);
    if (!qTokens.length) return esc(str);
    var parts = str.match(/[^\s,.;:!?()«»"'·\-–—]+|[\s,.;:!?()«»"'·\-–—]+/g) || [str];
    return parts.map(function (part) {
      if (SEP_RE.test(part) || !part) return esc(part);
      var skel = wordSkeleton(part);
      var isMatch = qTokens.some(function (qt) { return fuzzyPrefixMatch(qt, skel); });
      return isMatch ? '<mark class="hl">' + esc(part) + '</mark>' : esc(part);
    }).join('');
  }

  /* ================================================================ ranking */
  function fieldsFor(p) {
    var cat = NG.data.category(p.category);
    var nameToks = tokensSkel(p.name).concat(tokensSkel(p.name_en || ''));
    var tagToks = tokensSkel((p.search_tags || []).join(' '));
    var otherToks = tokensSkel(
      (cat ? cat.name + ' ' + (cat.name_en || '') : '') + ' ' +
      (p.materialKeys || []).map(function (k) { return NG.data.materials[k] || ''; }).join(' ') + ' ' +
      (NG.data.types[p.type] || '')
    );
    return { nameToks: nameToks, tagToks: tagToks, otherToks: otherToks, nameFull: normalize(p.name) };
  }
  function scoreProduct(p, qTokens, qn) {
    var f = fieldsFor(p);
    var worst = 3, posSum = 0, ok = true;
    qTokens.forEach(function (qt) {
      var idx = tierIndex(qt, f.nameToks), tier = 3;
      if (idx < 0) { idx = tierIndex(qt, f.tagToks); tier = 2; }
      if (idx < 0) { idx = tierIndex(qt, f.otherToks); tier = 1; }
      if (idx < 0) { ok = false; return; }
      posSum += idx;
      if (tier < worst) worst = tier;
    });
    if (!ok) return null;
    var phraseStart = qn && (f.nameFull === qn || f.nameFull.indexOf(qn + ' ') === 0);
    var tierVal = phraseStart ? 4 : worst;
    return tierVal * 100000 - posSum;
  }
  function rank(q, products) {
    var list = products || (NG.data ? NG.data.products : []);
    var qn = normalize(q);
    var qTokens = qn ? qn.split(' ').filter(Boolean) : [];
    if (!qTokens.length) return list.slice();
    var scored = [];
    list.forEach(function (p) { var s = scoreProduct(p, qTokens, qn); if (s != null) scored.push({ p: p, s: s }); });
    scored.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      if (a.p.is_featured !== b.p.is_featured) return a.p.is_featured ? -1 : 1;
      return b.p.created.localeCompare(a.p.created);
    });
    return scored.map(function (x) { return x.p; });
  }

  /* ================================================================ suggest */
  function tokensMatchAll(qTokens, text) {
    var toks = tokensSkel(text);
    return qTokens.every(function (qt) { return toks.some(function (t) { return fuzzyPrefixMatch(qt, t); }); });
  }
  function suggest(q) {
    var qTokens = tokensSkel(q);
    if (!qTokens.length) return { keywords: [], products: [], categories: [] };
    var matched = rank(q, NG.data.products);
    var products = matched.slice(0, 4);
    var keywords = [], seen = {};
    function addKw(text, kind, href) {
      var key = kind + ':' + text.toLowerCase();
      if (seen[key] || keywords.length >= 6) return;
      seen[key] = 1;
      keywords.push({ text: text, html: highlight(text, q), kind: kind, href: href });
    }
    matched.slice(0, 8).forEach(function (p) {
      (p.search_tags || []).forEach(function (tag) {
        if (keywords.length >= 6) return;
        if (tokensMatchAll(qTokens, tag)) addKw(tag, 'tag', NG.router.href('products', {}, { q: tag }));
      });
    });
    var categories = [];
    NG.data.categories.forEach(function (c) {
      if (!tokensMatchAll(qTokens, c.name + ' ' + (c.name_en || ''))) return;
      categories.push(c);
      addKw(c.name, 'category', NG.router.href('products', {}, { category: c.slug }));
    });
    Object.keys(NG.data.materials).forEach(function (k) {
      var label = NG.data.materials[k];
      if (!tokensMatchAll(qTokens, label)) return;
      addKw(label, 'material', NG.router.href('products', {}, { material: k }));
    });
    return { keywords: keywords, products: products, categories: categories };
  }

  /* ================================================================ recent searches */
  function readRecent() {
    var v = NG.util.store.get(RECENT_KEY, []);
    return Array.isArray(v) ? v : [];
  }
  function saveRecent(q) {
    q = String(q || '').trim();
    if (!q) return;
    var list = readRecent().filter(function (it) { return String(it).toLowerCase() !== q.toLowerCase(); });
    list.unshift(q);
    NG.util.store.set(RECENT_KEY, list.slice(0, RECENT_MAX));
  }
  function clearRecent() { NG.util.store.set(RECENT_KEY, []); }


  /* ================================================================ widget (APG editable combobox, list autocomplete)
     DOM: input[role=combobox] → aria-controls → [role=listbox] that holds [role=group] sections (each aria-labelledby a
     visible title) and [role=option] rows. Non-option content (recent «Цэвэрлэх» button, no-results copy) lives in
     .search-pre, outside the listbox. */
  var widgets = [];
  function createWidget(host, opts) {
    opts = opts || {};
    host.innerHTML =
      '<div class="search" data-open="false">' +
        '<div class="search-field">' +
          NG.util.icon('search', 'search-ic') +
          '<input type="text" class="search-input" id="' + opts.inputId + '" ' +
            'role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-autocomplete="list" ' +
            'aria-controls="' + opts.listId + '" aria-label="Хайх" enterkeyhint="search" ' +
            'placeholder="Бурхан шүтээн, тангад, хүж…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
          '<button type="button" class="search-clear-btn" hidden aria-label="Арилгах">' + NG.util.icon('close') + '</button>' +
        '</div>' +
        '<div class="search-panel" id="' + opts.panelId + '" hidden>' +
          '<div class="search-pre"></div>' +
          '<div class="search-panel-body" role="listbox" id="' + opts.listId + '" aria-label="Хайлтын санал"></div>' +
        '</div>' +
      '</div>';
    var root = host.querySelector('.search');
    var input = host.querySelector('.search-input');
    var panel = host.querySelector('.search-panel');
    var pre = host.querySelector('.search-pre');
    var list = host.querySelector('[role="listbox"]');
    var clearBtn = host.querySelector('.search-clear-btn');
    var options = []; var activeIndex = -1; var isOpen = false; var renderedQ = null; var gseq = 0;

    function optId(i) { return opts.listId + '-opt-' + i; }
    function setOpen(v) {
      isOpen = v;
      root.setAttribute('data-open', v ? 'true' : 'false');
      input.setAttribute('aria-expanded', v ? 'true' : 'false');
      panel.hidden = !v;
      if (!v) setActive(-1);
    }
    function setActive(i) {
      var prevEl = activeIndex >= 0 && options[activeIndex] ? options[activeIndex].el : null;
      if (prevEl) { prevEl.classList.remove('is-active'); prevEl.setAttribute('aria-selected', 'false'); }
      activeIndex = i;
      var el = i >= 0 && options[i] ? options[i].el : null;
      if (el) {
        el.classList.add('is-active'); el.setAttribute('aria-selected', 'true');
        input.setAttribute('aria-activedescendant', el.id);
        if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      } else {
        activeIndex = -1;
        input.removeAttribute('aria-activedescendant');
      }
    }
    function go(hash) { setOpen(false); NG.router.go(hash); }
    function runAction(opt) { if (opt && opt.action) opt.action(); }
    function group(title, itemsHtml, listCls, labelId) {
      if (!itemsHtml) return '';
      var gid = labelId || (opts.listId + '-g' + (++gseq));
      return '<div class="search-group" role="group" aria-labelledby="' + gid + '">' +
        (labelId ? '' : '<div class="search-group-title" role="presentation" id="' + gid + '">' + esc(title) + '</div>') +
        '<ul class="' + (listCls || 'search-opt-list') + '" role="none">' + itemsHtml + '</ul></div>';
    }
    function thumbImg(file) {
      if (!file) return '<span class="search-thumb search-thumb-empty" aria-hidden="true"></span>';
      return '<span class="search-thumb plinth"><img src="' + esc(NG.data.img(file, { thumb: true })) + '" alt="" width="48" height="60" loading="lazy" decoding="async"></span>';
    }
    function bindOptions(defs) {
      options = []; activeIndex = -1;
      defs.forEach(function (d, idx) {
        var el = d.el;
        el.id = optId(idx); el.setAttribute('role', 'option'); el.setAttribute('aria-selected', 'false');
        el.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        el.addEventListener('click', function () { runAction(d); });
        options.push({ el: el, action: d.action });
      });
      input.removeAttribute('aria-activedescendant');
    }
    function catsSorted() { return (NG.data.categories || []).slice().sort(function (a, b) { return a.order - b.order; }); }
    function queryAction(t) { return function () { input.value = t; clearBtn.hidden = !t; saveRecent(t); go(NG.router.href('products', {}, { q: t })); }; }
    function catAction(c, rememberQ) { return function () { if (rememberQ) saveRecent(rememberQ); go(NG.router.href('products', {}, { category: c.slug })); }; }

    function renderIdle() {
      gseq = 0; renderedQ = '';
      var recent = readRecent();
      var recentId = opts.listId + '-recent';
      pre.innerHTML = recent.length ? '<div class="search-recent-head"><span class="search-group-title" id="' + recentId + '">Сүүлд хайсан</span>' +
        '<button type="button" class="search-clear-recent">Цэвэрлэх</button></div>' : '';
      var pop = NG.data.popular || [];
      var cats = catsSorted();
      list.innerHTML =
        (recent.length ? group('', recent.map(function (r, i) { return '<li class="search-option search-option-recent" data-ridx="' + i + '">' + esc(r) + '</li>'; }).join(''), null, recentId) : '') +
        group('Түгээмэл хайлт', pop.map(function (p, i) { return '<li class="search-option search-option-pop" data-pidx="' + i + '">' + esc(p) + '</li>'; }).join('')) +
        group('Ангиллаар', cats.map(function (c, i) {
          var count = NG.data.byCategory ? NG.data.byCategory(c.slug).length : (c.count || 0);
          var thumb = c.hero && count ? '<span class="search-cat-plinth plinth"><img class="search-cat-thumb" src="' + esc(NG.data.img(c.hero, { thumb: true })) + '" alt="" width="48" height="60" loading="lazy" decoding="async"></span>' :
            '<span class="search-cat-plinth search-cat-thumb-empty" aria-hidden="true"></span>';
          return '<li class="search-option search-option-cat" data-cidx="' + i + '">' + thumb +
            '<span class="search-cat-text"><span class="search-cat-name">' + esc(c.name) + '</span>' + (count ? '' : '<span class="search-cat-soon">Тун удахгүй</span>') + '</span></li>';
        }).join(''), 'search-cat-list');
      var defs = [];
      NG.util.$$('.search-option-recent', list).forEach(function (el) { defs.push({ el: el, action: queryAction(recent[+el.getAttribute('data-ridx')]) }); });
      NG.util.$$('.search-option-pop', list).forEach(function (el) { defs.push({ el: el, action: queryAction(pop[+el.getAttribute('data-pidx')]) }); });
      NG.util.$$('.search-option-cat', list).forEach(function (el) { defs.push({ el: el, action: catAction(cats[+el.getAttribute('data-cidx')]) }); });
      bindOptions(defs);
      var clearRecentBtn = pre.querySelector('.search-clear-recent');
      if (clearRecentBtn) {
        clearRecentBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
        clearRecentBtn.addEventListener('click', function (ev) { ev.preventDefault(); clearRecent(); renderIdle(); input.focus(); NG.util.announce('Сүүлд хайсан жагсаалт цэвэрлэгдлээ'); });
      }
    }

    function renderTyping(q, res) {
      gseq = 0;
      pre.innerHTML = '';
      var kwHtml = res.keywords.map(function (k, i) { return '<li class="search-option search-option-kw" data-kidx="' + i + '"><span class="search-kw">' + k.html + '</span></li>'; }).join('');
      var prodHtml = res.products.map(function (p, i) {
        var file = p.images && p.images[0] ? p.images[0].file : null;
        return '<li class="search-option search-option-product" data-xidx="' + i + '">' +
          thumbImg(file) + '<span class="search-prod-info"><span class="search-prod-name">' + highlight(p.name, q) + '</span>' +
          '<span class="search-prod-meta"><span class="price">' + esc(NG.data.money(p.price)) + '</span> · ' +
          esc((NG.data.category(p.category) || {}).name || '') + '</span></span></li>';
      }).join('');
      list.innerHTML = group('Санал', kwHtml) + group('Бүтээгдэхүүн', prodHtml, 'search-opt-list search-opt-products') +
        '<ul class="search-opt-list search-opt-all" role="none"><li class="search-option search-option-all">' + esc('“' + q + '” гэж бүгдийг хайх') + '</li></ul>';
      var defs = [];
      NG.util.$$('.search-option-kw', list).forEach(function (el) {
        var k = res.keywords[+el.getAttribute('data-kidx')];
        defs.push({ el: el, action: function () { input.value = k.text; clearBtn.hidden = false; saveRecent(k.text); go(k.href); } });
      });
      NG.util.$$('.search-option-product', list).forEach(function (el) {
        var p = res.products[+el.getAttribute('data-xidx')];
        defs.push({ el: el, action: function () { saveRecent(q); go(NG.router.href('product', { slug: p.slug })); } });
      });
      defs.push({ el: list.querySelector('.search-option-all'), action: function () { commitSearch(q); } });
      bindOptions(defs);
      var n = res.keywords.length + res.products.length;
      NG.util.announce(n + ' санал');
    }

    function renderEmpty(q) {
      gseq = 0;
      pre.innerHTML = '<p class="search-empty-title">“' + esc(q) + '”-д тохирох зүйл олдсонгүй</p>' +
        '<p class="search-empty-hint">Латин үсгээр бичиж болно: huj, dari ekh, tangad</p>';
      var pop = NG.data.popular || [];
      var cats = catsSorted();
      list.innerHTML = group('Түгээмэл хайлт', pop.map(function (p, i) { return '<li class="search-option search-option-pop" data-pidx="' + i + '">' + esc(p) + '</li>'; }).join('')) +
        group('Ангиллаар', cats.map(function (c, i) { return '<li class="search-option search-option-cat search-option-cat-text" data-cidx="' + i + '"><span class="search-cat-name">' + esc(c.name) + '</span></li>'; }).join(''), 'search-cat-list search-cat-list-text');
      var defs = [];
      NG.util.$$('.search-option-pop', list).forEach(function (el) { defs.push({ el: el, action: queryAction(pop[+el.getAttribute('data-pidx')]) }); });
      NG.util.$$('.search-option-cat', list).forEach(function (el) { defs.push({ el: el, action: catAction(cats[+el.getAttribute('data-cidx')], q) }); });
      bindOptions(defs);
      NG.util.announce('“' + q + '”-д тохирох зүйл олдсонгүй');
    }

    function renderFor(q) {
      var t = String(q || '').trim();
      if (!t) renderIdle();
      else {
        var res = suggest(t);
        if (!res.keywords.length && !res.products.length) renderEmpty(t); else renderTyping(t, res);
        renderedQ = t;
      }
      setOpen(true);
    }
    var debouncedRender = NG.util.debounce(function () { if (doc().activeElement === input) renderFor(input.value); }, 120);
    function doc() { return document; }

    function commitSearch(q) {
      q = String(q == null ? input.value : q).trim();
      if (!q) return;
      input.value = q;
      saveRecent(q);
      go(NG.router.href('products', {}, { q: q }));
    }

    function onInput() { clearBtn.hidden = !input.value; debouncedRender(); }
    function onFocus() { renderFor(input.value); }
    function syncNow() { if (String(input.value).trim() !== renderedQ) renderFor(input.value); }
    function onKeydown(ev) {
      if (ev.isComposing) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        if (!isOpen) { renderFor(input.value); return; }
        syncNow();
        if (!options.length) return;
        var d = ev.key === 'ArrowDown' ? 1 : -1;
        var next = activeIndex < 0 ? (d > 0 ? 0 : options.length - 1) : (activeIndex + d + options.length) % options.length;
        setActive(next);
      } else if (ev.key === 'Enter') {
        ev.preventDefault();

        ev.preventDefault();

      } else if (ev.key === 'Home' || ev.key === 'End') {

    input.addEventListener('focus', onFocus);
    input.addEventListener('keydown', onKeydown);
    clearBtn.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
    clearBtn.addEventListener('click', function () { input.value = ''; clearBtn.hidden = true; renderIdle(); setOpen(true); input.focus(); });
    document.addEventListener('focusin', function (ev) { if (isOpen && !root.contains(ev.target)) setOpen(false); });
    document.addEventListener('mousedown', function (ev) { if (isOpen && !root.contains(ev.target)) setOpen(false); });

    var widget = {
      root: root, input: input,
      focusInput: function () { input.focus(); },
      close: function () { setOpen(false); },
      setQuery: function (q) { input.value = q || ''; clearBtn.hidden = !q; renderedQ = null; }
    };
    widgets.push(widget);
    return widget;
  }

  /* ================================================================ mobile full-screen overlay */
  var uidCounter = 0;
  var overlayWidget = null, overlayEl = null, overlayOpen = false;
  function overlayFocusables() {
    return NG.util.$$('button:not([hidden]),input,a[href]', overlayEl).filter(function (el) { return el.offsetParent !== null; });
  }
  function buildOverlay() {
    overlayEl = document.createElement('div');
    overlayEl.className = 'search-overlay';
    overlayEl.setAttribute('role', 'dialog');
    overlayEl.setAttribute('aria-modal', 'true');
    overlayEl.setAttribute('aria-label', 'Хайх');

    document.body.appendChild(overlayEl);
    uidCounter++;

      mobile: true, inputId: 'search-overlay-input-' + uidCounter,
      listId: 'search-overlay-listbox-' + uidCounter, panelId: 'search-overlay-panel-' + uidCounter,
      onCloseOverlay: closeOverlay
    });
    overlayEl.querySelector('.search-overlay-close').addEventListener('click', function () { closeOverlay(true); });
    overlayEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); closeOverlay(true); return; }
      if (ev.key !== 'Tab') return;
      var f = overlayFocusables(); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    });
  }
  function wireMobile() {
    var btn = document.getElementById('search-open');
    if (!btn) return;
    btn.setAttribute('aria-haspopup', 'dialog');
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', function () { if (!overlayEl) buildOverlay(); openOverlay(); });
    try {
      var mq = window.matchMedia('(min-width: 881px)');
      var onMq = function () { if (mq.matches && overlayOpen) closeOverlay(false); };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
    } catch (e) { /* ignore */ }
  }
  function openOverlay() {
    overlayOpen = true;
    document.body.classList.add('is-search-open');
    document.documentElement.classList.add('is-search-locked');
    var btn = document.getElementById('search-open'); if (btn) btn.setAttribute('aria-expanded', 'true');
    if (overlayWidget) overlayWidget.focusInput(); /* same task as the click: keeps the mobile keyboard */
  }
  function closeOverlay(returnFocus) {
    if (!overlayOpen) return;
    overlayOpen = false;
    if (overlayWidget) overlayWidget.close();
    document.body.classList.remove('is-search-open');
    document.documentElement.classList.remove('is-search-locked');
    var btn = document.getElementById('search-open');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); if (returnFocus) { try { btn.focus(); } catch (e) { /* ignore */ } } }
  }

  function mount(hostEl) {
    if (hostEl) {
      uidCounter++;
      createWidget(hostEl, { mobile: false, inputId: 'search-input-' + uidCounter, listId: 'search-listbox-' + uidCounter, panelId: 'search-panel-' + uidCounter });
    }
    wireMobile();
    document.addEventListener('ng:route', function (ev) {
      var route = ev.detail;
      var q = (route && route.name === 'products' && route.query && route.query.q) ? route.query.q : '';
      closeOverlay(false); /* the router has already moved focus to the new page */
      widgets.forEach(function (w) { w.close(); w.setQuery(q); });
    });
  }

  NG.search = { mount: mount, normalize: normalize, rank: rank, suggest: suggest, highlight: highlight };
})();

      '<div class="sheet-inner">' +

      '<button type="button" class="icon-btn sheet-close" aria-label="Хаах">' + U.icon('close') + '</button></div>' +
      '<h2 class="sheet-heading" id="sheet-title">Ангилал</h2>' +
      '<ul class="sheet-rows" role="list">' + categoriesData().map(sheetRowHTML).join('') + '</ul>' +
      '<div class="sheet-links">' +
      '<a class="link-arrow" href="#/products"><span>Бүх бүтээгдэхүүн</span>' + U.icon('arrow-right') + '</a>' +
      '<a class="link-arrow sheet-saved-link" href="#/saved"><span>Хадгалсан (' + NG.saved.count() + ')</span>' + U.icon('arrow-right') + '</a>' +
      '<button type="button" class="link-arrow sheet-replay"><span>Интро дахин үзэх</span>' + U.icon('arrow-right') + '</button>' +
      '</div><div class="sheet-pwa" data-pwa-slot></div></div>';
    doc.body.appendChild(sheet);
    U.$('.sheet-close', sheet).addEventListener('click', function () { closeSheet(true); });
    U.$('.sheet-replay', sheet).addEventListener('click', function () { closeSheet(false); NG.router.replayIntro(); });
    /* any link closes the sheet (also when it points at the current route, where no ng:route follows) */
    sheet.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (a) closeSheet(a.getAttribute('href') === location.hash);
    });
    sheet.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSheet(true); return; }
      if (e.key === 'Tab') {
        var f = sheetFocusables(sheet);
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (doc.activeElement === first || !sheet.contains(doc.activeElement))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (doc.activeElement === last || !sheet.contains(doc.activeElement))) { e.preventDefault(); first.focus(); }
      }
    });
    return sheet;
  }
  function openSheet(opener) {
    var sheet = doc.getElementById('sheet') || buildSheet();
    closeMega(false);
    updateSavedCounts();
    renderPwaSlot(U.$('[data-pwa-slot]', sheet));
    sheet.hidden = false; sheetOpen = true; sheetOpener = opener || doc.activeElement;
    var btn = doc.getElementById('sheet-open'); if (btn) btn.setAttribute('aria-expanded', 'true');
    doc.documentElement.classList.add('is-sheet-open');
    U.$('.sheet-close', sheet).focus();
  }
  function closeSheet(returnFocus) {
    if (!sheetOpen) return;
    var sheet = doc.getElementById('sheet');
    if (sheet) sheet.hidden = true;
    sheetOpen = false;
    var btn = doc.getElementById('sheet-open'); if (btn) btn.setAttribute('aria-expanded', 'false');
    doc.documentElement.classList.remove('is-sheet-open');
    if (returnFocus && sheetOpener && sheetOpener.focus) sheetOpener.focus();
  }

  /* ---------------------------------------------------------------- footer */
  function footerHTML() {
    return '<div class="footer-dark dark-zone">' +
      '<div class="container footer-grid">' +
      '<div class="footer-brand">' + logoHTML('span', 'footer-logo') +
      '<p class="t-meta footer-tag">Сүсэг бишрэлийн бүтээгдэхүүний цахим лавлах</p></div>' +
      '<nav class="footer-links" aria-label="Хөлийн цэс">' +
      '<a href="#/products">Каталог</a>' +
      '<button type="button" id="footer-cat-open">Ангилал</button>' +
      '<a href="#/saved">Хадгалсан</a>' +
      '<button type="button" id="footer-replay">Интро дахин үзэх</button>' +
      '</nav>' +
      '<div class="footer-orn orn-rule" aria-hidden="true">' + U.icon('ulzii', 'orn') + '</div>' +
      '</div>' +
      '<div class="container footer-bottom t-meta">' +
      '<span>© 2026 Ногоолин</span><span>Prototype D · жишээ өгөгдөл: нэр, үнэ, хэмжээ бүгд жишээ</span>' +
      '<span>Онлайн захиалга, төлбөр, хүргэлт одоогоор идэвхгүй</span></div></div>';
  }

  /* ---------------------------------------------------------------- hero overlay */
  var heroObserver = null;
  function setupHeroObserver() {
    if (heroObserver) { heroObserver.disconnect(); heroObserver = null; }
    var hero = doc.getElementById('hero'), nav = doc.getElementById('nav');
    if (!hero || !nav || hero.hidden || !('IntersectionObserver' in window)) { if (nav) nav.classList.remove('is-over-hero'); return; }
    var navH = nav.offsetHeight || 64;
    heroObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { nav.classList.toggle('is-over-hero', e.isIntersecting && e.intersectionRect.height > 0); });
    }, { rootMargin: '-' + navH + 'px 0px 0px 0px', threshold: [0, 0.001] });
    heroObserver.observe(hero);
  }

  /* ---------------------------------------------------------------- prototype palette switcher */
  function swatchesHTML(id) {
    return '<span class="proto-swatches" data-palette-scope="' + id + '" aria-hidden="true">' +
      '<span style="background:var(--dark-1)"></span><span style="background:var(--btn-bg)"></span><span style="background:var(--gold)"></span></span>';
  }
  function optionHTML(p) {
    var r = NG.contrast.results[p.id];
    var okCount = r.filter(function (x) { return x.pass; }).length;
    return '<label class="proto-opt">' +
      '<input type="radio" name="proto-palette" value="' + p.id + '"' + (p.id === activePalette ? ' checked' : '') + '>' +
      '<span class="proto-opt-body">' +
      '<span class="proto-strip" data-palette-scope="' + p.id + '" aria-hidden="true">' +
      '<span style="background:var(--dark-1)"></span><span style="background:var(--btn-bg)"></span><span style="background:var(--gold)"></span>' +
      '<span style="background:var(--accent)"></span><span style="background:var(--bg)"></span></span>' +
      '<span class="proto-opt-name t-ui">' + U.esc(p.name) + '</span>' +
      '<span class="proto-opt-desc t-meta">' + U.esc(p.desc) + '</span>' +
      '<span class="proto-opt-score t-meta">AA ' + okCount + '/' + r.length + '</span>' +
      '</span></label>';
  }
  function contrastTableHTML() {
    var rows = NG.contrast.results[activePalette] || [];
    var trs = rows.map(function (r) {
      return '<tr><td>' + U.esc(r.label) + '</td><td class="num">' + r.ratio.toFixed(1) + ':1</td><td class="num">' + r.min + ':1</td><td>' +
        (r.pass ? '<span aria-hidden="true">✓</span><span class="sr-only">тэнцсэн</span>' : '<span aria-hidden="true">✗</span><span class="sr-only">тэнцээгүй</span>') + '</td></tr>';
    }).join('');
    var note = activePalette === 'v4' ? '<p class="t-meta proto-v4-note">v4-ийн AA засвар: --muted #6B7D72 нь цагаан дээр 4.37:1 тул хоёрдогч текст #5E7066 · --act #0BB555 зөвхөн товчны дэвсгэр (бичигт 2.71:1) · --saff-deep #A9861B зөвхөн зураас, чимэглэл.</p>' : '';
    var name = (PALETTES.filter(function (p) { return p.id === activePalette; })[0] || {}).name || activePalette;
    return '<table class="proto-contrast"><caption class="proto-caption t-meta">Хэмжсэн WCAG харьцаа · ' + U.esc(name) + '</caption>' +
      '<thead><tr><th scope="col">Хос</th><th scope="col">Харьцаа</th><th scope="col">Босго</th><th scope="col">AA</th></tr></thead><tbody>' + trs + '</tbody></table>' + note;
  }
  function panelHTML() {
    var s = NG.proto.state();
    return (
      '<div class="proto-panel-inner">' +
      '<div class="proto-panel-head"><h2 class="proto-title" id="proto-title">Prototype D · Өнгөний хувилбар</h2><button type="button" class="icon-btn proto-close" aria-label="Хаах">' + U.icon('close') + '</button></div>' +
      '<fieldset class="proto-palettes"><legend class="sr-only">Өнгөний хувилбар сонгох</legend>' + PALETTES.map(optionHTML).join('') + '</fieldset>' +
      '<div class="proto-contrast-wrap">' + contrastTableHTML() + '</div>' +
      '<div class="proto-sim"><h3 class="t-ui">Төлөв турших</h3>' +
      '<button type="button" class="proto-switch" id="proto-slow" role="switch" aria-checked="' + !!s.slow + '">Удаан сүлжээ</button>' +
      '<button type="button" class="proto-switch" id="proto-catalog-error" role="switch" aria-checked="' + !!s.catalogError + '">Каталогийн алдаа</button>' +
      '<button type="button" class="proto-switch" id="proto-authed" role="switch" aria-checked="' + NG.auth.is() + '">Нэвтэрсэн (prototype)</button>' +
      '<fieldset class="proto-submit"><legend>Хүсэлт илгээхэд</legend>' +
      [['ok', 'Хэвийн'], ['network', 'Сүлжээний алдаа'], ['offline', 'Офлайн'], ['ratelimit', 'Хэт олон хүсэлт']].map(function (kv) {
        return '<label class="proto-radio"><input type="radio" name="proto-submit" value="' + kv[0] + '"' + (s.submit === kv[0] ? ' checked' : '') + '> ' + kv[1] + '</label>';
      }).join('') + '</fieldset>' +
      '<div class="proto-sim-actions">' +
      '<button type="button" class="btn btn-quiet" id="proto-replay">Интро дахин үзэх</button>' +
      '<button type="button" class="btn btn-quiet" id="proto-clear-saved">Хадгалсныг цэвэрлэх</button>' +
      '</div></div></div>'
    );
  }
  function syncPanel() {
    if (!panelOpen) return;
    var panel = doc.getElementById('proto-panel');
    var s = NG.proto.state();
    function setSw(id, v) { var el = doc.getElementById(id); if (el) el.setAttribute('aria-checked', String(!!v)); }
    setSw('proto-slow', s.slow); setSw('proto-catalog-error', s.catalogError); setSw('proto-authed', NG.auth.is());
    U.$$('input[name="proto-submit"]', panel).forEach(function (r) { r.checked = r.value === s.submit; });
    U.$$('input[name="proto-palette"]', panel).forEach(function (r) { r.checked = r.value === activePalette; });
    var wrap = U.$('.proto-contrast-wrap', panel);
    if (wrap) wrap.innerHTML = contrastTableHTML();
  }
  function bindPanel() {
    var panel = doc.getElementById('proto-panel');
    U.$('.proto-close', panel).addEventListener('click', function () { closePanel(true); });
    U.$$('input[name="proto-palette"]', panel).forEach(function (r) {
      r.addEventListener('change', function () { if (r.checked) applyPalette(r.value); });
    });
    U.$$('input[name="proto-submit"]', panel).forEach(function (r) {
      r.addEventListener('change', function () { if (r.checked) NG.proto.set('submit', r.value); });
    });
    U.$('#proto-slow', panel).addEventListener('click', function () { NG.proto.set('slow', !NG.proto.get('slow')); syncPanel(); });
    U.$('#proto-catalog-error', panel).addEventListener('click', function () { NG.proto.set('catalogError', !NG.proto.get('catalogError')); syncPanel(); });
    U.$('#proto-authed', panel).addEventListener('click', function () { if (NG.auth.is()) NG.auth.logout(); else NG.auth.login(); });
    U.$('#proto-replay', panel).addEventListener('click', function () { closePanel(false); NG.router.replayIntro(); });
    U.$('#proto-clear-saved', panel).addEventListener('click', function () { NG.saved.clear(); U.announce('Хадгалсан жагсаалт цэвэрлэгдлээ'); });
  }
  function buildProtoRoot() {
    var root = doc.getElementById('proto-root');
    root.innerHTML =
      '<button type="button" id="proto-toggle" class="proto-fab" aria-haspopup="dialog" aria-controls="proto-panel" aria-expanded="false">' +
      '<span class="proto-fab-label t-ui">Өнгө</span>' + swatchesHTML(activePalette) + '</button>' +
      '<div id="proto-panel" class="proto-panel" role="dialog" aria-labelledby="proto-title" hidden></div>';
    doc.getElementById('proto-toggle').addEventListener('click', function () { if (panelOpen) closePanel(true); else openPanel(); });
    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panelOpen && !doc.querySelector('.pwa-dialog')) { e.preventDefault(); closePanel(true); }
    });
    doc.addEventListener('click', function (e) {
      if (!panelOpen || !e.target.isConnected) return;
      if (e.target.closest('#proto-panel') || e.target.closest('#proto-toggle')) return;
      closePanel(false);
    });
  }
  function openPanel() {
    var panel = doc.getElementById('proto-panel');
    panel.innerHTML = panelHTML();
    panelOpen = true;
    bindPanel();
    panel.hidden = false;
    doc.getElementById('proto-toggle').setAttribute('aria-expanded', 'true');
    var first = U.$('input[name="proto-palette"]:checked', panel) || U.$('.proto-close', panel);
    if (first) first.focus();
  }
  function closePanel(returnFocus) {
    var panel = doc.getElementById('proto-panel');
    var hadFocus = panel && panel.contains(doc.activeElement);
    if (panel) { panel.hidden = true; panel.innerHTML = ''; }
    panelOpen = false;
    var t = doc.getElementById('proto-toggle');
    t.setAttribute('aria-expanded', 'false');
    if (returnFocus || hadFocus) t.focus();
  }
  function setThemeColor() {
    try {
      var meta = doc.querySelector('meta[name="theme-color"]');
      var dark1 = getComputedStyle(doc.documentElement).getPropertyValue('--dark-1').trim();
      if (meta && dark1) meta.setAttribute('content', dark1);
    } catch (e) { /* ignore */ }
  }
  function applyPalette(id) {
    if (PALETTE_IDS.indexOf(id) < 0) return;
    activePalette = id;
    doc.documentElement.dataset.palette = id;
    U.store.set('nogoolin-palette', id);
    setThemeColor();
    var fab = doc.getElementById('proto-toggle');
    if (fab) { var sw = U.$('.proto-swatches', fab); if (sw) sw.setAttribute('data-palette-scope', id); }
    syncPanel();
    U.emit('ng:palette', { id: id });
  }

  /* ---------------------------------------------------------------- PWA hint (FR-PWA-130) */
  var deferredInstallPrompt = null;
  try {
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstallPrompt = e; });
    window.addEventListener('appinstalled', function () { deferredInstallPrompt = null; renderAllPwaSlots(); });
  } catch (e) { /* ignore */ }
  function isStandalone() {
    try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; }
  }
  function pwaDismissed() { return U.store.get('nogoolin-install-dismissed', false, true) === true; }
  function pwaBandHTML() {
    return '<div class="pwa-band">' +
      '<span class="pwa-icon dark-zone" aria-hidden="true">' + U.icon('halo', 'nav-halo') + '</span>' +
      '<div class="pwa-copy"><p class="pwa-title">Ногоолиныг апп болгон суулгах</p>' +
      '<p class="t-meta">Утасныхаа нүүр дэлгэцээс нэг товшилтоор нээгдэнэ.</p></div>' +
      '<div class="pwa-actions"><button type="button" class="btn btn-primary pwa-install">Суулгах</button>' +
      '<button type="button" class="btn btn-quiet pwa-dismiss">Дараа</button></div></div>';
  }
  function pwaDialogHTML() {
    return '<div class="pwa-dialog-inner"><h2 class="t-h3" id="pwa-dialog-title">Апп болгон суулгах</h2>' +
      '<p>iPhone Safari: «Хуваалцах → Нүүр дэлгэцэд нэмэх».</p><p>Android Chrome: «⋮ цэс → Апп суулгах».</p>' +
      '<p class="t-meta pwa-note">Prototype: manifest, service worker нь бодит хувилбарт (FR-PWA-110, FR-PWA-210).</p>' +
      '<button type="button" class="btn btn-quiet pwa-dialog-close">Хаах</button></div>';
  }
  function openPwaDialog() {
    var opener = doc.activeElement;
    var dlg = doc.createElement('div');
    dlg.className = 'pwa-dialog'; dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true'); dlg.setAttribute('aria-labelledby', 'pwa-dialog-title');
    dlg.innerHTML = pwaDialogHTML();
    doc.body.appendChild(dlg);
    var closeBtn = U.$('.pwa-dialog-close', dlg);
    function close() {
      doc.removeEventListener('keydown', onKey, true);
      if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
      if (opener && opener.focus && opener.isConnected) opener.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      else if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); } /* the dialog has one control: keep focus on it */
    }
    doc.addEventListener('keydown', onKey, true);
    closeBtn.addEventListener('click', close);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });
    closeBtn.focus();
  }
  function renderPwaSlot(slot) {
    if (!slot) return;
    if (isStandalone() || pwaDismissed()) { slot.innerHTML = ''; slot.hidden = true; return; }
    slot.hidden = false;
    slot.innerHTML = pwaBandHTML();
    U.$('.pwa-install', slot).addEventListener('click', function () {
      if (deferredInstallPrompt && deferredInstallPrompt.prompt) {
        var ev = deferredInstallPrompt; deferredInstallPrompt = null;
        try { ev.prompt(); } catch (e) { openPwaDialog(); }
      } else { openPwaDialog(); }
    });
    U.$('.pwa-dismiss', slot).addEventListener('click', function () {
      U.store.set('nogoolin-install-dismissed', true, true);
      renderAllPwaSlots();
      U.announce('Суулгах санал нуугдлаа');
    });
  }
  function renderAllPwaSlots() { U.$$('[data-pwa-slot]').forEach(renderPwaSlot); }
  NG.pwa = { render: renderPwaSlot };

  /* ---------------------------------------------------------------- mount */
  NG.chrome = {
    mount: function () {
      doc.documentElement.dataset.palette = activePalette;
      computeContrast();
      setThemeColor();
      doc.getElementById('nav').innerHTML = headerHTML();
      doc.getElementById('footer').innerHTML = footerHTML();
      buildProtoRoot();
      buildMega();
      buildSheet();

      var trigger = doc.getElementById('cat-trigger');
      trigger.addEventListener('click', function () { if (megaOpen) closeMega(false); else openMega(); });
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); openMega(); var first = U.$('#mega .mega-row'); if (first) first.focus(); }
        else if (e.key === 'Escape' && megaOpen) { e.preventDefault(); e.stopPropagation(); closeMega(true); }
      });
      doc.getElementById('sheet-open').addEventListener('click', function (e) { openSheet(e.currentTarget); });
      doc.getElementById('footer-cat-open').addEventListener('click', function (e) {
        if (isMobile()) openSheet(e.currentTarget);
        else { openMega(); var first = U.$('#mega .mega-row'); if (first) first.focus(); }
      });
      doc.getElementById('footer-replay').addEventListener('click', function () { NG.router.replayIntro(); });

      doc.addEventListener('click', function (e) {
        if (!megaOpen || !e.target.isConnected) return;
        if (e.target.closest('#mega') || e.target.closest('#cat-trigger') || e.target.closest('#footer-cat-open')) return;
        closeMega(false);
      });
      doc.addEventListener('focusin', function (e) {
        if (!megaOpen) return;
        if (e.target.closest('#mega') || e.target.closest('#cat-trigger') || e.target.closest('#footer-cat-open')) return;
        closeMega(false);
      });

      doc.addEventListener('ng:saved', updateSavedCounts);
      doc.addEventListener('ng:auth', function () { updateSavedCounts(); syncPanel(); });
      doc.addEventListener('ng:proto', syncPanel);
      doc.addEventListener('ng:route', function () {
        closeMega(false); closeSheet(false); /* the router moves focus to the new page's h1 */
        updateHeaderState();
        setupHeroObserver();
        renderAllPwaSlots();
      });

      updateHeaderState();
      setupHeroObserver();
      window.addEventListener('resize', U.debounce(function () {
        setupHeroObserver();
        if (isMobile()) closeMega(false); else closeSheet(false);
      }, 150));
    }
  };
})();

</script>
<script>
/* ===== views.js ===== */
/* Nogoolin Prototype D — views.js (owner: lead).
   Views on NG.router: home sections, categories, catalog + search results, product detail (gallery, zoom and
   on-image dimensions drawn from structured fields, D-09), inquiry (FR-INQ-140…170), saved list (FR-WISH-100…150),
   prototype login gate (FR-WISH-110), confirmation (FR-INQ-150) and not found. Tokens only; sample data. */
(function () {
  'use strict';
  var NG = window.NG = window.NG || {};
  var D = NG.data, U = NG.util, R = NG.router;
  var esc = U.esc, ic = U.icon, money = D.money;
  var doc = document;
  var SITE = 'Ногоолин · Prototype D';
  var SZ_CARD = '(min-width:1100px) 300px, (min-width:760px) 33vw, 50vw';
  var SZ_MAIN = '(min-width:960px) 56vw, 100vw';
  var DRAFT_KEY = 'nogoolin-inq-draft';
  var LAST_KEY = 'nogoolin-last-inquiry';
  var KNOT_D = 'M19.06 56.19L56.19 19.06A8.75 8.75 0 1 0 43.81 19.06L80.94 56.19A8.75 8.75 0 1 0 80.94 43.81L43.81 80.94A8.75 8.75 0 1 0 56.19 80.94L19.06 43.81A8.75 8.75 0 1 0 19.06 56.19Z';
  var KNOT_GAPS = 'M22.75 52.5L27.75 47.5M47.5 22.75L52.5 27.75M77.25 47.5L72.25 52.5M52.5 77.25L47.5 72.25';

  /* ================================================================ helpers */
  function appEl() { return doc.getElementById('app'); }
  function done(ctx) { if (ctx && typeof ctx.done === 'function') ctx.done(); }
  function alive(ctx) { return !(ctx && typeof ctx.alive === 'function') || ctx.alive(); }
  function byOrder(a, b) { return a.order - b.order; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function attrs(o) {
    var s = '';
    Object.keys(o).forEach(function (k) {
      var v = o[k];
      if (v === false || v == null) return;
      s += ' ' + k + (v === true ? '' : '="' + esc(v) + '"');
    });
    return s;
  }
  function srcsetOf(file) { return D.img(file, { thumb: true }) + ' 384w, ' + D.img(file) + ' 1280w'; }
  function pimg(file, alt, o) {
    o = o || {};
    return '<img' + attrs({
      'class': o.cls || null,
      src: o.full ? D.img(file) : D.img(file, { thumb: true }),
      srcset: srcsetOf(file), sizes: o.sizes || '50vw',
      width: 1280, height: 1600, alt: alt || '',
      loading: o.eager ? null : 'lazy', decoding: 'async', fetchpriority: o.eager ? 'high' : null,
      'aria-hidden': o.hidden ? 'true' : null, draggable: 'false'
    }) + '>';
  }
  /* one backdrop for every product photo (tokens.css .plinth) */
  function plinth(file, alt, o) {
    o = o || {};
    var tag = o.tag || 'div';
    return '<' + tag + attrs({ 'class': 'plinth ' + (o.ratio || 'r-4x5') + (o.cls ? ' ' + o.cls : ''), 'data-vt-media': o.vt || null }) + '>' +
      pimg(file, alt, o) + (o.extra || '') + '</' + tag + '>';
  }
  function ulzii(cls) {
    return '<svg class="orn' + (cls ? ' ' + cls : '') + '" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#i-ulzii"></use></svg>';
  }
  function crumbs(trail) {

  function bindInquiry(main, I) {
    var form = main.querySelector('[data-inq-form]'); if (!form) return;
    var name = form.querySelector('#inq-name'), phone = form.querySelector('#inq-phone'), msg = form.querySelector('#inq-msg');
    var alertEl = form.querySelector('[data-form-alert]'), submit = form.querySelector('[data-inq-submit]');
    var MAP = { customer_name: 'inq-name', phone: 'inq-phone', message: 'inq-msg' };
    var tried = false, busy = false;
    function body() {
      return { customer_name: name.value.trim(), phone: normPhone(phone.value), message: msg.value.trim(), product_id: I.items.length === 1 && I.from === 'product' ? I.items[0].p.id : undefined };
    }
    function saveDraft() {
      var dr = U.store.get(DRAFT_KEY, {}, true) || {};
      dr.name = name.value; dr.phone = phone.value; dr.msg = dr.msg || {}; dr.msg[I.key] = msg.value;
      U.store.set(DRAFT_KEY, dr, true);
    }
    function setErr(id, text) {
      var f = form.querySelector('[data-field="' + id + '"]'), input = form.querySelector('#' + id);
      var m = form.querySelector('#' + id + '-err'), hint = form.querySelector('#' + id + '-hint');
      f.classList.toggle('is-invalid', !!text);
      if (text) { m.innerHTML = ic('alert') + '<span>' + esc(text) + '</span>'; m.hidden = false; input.setAttribute('aria-invalid', 'true'); }
      else { m.hidden = true; m.innerHTML = ''; input.removeAttribute('aria-invalid'); }
      var ids = []; if (hint) ids.push(hint.id); if (text) ids.push(m.id);
      if (ids.length) input.setAttribute('aria-describedby', ids.join(' ')); else input.removeAttribute('aria-describedby');
    }
    function showErrs(errs) { Object.keys(MAP).forEach(function (k) { setErr(MAP[k], errs && errs[k]); }); }
    function keyOf(el) { return el === name ? 'customer_name' : el === phone ? 'phone' : 'message'; }
    [name, phone, msg].forEach(function (el) {
      el.addEventListener('input', function () {
        if (el === phone) { var d = phone.value.replace(/[^\d]/g, ''); if (d !== phone.value) phone.value = d; }   /* D-10: digits only */
        saveDraft();
        if (tried || el.getAttribute('aria-invalid') === 'true') { var e = D.validateInquiry(body()); setErr(MAP[keyOf(el)], e && e[keyOf(el)]); }   /* FR-INQ-140 acc. 3 */
      });
      el.addEventListener('blur', function () {
        if (el === phone && phone.value) { phone.value = normPhone(phone.value); saveDraft(); }
        if (el.value.trim()) { var e = D.validateInquiry(body()); setErr(MAP[keyOf(el)], e && e[keyOf(el)]); }
      });
    });
    function setBusy(on) {
      busy = on;
      submit.disabled = on;                        /* FR-INQ-150: disabled + «Илгээж байна…»; no double submit */
      submit.classList.toggle('is-busy', on);
      submit.textContent = on ? 'Илгээж байна…' : 'Хүсэлт илгээх';
      form.setAttribute('aria-busy', String(on));
    }
    function send() {
      setBusy(true);
      var b = body();
      NG.api.submitInquiry(b).then(function (res) {
        var d = res.data;
        U.store.set(LAST_KEY, { number: d.number, name: b.customer_name, phone: b.phone, created_at: d.created_at,
          items: I.items.map(function (x) { return { slug: x.p.slug, name: x.p.name, variant: x.v ? x.v.label : null }; }) }, true);
        var dr = U.store.get(DRAFT_KEY, {}, true) || {}; if (dr.msg) delete dr.msg[I.key]; U.store.set(DRAFT_KEY, dr, true);
        R.go(R.href('sent', { id: d.number }), { replace: true });
      }, function (err) {
        setBusy(false);
        if (err && err.code === 'VALIDATION_ERROR' && err.fields) { showErrs(err.fields); focusEl(form.querySelector('[aria-invalid="true"]')); return; }
        var text = INQ_ERR[err && err.code] || INQ_ERR.NETWORK;
        alertEl.innerHTML = ic('alert') + '<div><p>' + esc(text) + '</p><p class="field-hint">Таны бичсэн мэдээлэл хадгалагдсан.</p>' +
          '<button type="button" class="btn btn-quiet" data-resend>Дахин оролдох</button></div>';
        alertEl.hidden = false;
        try { alertEl.focus(); } catch (x) { /* ignore */ }
      });
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      tried = true;
      if (phone.value) phone.value = normPhone(phone.value);
      alertEl.hidden = true;
      var errs = D.validateInquiry(body());
      showErrs(errs);
      if (errs) {
        focusEl(form.querySelector('[aria-invalid="true"]'));
        U.announce(Object.keys(errs).length + ' талбарыг засна уу');
        return;
      }
      send();
    });
    alertEl.addEventListener('click', function (e) { if (e.target.closest('[data-resend]') && !busy) { alertEl.hidden = true; send(); } });
  }
  R.register('inquiry', { title: function () { return 'Хүсэлт илгээх'; }, render: renderInquiry });

  function toggleCardSave(btn) {
    var slug = btn.getAttribute('data-save'), p = D.product(slug); if (!p) return;
    if (savedAny(slug)) {
      NG.saved.list().filter(function (it) { return it.slug === slug; }).forEach(function (it) { NG.saved.remove(it.slug, it.variant); });
      toastSaved(false, p, null);
      return;

    NG.saved.add(slug, null);

  }

    main.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-save],[data-pd-save],[data-retry],[data-remove],[data-filter],[data-unfilter],[data-logout]');
      if (!t || !main.contains(t)) return;
      if (t.hasAttribute('data-save')) { e.preventDefault(); toggleCardSave(t); }
      else if (t.hasAttribute('data-pd-save') && PD) {
        var vid = PD.v ? PD.v.id : null;
        if (!NG.saved.has(PD.p.slug, vid) && gateSave(PD.p.slug, vid)) return;
        toastSaved(NG.saved.toggle(PD.p.slug, vid), PD.p, PD.v);
        focusEl(main.querySelector('[data-pd-save]'));
      }
      else if (t.hasAttribute('data-retry')) retry();
      else if (t.hasAttribute('data-filter')) {
        var patch = {}; patch[t.getAttribute('data-filter')] = t.getAttribute('aria-pressed') === 'true' ? null : t.getAttribute('data-val');
        R.go(R.href('products', null, patchQ(L.q, patch)));

        var un = {}; un[t.getAttribute('data-unfilter')] = null;

        if (p) toastSaved(false, p, v);
        var left = U.$$('[data-remove]', main);
        focusEl(left.length ? left[Math.min(at, left.length - 1)] : main.querySelector('.state .btn') || main.querySelector('h1'));
      }
      else if (t.hasAttribute('data-logout')) NG.auth.logout();
    });
    main.addEventListener('change', function (e) {
      var t = e.target;
      if (t.matches && t.matches('[data-sort]')) {
        var def = L.q && L.q.q ? 'relevance' : 'newest';
        R.go(R.href('products', null, patchQ(L.q, { sort: t.value === def ? null : t.value })));
      } else if (t.name === 'pd-variant' && t.checked && PD) {
        R.go(R.href('product', { slug: PD.p.slug }, { variant: t.value }), { replace: true });
      }
    });
  }
  function rerenderIf(names) {
    var r = R.current; if (!r || names.indexOf(r.name) < 0) return;
    var m = appEl();
    if (r.name === 'saved') renderSaved(r, { main: m });
    else if (r.name === 'product') syncDetailSave(m);
  }
  doc.addEventListener('ng:saved', function () {
    U.$$('[data-save]').forEach(function (b) {
      var on = savedAny(b.getAttribute('data-save'));
      b.setAttribute('aria-pressed', String(on));
      var u = b.querySelector('use'); if (u) u.setAttribute('href', '#i-' + (on ? 'heart-fill' : 'heart'));
    });
    rerenderIf(['saved', 'product']);
  });
  doc.addEventListener('ng:auth', function () { rerenderIf(['saved', 'product']); });
  doc.addEventListener('ng:proto', function () {
    var r = R.current; if (!r) return;
    if (r.name === 'products') loadResults(listQuery(r.query), { main: appEl() }, false);
    else if (r.name === 'product') { PD = null; renderDetail(r, { main: appEl() }); }
  });
  /* warm the product cache so list → detail renders synchronously and the shared photo can morph (view transition) */
  setTimeout(function () { NG.api.products({ limit: 50 }).catch(function () { /* shown by the views on demand */ }); }, 900);
})();

</script>
<script>
/* ===== boot.js ===== */
/* Nogoolin Prototype D — boot.js (owner: lead) */
(function () {
  'use strict';
  var NG = window.NG || {};
  try { if (NG.chrome && NG.chrome.mount) NG.chrome.mount(); } catch (e) { console.error('[chrome]', e); }
  try { if (NG.search && NG.search.mount) NG.search.mount(document.getElementById('site-search')); } catch (e) { console.error('[search]', e); }
  NG.router.start();
})();

</script>
