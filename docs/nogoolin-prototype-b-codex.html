function updateFilters(change){const raw=location.hash.split('?')[1]||'',p=new URLSearchParams(raw);Object.entries(change).forEach(([k,v])=>v&&v!=='Бүгд'?p.set(k,v):p.delete(k));p.delete('focus');const hash='#/catalog'+(p.size?'?'+p.toString():'');history.replaceState(null,'',hash);filterCatalog(p)}
document.addEventListener('click',e=>{
 if(e.target.closest('.skip-link')){e.preventDefault();main.focus();return}
 const category=e.target.closest('[data-category]');if(category){updateFilters({category:category.dataset.category});return}
 const control=e.target.closest('[data-action]');if(!control)return;
 if(control.dataset.action==='reset'){const input=$('#catalog-search');if(input)input.value='';clearTimeout(searchTimer);updateFilters({q:'',category:''})}
 if(control.dataset.action==='search'){if($('#catalog-search'))$('#catalog-search').focus();else location.hash='/catalog?focus=search'}
});
document.addEventListener('input',e=>{
 if(e.target.id==='catalog-search'){clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>updateFilters({q}),180)}
 if(e.target.closest('#inquiry-form')&&e.target.hasAttribute('aria-invalid')){e.target.removeAttribute('aria-invalid');const err=document.getElementById(e.target.getAttribute('aria-describedby'));if(err)err.textContent=''}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='inquiry-form')return;e.preventDefault();if(pending)return;
 const form=e.target,data=new FormData(form);const tests=[['customer-name','error-name',String(data.get('customer_name')||'').trim().length>=2,'Нэрээ оруулна уу. Хамгийн багадаа 2 тэмдэгт бичнэ.'],['customer-phone','error-phone',/^\d{8}$/.test(String(data.get('phone')||'').trim()),'Утасны дугаар 8 оронтой байх ёстой.'],['customer-message','error-message',Boolean(String(data.get('message')||'').trim()),'Хүсэлтийн агуулгаа бичнэ үү.']];
 let first;tests.forEach(([field,error,valid,message])=>{const input=document.getElementById(field);input.setAttribute('aria-invalid',!valid);document.getElementById(error).textContent=valid?'':message;if(!valid&&!first)first=input});
 if(first){$('#form-status').textContent='Мэдээллээ шалгана уу.';first.focus();return}
 pending=true;const button=$('#submit-inquiry');button.disabled=true;button.textContent='Шалгаж байна…';form.setAttribute('aria-busy','true');$('#form-status').textContent='Туршилтын form-ыг шалгаж байна.';
 formTimer=setTimeout(()=>{const p=products.find(x=>x.id===form.dataset.product);if(!form.isConnected)return;form.reset();$('.inquiry-form-wrap').innerHTML=success(p);$('#success-title').focus();pending=false},450);
});
function loadThree(){if(window.THREE)return Promise.resolve(window.THREE);if(threePromise)return threePromise;threePromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';script.async=true;const timeout=setTimeout(()=>reject(new Error('3D load timeout')),7000);script.onload=()=>{clearTimeout(timeout);window.THREE?resolve(window.THREE):reject(new Error('3D unavailable'))};script.onerror=()=>{clearTimeout(timeout);reject(new Error('3D unavailable'))};document.head.append(script)});return threePromise}
async function initHero(){
 const stage=$('#hero-stage'),button=$('#motion-button'),status=$('#stage-status');let cancelled=false,renderer,scene,observer,frame=0,playing=false;
 heroCleanup=()=>{cancelled=true;cancelAnimationFrame(frame);observer?.disconnect();reduced.removeEventListener('change',onMotionChange);if(scene)scene.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}});renderer?.dispose();renderer?.domElement.remove()};
 function onMotionChange(){if(reduced.matches){cancelAnimationFrame(frame);playing=false}if(button){button.disabled=reduced.matches||!renderer;button.setAttribute('aria-label',reduced.matches?'Хөдөлгөөн багасгах тохиргоо идэвхтэй':'3D гэрлийн хөдөлгөөн үзэх')}if(renderer&&renderScene)renderScene()}
 let renderScene;
 try{
 const T=await loadThree();if(cancelled||!stage.isConnected)return;
 renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setClearColor(0x000000,0);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.domElement.setAttribute('aria-hidden','true');stage.append(renderer.domElement);
 scene=new T.Scene();const camera=new T.PerspectiveCamera(34,1,.1,50);camera.position.set(0,3.45,8.1);camera.lookAt(0,1.58,0);
 scene.add(new T.HemisphereLight(0xf9f4df,0x56634c,1.2));const key=new T.DirectionalLight(0xfff3d8,2.2);key.position.set(-3.2,6,4.5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=4;key.shadow.camera.bottom=-3;key.shadow.normalBias=.025;scene.add(key);const fill=new T.DirectionalLight(0xd5dfd1,.7);fill.position.set(4,2,1);scene.add(fill);
 const material=new T.MeshStandardMaterial({color:0x828c74,roughness:.82,metalness:.03});const baseMaterial=new T.MeshStandardMaterial({color:0xb6b5a1,roughness:1});
 const points=[[.35,0],[.39,.1],[.4,.24],[.45,.43],[.57,.65],[.67,.9],[.72,1.17],[.7,1.4],[.61,1.61],[.48,1.78],[.39,1.97],[.39,2.1],[.33,2.1],[.33,1.96],[.36,1.8]].map(([r,y])=>new T.Vector2(r,y));
 const vessel=new T.Mesh(new T.LatheGeometry(points,80),material);vessel.position.y=.36;vessel.castShadow=true;vessel.receiveShadow=true;scene.add(vessel);
 const dark=new T.Mesh(new T.CircleGeometry(.325,48),new T.MeshStandardMaterial({color:0x323f30,roughness:1}));dark.rotation.x=-Math.PI/2;dark.position.y=2.43;scene.add(dark);
 const foot=new T.Mesh(new T.CylinderGeometry(.4,.47,.1,64),material);foot.position.y=.39;foot.castShadow=true;scene.add(foot);
 const plinth=new T.Mesh(new T.CylinderGeometry(1.05,1.1,.24,80),baseMaterial);plinth.position.y=.18;plinth.castShadow=true;plinth.receiveShadow=true;scene.add(plinth);
 const stickMat=new T.MeshStandardMaterial({color:0x826646,roughness:.9});[-1,0,1].forEach((i)=>{const stick=new T.Mesh(new T.CylinderGeometry(.012,.015,1.2,8),stickMat);stick.position.set(i*.13,2.83,0);stick.rotation.z=-i*.16;stick.castShadow=true;scene.add(stick)});
 const ground=new T.Mesh(new T.PlaneGeometry(20,20),new T.ShadowMaterial({opacity:.17}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=.045;scene.add(ground);
 renderScene=()=>{if(!cancelled)renderer.render(scene,camera)};function resize(){if(cancelled)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();renderScene()}
 observer=new ResizeObserver(resize);observer.observe(stage);resize();stage.classList.add('ready');status.textContent='3D орлуулга · хэлбэрийн судалбар';button.disabled=reduced.matches;reduced.addEventListener('change',onMotionChange);onMotionChange();
 button.onclick=()=>{if(playing||reduced.matches)return;playing=true;button.disabled=true;const start=performance.now();function animate(now){if(cancelled)return;const t=Math.min((now-start)/2600,1),wave=Math.sin(t*Math.PI*2);key.position.x=-3.2+wave*1.65;fill.intensity=.7+Math.sin(t*Math.PI)*.3;renderScene();if(t<1&&!reduced.matches)frame=requestAnimationFrame(animate);else{key.position.x=-3.2;fill.intensity=.7;playing=false;button.disabled=reduced.matches;renderScene()}}frame=requestAnimationFrame(animate)};
 renderer.domElement.addEventListener('webglcontextlost',event=>{event.preventDefault();stage.classList.remove('ready');button.disabled=true;status.textContent='Хэлбэрийн судалбар · зураглал';cancelAnimationFrame(frame)});
 }catch(_error){if(!cancelled){renderer?.dispose();renderer?.domElement.remove();status.textContent='Хэлбэрийн судалбар · зураглал';button.disabled=true;button.setAttribute('aria-label','3D боломжгүй үед зураглал харуулж байна')}}
}
